# app-shell — the ratel Dioxus fullstack server for the DEV environment.
# Image: built by dev-workflow's build-images job with the REAL dev
# compile-time env (DYNAMO_TABLE_PREFIX=ratel-dev, DYNAMO_ENDPOINT=none →
# real AWS DynamoDB, real AWS creds baked via option_env!, no
# bypass/local-dev/lambda features), packaged with app/ratel/Dockerfile and
# pushed as ratel-app-shell:dev-<sha>. ${SHA_TAG} pins each deploy to its
# commit, which is what triggers the rolling update.
#
# Runtime env mirrors what the AWS path injected at RUNTIME:
#   - IP/PORT (the container listener, same as the compose/testing image)
#   - ratel-dev-secrets (envFrom, optional): LAUNCHPAD_* + QDRANT_API_KEY —
#     the exact set cdk/bin/cdk.ts used to inject into the Lambda runtime
#     env (read via std::env::var at runtime, no rebuild needed).
#   - GOOGLE_APPLICATION_CREDENTIALS + the optional ratel-dev-firebase
#     Secret volume: the FCM service-account JSON the lambda bundle carried
#     at .gcp/firebase-service-account.json. Optional — fcm.rs skips
#     gracefully when the file is missing (push disabled).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-shell
  namespace: ratel-dev
  labels:
    app: app-shell
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app-shell
  template:
    metadata:
      labels:
        app: app-shell
    spec:
      # qdrant (jemalloc) aborts on the Pi node's 16K page-size kernel,
      # so the Pi stays excluded — but main (arm64) and the dedicated
      # amd64 node are both fine (4K page size), so schedule on either
      # (multi-arch images make this possible; the amd64 node carries a
      # taint, hence the toleration below).
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: biyard.io/node-class
                    operator: In
                    values: ["main", "amd64"]
      tolerations:
        - key: biyard.io/arch
          operator: Equal
          value: amd64
          effect: NoSchedule
      containers:
        - name: app-shell
          image: registry.infra.svc.cluster.local:5000/ratel-app-shell:${SHA_TAG}
          imagePullPolicy: IfNotPresent # sha-unique tag — content never changes under it
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: IP
              value: 0.0.0.0
            - name: PORT
              value: "8080"
            # ICP replica. config/server/icp.rs checks std::env::var("IC_URL")
            # before the option_env! value baked at build time, so pointing the
            # app at the in-cluster subnet needs no rebuild — the image keeps
            # its compile-time default and this simply wins at runtime.
            #
            # Served by the `icp` chart (biyard/infra-helm-charts), deployed into the
            # shared `infra` namespace alongside postgres/minio/qdrant — a
            # 4-node subnet is four pods and four PVCs, too heavy to copy per
            # namespace, and the chain outlives any single app deployment
            # (a PR-preview namespace is torn down; its chain should not be).
            #
            # The Service load-balances across the replicas: every node in a
            # subnet holds the same state, so any of them can answer.
            - name: IC_URL
              value: http://icp.infra.svc.cluster.local:4100
            # Postgres migration: the app resolves its global pool from
            # DATABASE_URL and migrates the inventory schema on boot (with retry;
            # see common/run.rs). Reuses the shared infra Postgres — a dedicated
            # `ratel-dev` database keeps dev isolated from prod (`ratel`) and gives
            # the outbox poller's pg_advisory_lock its own per-database namespace.
            - name: DATABASE_URL
              value: postgres://ratel:ratel@postgres.infra.svc.cluster.local:5432/ratel-dev
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: /usr/src/app/.gcp/firebase-service-account.json
            # SNS SMS: ap-northeast-2 (Seoul, the default AWS_REGION) is still
            # in the SMS sandbox (verified numbers only), while
            # ap-northeast-1 (Tokyo) is out of sandbox with a real spend
            # limit. config/server/aws_sns.rs reads this at runtime
            # (std::env::var) before falling back to the compile-time
            # AWS_REGION, so this needs no rebuild.
            - name: SNS_REGION
              value: ap-northeast-1
          envFrom:
            - secretRef:
                name: ratel-dev-secrets
                optional: true
          volumeMounts:
            - name: firebase
              mountPath: /usr/src/app/.gcp
              readOnly: true
          # app-shell is API-only after the React frontend migration (see
          # docs/superpower/2026-09-14-react-frontend-migration.md § 5.1) —
          # `/` no longer exists. `/launchpad/health` is NOT a substitute:
          # it is POST-only (app/ratel/src/features/launchpad_partner/
          # server.rs:24 routes only `post(health)`, no GET) and every
          # request must carry a valid HMAC signature over
          # LAUNCHPAD_PARTNER_SECRET plus a matching project id
          # (server.rs:39-68 `verify_and_parse`), which an unauthenticated
          # kubelet probe cannot produce and which depends on config being
          # present. A bare TCP check on the listener is what's left that's
          # both unconditional and correct in every environment.
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
      volumes:
        - name: firebase
          secret:
            secretName: ratel-dev-firebase
            optional: true # absent secret ⇒ empty dir ⇒ FCM gracefully disabled
---
apiVersion: v1
kind: Service
metadata:
  name: app-shell
  namespace: ratel-dev
spec:
  selector:
    app: app-shell
  ports:
    - name: http
      port: 8080
      targetPort: 8080
