# app-shell — the ratel Dioxus fullstack server for PR previews, now on the
# SHARED infra backing services (shared-infra migration): the image is
# cross-compiled multi-arch (amd64+arm64) by build-image's buildkit step
# (app/ratel/Dockerfile — see the Dockerfile header for the xx-cargo
# cross-compile rationale) with FEATURES=server,bypass,design-preview, and
# pushed to the in-cluster registry as ratel-app-shell:pr-<num>.
#
# Backing services are no longer private per-PR Deployments (localstack,
# qdrant, postgres were deleted from this directory) — app-shell now talks
# to the SAME shared infra namespace dev/prod use:
#   - postgres.infra.svc.cluster.local:5432, database ratel_pr_${PR_NUM}
#     (role/database created by the e2e workflow before this manifest is
#     applied; see pr-workflow.yml's "Ensure the per-PR database ... exist"
#     step, mirroring dataroom's ci.yml deploy-pr job)
#   - qdrant.infra.svc.cluster.local:6333/6334, collection
#     ratel_pr_${PR_NUM}_main (created by 21-qdrant-init-job.yaml)
#   - redpanda-0.redpanda.infra.svc.cluster.local:9093, topic
#     pr-${PR_NUM}.ratel.cdc.v1 (consumed/produced by the ratel-events tier,
#     25-events.yaml)
# The old DYNAMO_ENDPOINT/localstack path and its AWS_* stand-in credentials
# are gone entirely — the app's DynamoDB client is vestigial (no live reads/
# writes; see app/ratel/src/common/config/server/dynamodb.rs) and needs no
# endpoint to construct successfully once DYNAMODB_ENDPOINT defaults to
# "none" at compile time (the image's default ARG — see the Dockerfile).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-shell
  namespace: ratel-pr-${PR_NUM}
  labels:
    app: app-shell
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-shell
  template:
    metadata:
      labels:
        app: app-shell
    spec:
      # qdrant (jemalloc) aborts on the Pi node's 16K page-size kernel,
      # so the Pi stays excluded — but main (arm64) and the dedicated
      # amd64 node are both fine (4K page size), so schedule on either
      # (multi-arch images make this possible; the amd64 node carries a
      # taint, hence the toleration below).
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: biyard.io/node-class
                    operator: In
                    values: ["main", "amd64"]
      tolerations:
        - key: biyard.io/arch
          operator: Equal
          value: amd64
          effect: NoSchedule
      initContainers:
        # Postgres migration: the app connects to Postgres and migrates its
        # schema on startup, so gate the app on the shared infra Postgres
        # being reachable AND this PR's database already existing (created
        # by the e2e workflow before this manifest is applied).
        - name: wait-for-postgres
          image: postgres:16-alpine
          env:
            - name: PGPASSWORD
              value: ratel
          command:
            - sh
            - -c
            - |
              until pg_isready -h postgres.infra.svc.cluster.local -p 5432 -U ratel -d ratel_pr_${PR_NUM} >/dev/null 2>&1; do
                echo "waiting for postgres.infra.svc.cluster.local / ratel_pr_${PR_NUM}..."
                sleep 3
              done
              echo "postgres ready — starting app-shell"
      containers:
        - name: app-shell
          image: registry.infra.svc.cluster.local:5000/ratel-app-shell:pr-${PR_NUM}
          # The :pr-<num> tag is reused on every push to the PR — Always
          # guarantees a rerun picks up the freshly pushed image.
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: IP
              value: 0.0.0.0
            - name: PORT
              value: "8080"
            # Postgres migration: the app resolves its pool from DATABASE_URL
            # and migrates the inventory schema on startup (common/run.rs).
            # Shared infra postgres — dedicated per-PR database.
            - name: DATABASE_URL
              value: postgres://ratel:***@postgres.infra.svc.cluster.local:5432/ratel_pr_${PR_NUM}
            # Per-instance sqlx POOL max (client side), NOT postgres server
            # max_connections. Small (10) to mirror production sizing
            # (replicas × pool ≤ server max_connections) and to keep the pool a
            # leak check under the e2e run.
            - name: POSTGRES_MAX_CONNECTIONS
              value: "10"
          # app-shell is API-only after the React frontend migration (see
          # docs/superpower/2026-09-14-react-frontend-migration.md § 5.1) —
          # `/` no longer exists. `/launchpad/health` is NOT a substitute:
          # it is POST-only (app/ratel/src/features/launchpad_partner/
          # server.rs:24 routes only `post(health)`, no GET) and every
          # request must carry a valid HMAC signature over
          # LAUNCHPAD_PARTNER_SECRET plus a matching project id
          # (server.rs:39-68 `verify_and_parse`), which an unauthenticated
          # kubelet probe cannot produce and which depends on config being
          # present. A bare TCP check on the listener is what's left that's
          # both unconditional and correct in every environment.
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 60
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: app-shell
  namespace: ratel-pr-${PR_NUM}
spec:
  selector:
    app: app-shell
  ports:
    - name: http
      port: 8080
      targetPort: 8080
