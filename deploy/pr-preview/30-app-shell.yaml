# app-shell — the ratel Dioxus fullstack server, mirroring the compose
# `app-shell-testing` service: the image built by the build-image job
# (native arm64 `make build-testing` output packaged with app/ratel/Dockerfile
# and pushed to the in-cluster registry as ratel-app-shell:pr-<num>).
# Runtime env is IP/PORT only, same as compose — every backend endpoint
# (DYNAMO_ENDPOINT=http://localstack:4566, table prefix ratel-local, bypass
# auth, ...) was baked at compile time and stays valid because the Services
# here reuse the compose hostnames.
#
# Startup ordering: compose used `depends_on: localstack healthy +
# localstack-init completed`. Emulated with an initContainer that polls
# DynamoDB for the ratel-local-main table — i.e. it waits for BOTH localstack
# being up AND the init Job having created the table, so app-shell never
# serves against a missing table (the server itself starts fine either way,
# but requests would 500 and the readiness curl would pass misleadingly).
# Seed data lands moments after table creation; the e2e workflow additionally
# waits for the init Job's Complete condition before running tests, so tests
# never race the seeds.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-shell
  namespace: ratel-pr-${PR_NUM}
  labels:
    app: app-shell
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-shell
  template:
    metadata:
      labels:
        app: app-shell
    spec:
      # qdrant (jemalloc) aborts on the Pi node's 16K page-size kernel,
      # and the Pi is the small node anyway — pin every preview/dev pod to
      # the 4K-page main node (same class asset pins its e2e pod to).
      nodeSelector:
        biyard.io/node-class: main
      initContainers:
        # Postgres migration: the app connects to Postgres and migrates its
        # schema on startup, so gate the app on Postgres being ready (replaces
        # the old wait-for-dynamo gate — the app no longer needs the DynamoDB
        # table to exist; its vestigial Dynamo client connects lazily).
        - name: wait-for-postgres
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - |
              until pg_isready -h postgres -p 5432 -U ratel -d ratel >/dev/null 2>&1; do
                echo "waiting for postgres..."
                sleep 3
              done
              echo "postgres ready — starting app-shell"
      containers:
        - name: app-shell
          image: registry.infra.svc.cluster.local:5000/ratel-app-shell:pr-${PR_NUM}
          # The :pr-<num> tag is reused on every push to the PR — Always
          # guarantees a rerun picks up the freshly pushed image.
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: IP
              value: 0.0.0.0
            - name: PORT
              value: "8080"
            # Postgres migration: the app resolves its pool from DATABASE_URL
            # and migrates the inventory schema on startup (common/run.rs).
            - name: DATABASE_URL
              value: postgres://ratel:ratel@postgres:5432/ratel
            # Per-instance sqlx POOL max (client side), NOT postgres server
            # max_connections. Small (10) to mirror production sizing
            # (replicas × pool ≤ server max_connections) and to keep the pool a
            # leak check under the e2e run.
            - name: POSTGRES_MAX_CONNECTIONS
              value: "10"
            # Vestigial DynamoDB client is still constructed at boot (no live
            # reads/writes) — keep the AWS_*/DYNAMO_* vars so construction
            # succeeds; DYNAMO_ENDPOINT points at localstack which is still up.
            - name: AWS_ACCESS_KEY_ID
              value: test
            - name: AWS_SECRET_ACCESS_KEY
              value: test
            - name: AWS_REGION
              value: ap-northeast-2
            - name: AWS_DEFAULT_REGION
              value: ap-northeast-2
          # app-shell is API-only after the React frontend migration (see
          # docs/superpower/2026-09-14-react-frontend-migration.md § 5.1) —
          # `/` no longer exists. `/launchpad/health` is NOT a substitute:
          # it is POST-only (app/ratel/src/features/launchpad_partner/
          # server.rs:24 routes only `post(health)`, no GET) and every
          # request must carry a valid HMAC signature over
          # LAUNCHPAD_PARTNER_SECRET plus a matching project id
          # (server.rs:39-68 `verify_and_parse`), which an unauthenticated
          # kubelet probe cannot produce and which depends on config being
          # present. A bare TCP check on the listener is what's left that's
          # both unconditional and correct in every environment.
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 60
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: app-shell
  namespace: ratel-pr-${PR_NUM}
spec:
  selector:
    app: app-shell
  ports:
    - name: http
      port: 8080
      targetPort: 8080
