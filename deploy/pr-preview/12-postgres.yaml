# Postgres — the migrated app's data store (replaces the DynamoDB/localstack
# path for the data layer). Mirrors the `postgres` service of
# docker-compose.yaml (testing profile). The Service is named `postgres` so the
# app's `DATABASE_URL=postgres://ratel:ratel@postgres:5432/ratel` resolves
# in-cluster (same hostname the compose network uses).
#
# The app creates every table from its PostgresEntity inventory on startup
# (common/run.rs → Schema::from_inventory().migrate), so there is no init Job —
# unlike localstack which needs localstack-init to create the DynamoDB table.
#
# Ephemeral by design: the namespace is torn down after every PR run, so the
# data is emptyDir (no PVC) — each preview starts with a clean schema.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: ratel-pr-${PR_NUM}
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      # Pin to the 4K-page main node (same as localstack/qdrant/app-shell).
      nodeSelector:
        biyard.io/node-class: main
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_USER
              value: ratel
            - name: POSTGRES_PASSWORD
              value: ratel
            - name: POSTGRES_DB
              value: ratel
            # Preview runs the whole e2e suite against one instance; give the
            # shared pool headroom (still a single node, disposable namespace).
            - name: POSTGRES_MAX_CONNECTIONS
              value: "200"
          args: ["-c", "max_connections=200"]
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "ratel", "-d", "ratel"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: ratel-pr-${PR_NUM}
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
