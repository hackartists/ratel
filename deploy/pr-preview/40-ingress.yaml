# Ingress — exact-host rule ratel-<num>.pr.biyard.co, split between
# app-shell (API-only after the React frontend migration — see
# docs/superpower/2026-09-14-react-frontend-migration.md § 5.1) and `web`
# (the React static build). An exact host in this namespace takes the name
# over from the wildcard `*.pr.biyard.co` pr-nginx (ns infra) for as long as
# the namespace lives.
# No tls: section on purpose — the host rides the ingress controller's
# default certificate; the e2e curl uses -k and Playwright sets
# ignoreHTTPSErrors (env-gated in playwright.config.js).
# Annotations copied from the working asset PR-preview ingress
# (unbounded body size + no request buffering, for uploads).
#
# All paths use pathType Prefix, which matches whole segments, and
# ingress-nginx picks the MOST SPECIFIC matching path per request, so
# listing the API prefixes ahead of the catch-all "/" is enough — no
# priority annotation needed. /designs and /roadmap are additional to
# dev/prod: this preview's app-shell is built with the `design-preview`
# feature, which mounts those routes for design/roadmap review.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-shell
  namespace: ratel-pr-${PR_NUM}
  labels:
    app: app-shell
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
spec:
  ingressClassName: nginx
  rules:
    - host: ratel-${PR_NUM}.pr.biyard.co
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: app-shell
                port:
                  name: http
          - path: /v3
            pathType: Prefix
            backend:
              service:
                name: app-shell
                port:
                  name: http
          - path: /mcp
            pathType: Prefix
            backend:
              service:
                name: app-shell
                port:
                  name: http
          - path: /hooks
            pathType: Prefix
            backend:
              service:
                name: app-shell
                port:
                  name: http
          - path: /launchpad/health
            pathType: Prefix
            backend:
              service:
                name: app-shell
                port:
                  name: http
          - path: /launchpad/points
            pathType: Prefix
            backend:
              service:
                name: app-shell
                port:
                  name: http
          - path: /admin/proxy
            pathType: Prefix
            backend:
              service:
                name: app-shell
                port:
                  name: http
          - path: /designs
            pathType: Prefix
            backend:
              service:
                name: app-shell
                port:
                  name: http
          - path: /roadmap
            pathType: Prefix
            backend:
              service:
                name: app-shell
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  name: http
