# qdrant-init — one-shot Job that creates this PR's qdrant collection on the
# SHARED infra qdrant (qdrant.infra.svc.cluster.local:6333), replacing the
# PR preview's former private qdrant Deployment (deleted; see the shared-
# infra migration). Collection name is namespaced per PR
# (ratel_pr_${PR_NUM}_main) so PRs never collide with each other, with dev,
# or with prod on the shared instance.
#
# scripts/qdrant-init-entrypoint.sh is idempotent on create (checks
# `GET /collections/<name>` first, no-ops if it already exists) but has no
# delete path — a PR preview that re-runs against a STALE collection from a
# previous push would see leftover vectors from the old run. RESET=true
# below tells this Job to DELETE the collection before (re-)creating it, so
# every e2e run starts clean. pr-preview-cleanup.yml does the final delete
# when the PR closes.
apiVersion: batch/v1
kind: Job
metadata:
  name: qdrant-init
  namespace: ratel-pr-${PR_NUM}
  labels:
    app: qdrant-init
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app: qdrant-init
    spec:
      # Schedule on main (arm64) or the amd64 node — see the app-shell
      # comment; the Pi stays excluded (16K page-size kernel). qdrant itself
      # is shared infra now, but this init Job still runs as a cluster pod.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: biyard.io/node-class
                    operator: In
                    values: ["main", "amd64"]
      tolerations:
        - key: biyard.io/arch
          operator: Equal
          value: amd64
          effect: NoSchedule
      restartPolicy: Never
      containers:
        - name: init
          image: amazonlinux:2023
          command: ["bash", "/scripts/qdrant-init-entrypoint.sh"]
          env:
            - name: ENDPOINT
              value: http://qdrant.infra.svc.cluster.local:6333
            - name: COLLECTION
              value: ratel_pr_${PR_NUM}_main
            - name: RESET
              value: "true"
          volumeMounts:
            - name: scripts
              mountPath: /scripts
      volumes:
        - name: scripts
          configMap:
            name: pr-preview-scripts
