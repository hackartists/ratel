<!-- Select::<String> { default_value: Some("banana"), placeholder: "Select a fruit",
       SelectTrigger { aria_label: "Fruit", SelectValue {} }
       SelectList { aria_label: "Fruits", SelectGroup { SelectGroupLabel { "Fruits" }
         SelectOption::<String> { value: "apple", index: 0, "Apple" SelectItemIndicator {} }
         SelectOption::<String> { value: "banana", index: 1, "Banana" SelectItemIndicator {} } } } }
     after clicking the trigger (app/ratel/src/common/components/select + dioxus_primitives::select).
     The trigger renders its children twice; `disabled: false` is omitted; the listbox has tabindex 0
     while no option is focused; aria-selected / aria-disabled are bools. SelectValue shows the option's
     text_value, which defaults to the String value ("banana"), not the rendered children. -->
<div data-state="open" class="select @max-mobile:w-full">
  <button type="button" aria-haspopup="listbox" aria-expanded="true" aria-controls="dxc-list" aria-label="Fruit" class="select-trigger @max-mobile:w-full">
    <div class="hidden @max-mobile:w-full @max-mobile:flex @max-mobile:justify-center @max-mobile:items-center">
      <span data-placeholder="false" class="@max-mobile:text-center">banana</span>
    </div>
    <div class="@max-mobile:hidden">
      <span data-placeholder="false" class="@max-mobile:text-center">banana</span>
    </div>
    <svg class="select-expand-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <polyline points="6 9 12 15 18 9"></polyline>
    </svg>
  </button>
  <div id="dxc-list" role="listbox" tabindex="0" data-state="open" aria-label="Fruits" class="select-list">
    <div role="group" aria-disabled="false" aria-labelledby="dxc-label" class="select-group">
      <div id="dxc-label" class="select-group-label">Fruits</div>
      <div role="option" id="dxc-apple" tabindex="-1" aria-selected="false" aria-disabled="false" class="select-option">Apple</div>
      <div role="option" id="dxc-banana" tabindex="-1" aria-selected="true" aria-disabled="false" class="select-option">
        Banana
        <svg class="select-check-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M5 13l4 4L19 7"></path>
        </svg>
      </div>
    </div>
  </div>
</div>
