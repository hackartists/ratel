# Reconfigure the ICP subnet, and run the tc2 measurement, without a full
# app deploy.
#
# `Dev deploy` also runs this chart, but it builds every app image first, so
# reaching the helm step takes ~40 minutes. A measurement run is a values
# change; paying forty minutes for it is the reason it would not get run.
#
# The image tag lives in the chart (`image.tag: dev`) and `Dev deploy` does
# not override it, so running helm from here produces the same release that
# workflow would.
#
# This is also how the measurement stays available to the team rather than to
# whoever holds a kubeconfig: `infra` is not writable from a personal
# namespace, but anyone with repo access can start this.
name: ICP subnet

on:
  workflow_dispatch:
    inputs:
      run_injector:
        description: >-
          Run the tc2 throughput measurement as a Job in `infra`. Off leaves
          the subnet alone — that is the resting state.
        type: boolean
        default: false
      injector_args:
        description: >-
          Leave empty. The measurement's conditions live in the image, in
          iitp-verification's tc2/measure.args, because they are part of the
          result and belong in a repository rather than in a form. Anything
          here overrides them for one run — for a probe, not for redefining
          the measurement.
        type: string
        default: ""
      replicas:
        description: >-
          Nodes in the subnet. 4 is a real subnet (n = 3f+1, f = 1); 1 has no
          consensus, so a throughput figure from it describes execution rather
          than a chain. Changing this needs allow_rebuild.
        type: choice
        options: ["4", "1"]
        default: "4"
      allow_rebuild:
        description: >-
          Regenerate the subnet registry. Required when `replicas` changes —
          it starts a new chain from height 0 and every canister has to be
          redeployed.
        type: boolean
        default: false

jobs:
  configure:
    runs-on: self-hosted
    # Shared with `Dev deploy` so two helm operations never race on the same
    # release.
    concurrency:
      group: ratel-dev-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6

      - name: Verify cluster access
        run: |
          set -euo pipefail
          kubectl get ns >/dev/null || {
            echo "::error::runner has no cluster access — is this a k3s runner pod?"
            exit 1
          }

      - name: Apply
        run: |
          set -euo pipefail
          args=(
            upgrade --install icp infra/helm/icp
            --namespace infra
            -f infra/helm/icp/environments/tc2.yaml
            --set "replicaCount=${{ inputs.replicas }}"
            --set "subnet.allowRebuild=${{ inputs.allow_rebuild }}"
            --wait --timeout 20m
          )
          if [ "${{ inputs.run_injector }}" = "true" ]; then
            args+=(
              --set injector.enabled=true
              --set injector.image=registry.infra.svc.cluster.local:5000/ratel-vote-tps:dev
              --set-string "injector.args=${{ inputs.injector_args }}"

              # The NetworkPolicy comes off for the length of the run, and the
              # step after this puts it back.
              #
              # Not a preference — nothing reaches the subnet through it. Two
              # separate callers named explicitly in the policy, one by
              # namespaceSelector and one by podSelector, were both refused in
              # under a millisecond, while `adminer` next door with no policy
              # answered 200. The allow rules do not take effect on this
              # cluster, so the only reachable state is the one with no policy.
              #
              # It reopens more than the API: this replica has the provisional
              # management API enabled, so for those minutes anything in the
              # cluster could create a canister on it. That is why the window
              # is a workflow step rather than a values change someone leaves
              # switched on — and why the restore below runs even when the
              # measurement fails.
              --set networkPolicy.enabled=false

              # --wait alone does not wait for Jobs. Without this the release
              # is "deployed" while the injector pod is still
              # ContainerCreating, and the log step reads nothing.
              --wait-for-jobs
            )
          fi
          helm "${args[@]}"

      - name: Measurement result
        # always(): the injector failing is a result too, and its log is the
        # only place that says why.
        if: ${{ always() && inputs.run_injector }}
        run: |
          set -euo pipefail
          job=$(kubectl -n infra get jobs -l app.kubernetes.io/name=icp \
                  --sort-by=.metadata.creationTimestamp \
                  -o jsonpath='{.items[-1:].metadata.name}')
          echo "Job: $job"
          echo
          kubectl -n infra logs "job/$job" --tail=200 || true
          echo
          kubectl -n infra get pods -l app.kubernetes.io/component=injector \
            -o custom-columns=NAME:.metadata.name,STATUS:.status.phase

      - name: Close the measurement window
        # Read the log first, then close: this removes the Job along with the
        # policy exception, and a deleted Job takes its pod's log with it.
        if: ${{ always() && inputs.run_injector }}
        run: |
          set -euo pipefail
          helm upgrade --install icp infra/helm/icp \
            --namespace infra \
            -f infra/helm/icp/environments/tc2.yaml \
            --set "replicaCount=${{ inputs.replicas }}" \
            --wait --timeout 20m
          echo
          kubectl -n infra get networkpolicy icp \
            -o jsonpath='{.metadata.name} restored{"\n"}'

      - name: Subnet state
        run: |
          set -euo pipefail
          kubectl -n infra get statefulset icp
          kubectl -n infra get ingress icp 2>/dev/null && {
            echo "::error::an Ingress exists — the subnet is not supposed to be reachable from outside the cluster"
            exit 1
          }
          echo "No Ingress. The subnet is reachable only from inside the cluster network."
