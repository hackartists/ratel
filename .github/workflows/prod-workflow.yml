name: Production deploy

# Deploys the ratel PROD environment to the HOME k3s cluster on every push to
# `main`, replacing the AWS deploy path (Lambda build → cdk deploy → S3 sync +
# CloudFront invalidation) this workflow used to run. Modeled on
# dev-workflow.yml (the dev migration, docs/k3s-migration/06-dev-deploy.md).
# The apex has since been cut over, so this cluster IS ratel.foundation. The
# AWS stacks are still deployed but receive no traffic, and `cdk/` — the code
# that defined them — has been removed from the repo; managing or tearing
# them down now means the console, the AWS CLI, or restoring cdk/ from git.
#
# Architecture:
# - The CI runners are k8s PODS in the cluster (biyard org runners, arm64,
#   buildctl + kubectl preset, no docker CLI). Both cluster nodes are arm64,
#   so `make build` / `cargo build` on the runner natively produce the
#   deployed binaries — no cross-compile.
# - build-images builds TWO images with the REAL prod compile-time env (the
#   same GitHub-secret env block the old lambda build job used —
#   DYNAMO_TABLE_PREFIX=ratel-prod, real AWS creds baked via option_env!,
#   DYNAMO_ENDPOINT=none → real AWS DynamoDB), pushed to the in-cluster
#   registry tagged :prod-<sha> AND :prod (deploys pin the sha tag):
#     * ratel-app-shell — `make build` (client web,fullstack + server
#       `server`; NO bypass/local-dev/lambda), packaged with
#       app/ratel/Dockerfile.
#     * ratel-events   — ratel_cdc + ratel_worker (`--features redpanda`),
#       packaged with deploy/dev/Dockerfile.events (the recipe is
#       env-agnostic; prod-ness is baked into the binaries).
# - deploy applies deploy/prod/*.yaml (envsubst) into the STABLE `ratel-prod`
#   namespace: app-shell (2 replicas) + Service + Ingress
#   (ratel-prod.biyard.co live now via the wildcard *.biyard.co DNS +
#   cert-manager; ratel.foundation pre-wired but inert until its DNS flips),
#   plus the events tier (ratel-cdc + three role workers, SHADOWED — see
#   WORKER_DRY_RUN below). Runtime secrets (LAUNCHPAD_*, QDRANT_API_KEY, the
#   FCM service account) come from GitHub secrets → k8s Secrets, mirroring
#   what cdk injected into the Lambda runtime env.
# - smoke-test probes the PUBLIC https://ratel-prod.biyard.co with the real
#   certificate.
#
# Rollback: `git revert` on main redeploys the previous sha (images are
# sha-tagged and stay in the registry). The AWS stack still holds its last
# version as a second fallback until the DNS cutover.

on:
  push:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always
  # ┌────────────────────────────────────────────────────────────────────┐
  # │ EVENTS SHADOW-MODE SWITCH (docs/k3s-migration/01-events-redpanda-  │
  # │ plan.md § W5, docs/k3s-migration/07-prod-deploy.md).               │
  # │                                                                    │
  # │ "1" = SHADOW: the workers consume prod.ratel.cdc.v1, evaluate the  │
  # │ filter rules, log `dry-run: would dispatch`, commit offsets — and  │
  # │ run NO handlers. The AWS EventBridge path stays the live one.      │
  # │                                                                    │
  # │ UNLIKE DEV (whose EventBridge bus had no rules, so its flip was    │
  # │ free), the PROD bus has ~40 LIVE Pipes + Rules driving the         │
  # │ app-shell Lambdas. Flipping this to "0" is THE PROD EVENTS         │
  # │ CUTOVER and MUST coincide with disabling those EventBridge rules   │
  # │ — running both live double-processes every event (double XP,       │
  # │ double notifications, double cross-posts). Rollback: set back to   │
  # │ "1" FIRST (re-shadow), then re-enable the rules. While shadowed,   │
  # │ offsets keep advancing, so events seen during shadow are skipped   │
  # │ on the flip, not replayed. Procedure:                              │
  # │ docs/k3s-migration/07-prod-deploy.md. (The CDC producer has no     │
  # │ dry-run — producing to the topic is side-effect-free.)             │
  # └────────────────────────────────────────────────────────────────────┘
  WORKER_DRY_RUN: "1"

jobs:
  # ── Build the two prod images (native arm64 → buildkitd → registry) ─────
  # One job, not two: both images share the checkout, toolchain, caches, and
  # the 60-line compile-time secret env block (option_env! bakes it into the
  # binaries), and the events cargo build reuses dependency artifacts the dx
  # server build just compiled. Same shape as dev-workflow's build-images;
  # the cache steps restore the ratel-cargo-*/ratel-target-* caches the dev
  # branch keeps warm (and save main's own copies).
  build-images:
    runs-on: [self-hosted, Linux]
    timeout-minutes: 120
    env:
      # ── Compile-time env — replicated from the old prod lambda build ──
      # job (`ratel-app-lambda`). These bake into the binaries via
      # option_env! (aws_config.rs etc.); the events binaries reach
      # DynamoDB through the same baked config.
      DISABLE_ANSI: true
      ENV: prod
      RUST_LOG: error
      RUSTFLAGS: "-D warnings"
      # The runner PODS have an 8Gi memory limit; an unbounded cold
      # `cargo build --release` (the dx build this replaced hit the same
      # ceiling) OOM-killed a runner on the dev migration (exit 137, run
      # 30898864146). Bound rustc parallelism so the build fits the pod.
      CARGO_BUILD_JOBS: "2"
      SERVICE: app-shell
      DOMAIN: ratel.foundation
      BUCKET_NAME: metadata.ratel.foundation
      SLACK_HOOK: ${{ secrets.SLACK_HOOK }}

      # Real AWS credentials — baked (option_env!) for DynamoDB/S3/Bedrock.
      # The old job got AWS_* exported by configure-aws-credentials; here
      # they are set directly. AWS_ACCOUNT_ID also silences the Makefile's
      # `aws sts` default (no aws CLI on the runner).
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ap-northeast-2
      AWS_ACCOUNT_ID: ${{ secrets.ACCOUNT_ID }}
      ACCOUNT_ID: ${{ secrets.ACCOUNT_ID }}

      BINANCE_API_KEY: ${{ secrets.PROD_BINANCE_API_KEY }}
      BINANCE_SECRET_KEY: ${{ secrets.PROD_BINANCE_SECRET_KEY }}
      BINANCE_WEBHOOK: https://api.ratel.foundation/v2/binances/webhooks
      REDIRECT_DOMAIN: https://ratel.foundation

      KAIA_ENDPOINT: https://public-en.node.kaia.io
      KAIA_ARCHIVE_ENDPOINT: https://archive-en.node.kaia.io
      KAIA_FEEPAYER_KEY: ${{ secrets.PROD_KAIA_FEEPAYER_KEY }}
      KAIA_FEEPAYER_ADDR: ${{ secrets.PROD_KAIA_FEEPAYER_ADDR }}
      KAIA_OWNER_KEY: ${{ secrets.PROD_KAIA_OWNER_KEY }}
      KAIA_OWNER_ADDR: ${{ secrets.PROD_KAIA_OWNER_KEY_ADDR }}

      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}

      BBS_BLS_X: ${{ secrets.BBS_BLS_X }}
      BBS_BLS_Y: ${{ secrets.BBS_BLS_Y }}
      BBS_BLS_D: ${{ secrets.BBS_BLS_D }}
      BBS_BLS_CRV: ${{ secrets.BBS_BLS_CRV }}

      P256_X: ${{ secrets.P256_X }}
      P256_Y: ${{ secrets.P256_Y }}
      P256_D: ${{ secrets.P256_D }}
      P256_CRV: ${{ secrets.P256_CRV }}

      DYNAMO_TABLE_PREFIX: ratel-prod
      DYNAMO_ENDPOINT: none

      FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
      FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
      FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
      FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
      FIREBASE_MEASUREMENT_ID: ${{ secrets.FIREBASE_MEASUREMENT_ID }}

      # NOTE: Change PORTONE API
      PORTONE_API_SECRET: ${{ secrets.PORTONE_API_SECRET }}
      PORTONE_KPN_CHANNEL_KEY: ${{ secrets.PORTONE_KPN_BILLING_KEY_CHANNEL_KEY }}
      PORTONE_STORE_ID: ${{ secrets.PORTONE_STORE_ID }}
      PORTONE_INICIS_CHANNEL_KEY: ${{ secrets.PROD_PORTONE_INICIS_CHANNEL_KEY }}

      QDRANT_URL: ${{ secrets.RATEL_QDRANT_URL }}
      QDRANT_API_KEY: ${{secrets.QDRANT_API_KEY }}

      WALLETCONNECT_PROJECT_ID: ${{ secrets.WALLETCONNECT_PROJECT_ID }}

      # ICP encrypted voting — point at the prod canister on IC mainnet.
      # Reusing DEV_ICP_IDENTITY_PEM until a dedicated prod identity is provisioned.
      RATEL_CANISTER_ID: 5wtzb-piaaa-aaaap-qhjfq-cai
      IC_URL: https://icp0.io
      ICP_IDENTITY_PEM: ${{ secrets.DEV_ICP_IDENTITY_PEM }}
      VOTER_TAG_SECRET: ${{ secrets.VOTER_TAG_SECRET }}
      ATTR_VOTING_AUTHORITY_JSON: ${{ secrets.ATTR_VOTING_AUTHORITY_JSON }}

      # Cross-posting credential AEAD key (envvar form: "v<int>:<base64-no-pad 32 bytes>").
      # Backup of the value is held in 1Password (admin-only vault) — losing
      # this secret without the backup makes every stored connection
      # unrecoverable. PREVIOUS is set only during a key rotation transition.
      CROSS_POSTING_DATA_KEY: ${{ secrets.PROD_CROSS_POSTING_DATA_KEY }}
      CROSS_POSTING_DATA_KEY_PREVIOUS: ${{ secrets.PROD_CROSS_POSTING_DATA_KEY_PREVIOUS }}

      # LinkedIn OAuth (Phase 1B): CLIENT_ID is public-ish (rides the
      # redirect URL), CLIENT_SECRET is server-only (token-exchange POST).
      LINKEDIN_CLIENT_ID: ${{ secrets.PROD_LINKEDIN_CLIENT_ID }}
      LINKEDIN_CLIENT_SECRET: ${{ secrets.PROD_LINKEDIN_CLIENT_SECRET }}
      LAUNCHPAD_BASE_URL: ${{ secrets.LAUNCHPAD_BASE_URL }}
      LAUNCHPAD_PROJECT_ID: ${{ secrets.LAUNCHPAD_PROJECT_ID }}
      LAUNCHPAD_PARTNER_SECRET: ${{ secrets.LAUNCHPAD_PARTNER_SECRET }}
      LAUNCHPAD_POINT_SYMBOL: RT

      # Registry tags: the deploy pins prod-<sha>; :prod is a moving
      # convenience alias for manual `kubectl set image` / debugging.
      SHA_TAG: prod-${{ github.sha }}

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        # Idempotent (same pattern as dev-workflow's build-images): reuse the
        # runner's stable toolchain, install only if absent. No wasm target
        # here — app-shell is API-only after the React frontend migration
        # (docs/superpower/2026-09-14-react-frontend-migration.md § 5.1), so
        # nothing in this job compiles for wasm32-unknown-unknown anymore.
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            if [ -x "$HOME/.cargo/bin/rustup" ]; then
              export PATH="$HOME/.cargo/bin:$PATH"
            else
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
              export PATH="$HOME/.cargo/bin:$PATH"
            fi
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
          rustup toolchain list | grep -q '^stable' || rustup toolchain install stable --profile minimal

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache cargo registry/index
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ratel-cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ratel-cargo-${{ runner.os }}-

      - name: Cache build target
        uses: actions/cache@v5
        with:
          path: target
          key: ratel-target-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ratel-target-${{ runner.os }}-

      - name: Install build deps (C toolchain, cmake for librdkafka, openssl headers)
        # cmake + a C toolchain: rdkafka's `cmake-build` feature compiles
        # librdkafka from source for the events binaries. Idempotent +
        # multi-distro; a no-op once the persistent runner has them.
        run: |
          set -eu
          if command -v cc >/dev/null 2>&1 && command -v cmake >/dev/null 2>&1 && command -v pkg-config >/dev/null 2>&1 && [ -f /usr/include/openssl/ssl.h ]; then
            echo "C toolchain + cmake + pkg-config + openssl headers already present"
            exit 0
          fi
          SUDO=""
          if command -v sudo >/dev/null 2>&1; then SUDO="sudo"; fi
          if command -v apt-get >/dev/null 2>&1; then
            $SUDO apt-get update -qq
            $SUDO apt-get install -y --no-install-recommends build-essential cmake make pkg-config libssl-dev
          elif command -v dnf >/dev/null 2>&1; then
            $SUDO dnf install -y gcc make cmake pkgconf-pkg-config openssl-devel
          elif command -v apk >/dev/null 2>&1; then
            $SUDO apk add --no-cache build-base cmake pkgconfig openssl-dev
          else
            echo "::warning::no known package manager; relying on preinstalled toolchain"
          fi

      - name: Build app-shell (make build — prod release, API only, no bypass/local-dev/lambda)
        # `make build` is a plain `cargo build --release` (no dx/dioxus-cli,
        # no wasm client) that leaves the binary at
        # target/server-image/server — see the "Fixed contracts" section of
        # docs/superpower/2026-09-14-react-frontend-migration.md § 5.1.
        run: |
          cd app/ratel
          make build

      - name: Push app-shell image (buildkit → :prod-<sha> and :prod)
        run: |
          set -euo pipefail
          export NAME=ratel-app-shell
          export CONTEXT=target/server-image
          export DOCKERFILE=app/ratel/Dockerfile
          IMAGE_TAG="${SHA_TAG}" bash scripts/buildkit-image.sh
          # Second push is a cache hit in buildkitd — just retags.
          IMAGE_TAG=prod bash scripts/buildkit-image.sh

      - name: Build web (React static site)
        env:
          # VITE_* build-time env for the React bundle — mapped from the SAME
          # GitHub secrets the Rust client build used above for the
          # equivalent non-VITE names (see the job env block). VITE_BYPASS is
          # never set for prod — this environment's app-shell has no bypass
          # feature. VITE_TAURI is never set for web.
          VITE_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.FIREBASE_MEASUREMENT_ID }}
          VITE_WALLETCONNECT_PROJECT_ID: ${{ secrets.WALLETCONNECT_PROJECT_ID }}
          VITE_PORTONE_STORE_ID: ${{ secrets.PORTONE_STORE_ID }}
          VITE_PORTONE_INICIS_CHANNEL_KEY: ${{ secrets.PROD_PORTONE_INICIS_CHANNEL_KEY }}
          # Rust's `option_env!("ENV")` equivalent for the React bundle. Without it
          # the bundle reads Environment::Local and pre-release surfaces gated on
          # the environment (the Arcade entry) would show up in production.
          VITE_ENV: production
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm -C apps/web build

      - name: Push web image (buildkit → :prod-<sha> and :prod)
        run: |
          set -euo pipefail
          export NAME=ratel-web
          export CONTEXT=apps/web
          export DOCKERFILE=apps/web/Dockerfile
          IMAGE_TAG="${SHA_TAG}" bash scripts/buildkit-image.sh
          IMAGE_TAG=prod bash scripts/buildkit-image.sh

      - name: Build events binaries (ratel_cdc + ratel_worker, --features redpanda)
        # Same compile-time env (job env above) — the events binaries reach
        # real DynamoDB via the same baked AwsConfig/DynamoConfig. Events
        # runtime config (RATEL_*) is env-read at runtime by design.
        run: |
          cd app/ratel
          cargo build --release --features redpanda --bin ratel_cdc --bin ratel_worker

      - name: Verify events binary linkage (ldd)
        # deploy/dev/Dockerfile.events documents the base-image reasoning:
        # librdkafka is statically linked (cmake-build) with no ssl/sasl
        # features, so the only dynamic deps should be glibc/libgcc/zlib —
        # all present in ubuntu:24.04. Fail here, before pushing, if a
        # library would be missing at runtime.
        run: |
          set -euo pipefail
          for bin in target/release/ratel_cdc target/release/ratel_worker; do
            echo "── ldd ${bin}"
            ldd "$bin"
            if ldd "$bin" | grep -q "not found"; then
              echo "::error::${bin} has unresolved dynamic libraries"
              exit 1
            fi
          done

      - name: Push events image (buildkit → :prod-<sha> and :prod)
        # Stage just the two binaries as the build context — sending the
        # multi-GB target/ tree to buildkitd would be pure waste. The
        # Dockerfile is shared with dev (deploy/dev/Dockerfile.events): the
        # recipe only packages binaries; env-ness is baked into them.
        run: |
          set -euo pipefail
          rm -rf .build/events
          mkdir -p .build/events
          cp target/release/ratel_cdc target/release/ratel_worker .build/events/
          export NAME=ratel-events
          export CONTEXT=.build/events
          export DOCKERFILE=deploy/dev/Dockerfile.events
          IMAGE_TAG="${SHA_TAG}" bash scripts/buildkit-image.sh
          IMAGE_TAG=prod bash scripts/buildkit-image.sh

  # ── Deploy (envsubst deploy/prod/*.yaml → k3s namespace `ratel-prod`) ───
  deploy:
    needs: [build-images]
    runs-on: [self-hosted, Linux]
    timeout-minutes: 45
    # One prod deploy at a time; a newer push queues behind (not cancels) the
    # in-flight one so a half-rolled namespace is never abandoned. Job-level
    # so the android/ios jobs of concurrent runs don't serialize.
    concurrency:
      group: ratel-prod-deploy
      cancel-in-progress: false
    env:
      SHA_TAG: prod-${{ github.sha }}
      NAMESPACE: ratel-prod
      HOST: ratel-prod.biyard.co
      # Runtime-injected config, mirroring what cdk/bin/cdk.ts put into the
      # Lambda RUNTIME env (read via std::env::var — no rebuild needed).
      LAUNCHPAD_BASE_URL: ${{ secrets.LAUNCHPAD_BASE_URL }}
      LAUNCHPAD_PROJECT_ID: ${{ secrets.LAUNCHPAD_PROJECT_ID }}
      LAUNCHPAD_PARTNER_SECRET: ${{ secrets.LAUNCHPAD_PARTNER_SECRET }}
      LAUNCHPAD_POINT_SYMBOL: RT
      QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
      # Route53 access for the apex DNS sync CronJob's Secret (below).
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      # FCM service-account JSON (base64) — mounted as a Secret volume at
      # the path GOOGLE_APPLICATION_CREDENTIALS points to; missing secret
      # just disables push (fcm.rs skips gracefully), same as the lambda
      # bundle behavior.
      FIREBASE_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON_BASE64 }}
    steps:
      - uses: actions/checkout@v6

      - name: Verify cluster access
        # The runner pods carry in-cluster kubectl credentials; fail early
        # with a clear message if this job landed somewhere else.
        run: |
          set -euo pipefail
          kubectl get ns >/dev/null || {
            echo "::error::runner has no cluster access — is this a k3s runner pod?"
            exit 1
          }

      - name: Create namespace + runtime Secrets
        # Secret-handling mirrors the dev deploy: only non-empty GitHub
        # secrets become keys, so an unset secret simply leaves the env var
        # absent (the manifests reference the Secret as optional).
        run: |
          set -euo pipefail
          kubectl create namespace "${NAMESPACE}" --dry-run=client -o yaml | kubectl apply -f -

          args=()
          add() { if [ -n "$2" ]; then args+=(--from-literal="$1=$2"); fi; }
          add LAUNCHPAD_BASE_URL "${LAUNCHPAD_BASE_URL}"
          add LAUNCHPAD_PROJECT_ID "${LAUNCHPAD_PROJECT_ID}"
          add LAUNCHPAD_PARTNER_SECRET "${LAUNCHPAD_PARTNER_SECRET}"
          add LAUNCHPAD_POINT_SYMBOL "${LAUNCHPAD_POINT_SYMBOL}"
          add QDRANT_API_KEY "${QDRANT_API_KEY}"
          kubectl -n "${NAMESPACE}" create secret generic ratel-prod-secrets \
            "${args[@]}" --dry-run=client -o yaml | kubectl apply -f -

          # Route53 credentials for the apex DNS sync CronJob
          # (deploy/prod/50-apex-dns-sync.yaml). The Secret is referenced as
          # optional, so an unset GitHub secret just leaves the CronJob unable
          # to call Route53 — it logs and exits rather than failing the deploy.
          dns_args=()
          add_dns() { if [ -n "$2" ]; then dns_args+=(--from-literal="$1=$2"); fi; }
          add_dns AWS_ACCESS_KEY_ID "${AWS_ACCESS_KEY_ID:-}"
          add_dns AWS_SECRET_ACCESS_KEY "${AWS_SECRET_ACCESS_KEY:-}"
          if [ ${#dns_args[@]} -gt 0 ]; then
            kubectl -n "${NAMESPACE}" create secret generic apex-dns-sync-aws \
              "${dns_args[@]}" --dry-run=client -o yaml | kubectl apply -f -
          fi

          # FCM service account → Secret with the single JSON file the
          # firebase volume mounts. Skipped (and any stale copy removed) when
          # the GitHub secret is unset.
          if [ -n "${FIREBASE_SERVICE_ACCOUNT_JSON_BASE64}" ]; then
            tmp=$(mktemp -d)
            echo "${FIREBASE_SERVICE_ACCOUNT_JSON_BASE64}" | base64 -d > "${tmp}/firebase-service-account.json"
            kubectl -n "${NAMESPACE}" create secret generic ratel-prod-firebase \
              --from-file="firebase-service-account.json=${tmp}/firebase-service-account.json" \
              --dry-run=client -o yaml | kubectl apply -f -
            rm -rf "${tmp}"
          else
            kubectl -n "${NAMESPACE}" delete secret ratel-prod-firebase --ignore-not-found
            echo "FIREBASE_SERVICE_ACCOUNT_JSON_BASE64 not set — push disabled (graceful skip)"
          fi

      - name: Apply the prod manifests (envsubst → kubectl apply)
        # Substitution restricted to ${SHA_TAG} (image pin) and
        # ${WORKER_DRY_RUN} (events shadow-mode switch — see the workflow
        # env comment). sed fallback if the runner lacks gettext.
        run: |
          set -euo pipefail
          subst() {
            if command -v envsubst >/dev/null 2>&1; then
              envsubst '${SHA_TAG} ${WORKER_DRY_RUN}'
            else
              sed -e "s|\${SHA_TAG}|${SHA_TAG}|g" -e "s|\${WORKER_DRY_RUN}|${WORKER_DRY_RUN}|g"
            fi
          }
          for f in deploy/prod/*.yaml; do
            echo "---"
            subst < "$f"
          done | kubectl apply -f -

      - name: Wait for every Deployment to roll out
        run: |
          set -euo pipefail
          for d in $(kubectl -n "${NAMESPACE}" get deploy -o name); do
            echo "── rollout ${d}"
            kubectl -n "${NAMESPACE}" rollout status "$d" --timeout=600s
          done

      - name: Wait for web + app-shell to answer through ingress-nginx
        # Pin the host to the ingress controller's ClusterIP (`-k`: the TLS
        # cert may still be issuing via DNS-01 on the very first deploy —
        # routing works before the real cert lands). Since the React
        # frontend migration (docs/superpower/2026-09-14-react-frontend-
        # migration.md § 5.1) "/" is served by the `web` Deployment, not
        # app-shell (now API-only) — probe both backends through the same
        # ingress so a deploy that broke either path split fails here, not
        # in the smoke test. /launchpad/health only accepts POST with a
        # signed body (see the readinessProbe comment on 10-app-shell.yaml),
        # so a plain GET is expected to answer 404/405 — anything other than
        # a connection failure or a 5xx proves the ingress → app-shell route
        # itself works.
        run: |
          set -uo pipefail
          INGRESS_IP=$(kubectl -n infra get svc ingress-nginx-controller -o jsonpath='{.spec.clusterIP}')
          [ -n "$INGRESS_IP" ] || { echo "::error::ingress-nginx-controller service not found"; exit 1; }
          base="https://${HOST}"
          deadline=$(( $(date +%s) + 300 ))
          echo "waiting for ${base}/ (web, ingress=${INGRESS_IP}) ..."
          until curl -sfk --resolve "${HOST}:443:${INGRESS_IP}" -o /dev/null "${base}/"; do
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::web did not answer within 300s"
              kubectl -n "${NAMESPACE}" get pods -o wide || true
              exit 1
            fi
            sleep 10
          done
          echo "✓ ingress serves web at ${base}/"

          deadline=$(( $(date +%s) + 120 ))
          echo "waiting for ${base}/launchpad/health (app-shell, ingress=${INGRESS_IP}) ..."
          until code=$(curl -sk --resolve "${HOST}:443:${INGRESS_IP}" -o /dev/null -w '%{http_code}' "${base}/launchpad/health"); \
                [ "$code" != "000" ] && [ "$code" -lt 500 ]; do
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::app-shell did not answer within 120s (last code: ${code:-000})"
              kubectl -n "${NAMESPACE}" get pods -o wide || true
              exit 1
            fi
            sleep 10
          done
          echo "✓ ingress serves app-shell at ${base}/launchpad/health (http ${code})"

      - name: Check the events tier (pods running + shadow-mode heartbeat)
        # Pods must be Running (their rollouts already succeeded above);
        # then look for one `dry-run: would dispatch` (shadow mode matched a
        # rule) or `worker consuming` (consumer started) line. Prod traffic
        # should produce dispatch lines quickly, but a quiet window is still
        # possible — a missing log line is a WARNING, not a failure; a
        # crash-looping worker would have failed rollout status.
        run: |
          set -uo pipefail
          kubectl -n "${NAMESPACE}" get pods -l tier=events -o wide
          found=0
          for d in ratel-worker-default ratel-worker-analyze ratel-worker-egress; do
            if kubectl -n "${NAMESPACE}" logs "deploy/${d}" --tail 200 2>/dev/null \
               | grep -qE "dry-run: would dispatch|worker consuming"; then
              echo "✓ ${d}: consumer heartbeat found"
              found=1
            fi
          done
          if [ "$found" != "1" ]; then
            echo "::warning::no 'worker consuming' / 'dry-run: would dispatch' line in worker logs yet — stream may just be quiet; check logs manually"
          fi

      - name: Dump pod state on failure
        if: failure()
        run: |
          kubectl -n "${NAMESPACE}" get pods -o wide 2>&1 || true
          kubectl -n "${NAMESPACE}" get events --sort-by=.lastTimestamp 2>&1 | tail -30 || true
          for d in $(kubectl -n "${NAMESPACE}" get deploy -o name 2>/dev/null); do
            echo "===== ${d} ====="
            kubectl -n "${NAMESPACE}" logs "$d" --all-containers --tail 200 2>&1 || true
          done

  # ── Smoke test — confirm the PUBLIC URL responds ────────────────────────
  smoke-test:
    needs: deploy
    runs-on: [self-hosted, Linux]
    timeout-minutes: 15
    env:
      HOST: ratel-prod.biyard.co
    steps:
      - name: Probe https://ratel-prod.biyard.co via public DNS
        # Full public path: wildcard *.biyard.co DNS → router 443 →
        # ingress-nginx → app-shell, with the REAL certificate (no -k).
        # Generous retry window because the very first deploy may still be
        # finishing DNS-01 certificate issuance. NOTE: this probes the
        # pre-cutover URL — ratel.foundation stays on the AWS stack until
        # its DNS is flipped (docs/k3s-migration/07-prod-deploy.md).
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 24); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "https://${HOST}/" || echo "000")
            echo "attempt $i: / -> ${code}"
            if [ "$code" = "200" ]; then ok=1; break; fi
            sleep 20
          done
          if [ "$ok" != "1" ]; then
            echo "::error::https://${HOST} did not serve 200 within ~8 min"
            exit 1
          fi
          echo "✓ https://${HOST} is live"

  # NOTE: the `ratel-app-lambda` job (Lambda build via `make build-lambda`,
  # S3 sync + CloudFront invalidation, lambda zip artifact) and the cdk
  # `deploy` job were REMOVED when prod moved to the home k3s cluster (see
  # the file header). `cdk/` and `make build-lambda` have since been deleted
  # too. The AWS secrets stay because they are still used — by the apex DNS
  # sync CronJob and cert-manager's Route53 solver. The AWS stacks remain
  # deployed but take no traffic: the apex now resolves to this cluster.
  # Static assets are no longer synced to S3/CloudFront — the k3s app-shell
  # serves its own `public/` tree, and CloudFront keeps its last-synced copy
  # for the AWS fallback path.

  # Mobile releases (Android AAB → Play internal, iOS .ipa → TestFlight) live
  # in .github/workflows/mobile-release.yml and are triggered by hand.
  #
  # Neither can run on these runners. iOS needs Xcode, which is macOS-only.
  # Android needs the NDK, and Google ships its toolchains for linux-x86_64
  # only — no linux-aarch64 — so on these arm64 nodes clang dies with
  # `exit status: 126` before compiling anything. Emulating x86_64 would mean
  # registering binfmt_misc on the host (a privileged, cluster-wide change,
  # and /proc/sys/fs/binfmt_misc is empty today) and would run the NDK clang
  # 5-10x slower for every C dependency.
