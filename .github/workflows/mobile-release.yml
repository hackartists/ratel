name: Mobile release

# Ships the mobile apps: Android AAB -> Play internal track, iOS .ipa ->
# TestFlight. Both build from `main`, whichever branch the button is pressed
# from, so a store build always matches what prod serves.
#
# Both jobs run on the organization's self-hosted macOS runner (`[self-hosted,
# macOS]`), so a release costs no GitHub-hosted minutes. That runner is the
# only one that can build either app:
#
# - iOS needs Xcode, which is macOS-only.
# - Android needs the NDK, and Google ships its toolchains for linux-x86_64
#   only — there is no linux-aarch64 build — so on the arm64 Linux runners the
#   NDK clang dies with `exit status: 126` before compiling anything. The
#   macOS toolchain runs fine.
#
# One runner takes one job at a time, so Android and iOS build in sequence
# unless more macOS runners are registered.
#
# The machine is shared and long-lived rather than a throwaway VM, which is why
# this file: picks the newest installed Xcode 26+ through DEVELOPER_DIR instead
# of switching Xcode with sudo; installs rustup / tauri-cli / xcodegen only when
# they are missing; skips actions/cache; adds the signing keychain to the search
# list only when the identity is not already there; and deletes every secret it
# writes when the job ends.
#
# It stays MANUAL rather than running on every prod deploy: store review takes
# days, so a build per deploy buys nothing.
#
# The free `guard` job (on a Linux runner, so it never occupies the Mac) holds
# the typed confirmation.
#
# Build numbers come from `date +%s` (app/ratel-tauri/Makefile), so repeated
# runs never collide on Play or App Store Connect. Bump the marketing version
# in app/ratel-tauri/src-tauri/tauri.conf.json when you ship a new one.

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Which app(s) to ship"
        type: choice
        required: true
        default: both
        options: [both, android, ios]
      confirm:
        description: "Type RELEASE to confirm a store upload"
        type: string
        required: true

# One release at a time: the jobs share the runner's keychain and profile
# folder, and a second run would fight the first over them.
concurrency:
  group: mobile-release
  cancel-in-progress: false

jobs:
  # Free gate in front of the billed jobs.
  guard:
    runs-on: [self-hosted, Linux]
    steps:
      - name: Require typed confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "RELEASE" ]; then
            echo "::error::confirm must be exactly RELEASE (got '${{ inputs.confirm }}')"
            exit 1
          fi
          echo "shipping: ${{ inputs.platform }}"

  android-release:
    if: inputs.platform == 'both' || inputs.platform == 'android'
    needs: guard
    runs-on: [self-hosted, macOS]
    timeout-minutes: 90
    # crates.io downloads intermittently fail in CI with curl "[55] Failed
    # sending data to the peer (Broken pipe)" during `cargo metadata`/build —
    # an HTTP/2 multiplexing flake, not a code/dependency problem. Retry
    # aggressively, fetch git deps via the git CLI, and disable HTTP/2
    # multiplexing (the common fix for the broken-pipe signature).
    env:
      CARGO_NET_RETRY: "10"
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      CARGO_HTTP_MULTIPLEXING: "false"
    steps:
      # `PULL_KEY_REPO_V2`, not `PULL_KEY_REPO`. The original key stopped
      # authenticating and was replaced in f0a38d447 (2026-08-26); that fix
      # was written against the AWS-era workflow and got lost when the k3s
      # migration rewrote this file, which is why the first self-hosted run
      # burned a retry on "Permission denied (publickey)" before falling back
      # to HTTPS.
      #
      # Kept (rather than dropped as the other jobs did) so a submodule added
      # later is fetched without anyone remembering to re-add this.
      - uses: actions/checkout@v6
        with:
          ref: main
          submodules: recursive
          ssh-key: ${{ secrets.PULL_KEY_REPO_V2 }}

      - name: Use the Mac's Homebrew and cargo tools
        run: |
          for dir in /opt/homebrew/bin "$HOME/.cargo/bin"; do
            if [ -d "$dir" ]; then echo "$dir" >> "$GITHUB_PATH"; fi
          done

      - name: Rust toolchain + targets
        run: |
          command -v rustup >/dev/null || \
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --no-modify-path --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" target add wasm32-unknown-unknown aarch64-linux-android

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0 ndk;29.0.14206865"

      - name: Install tauri-cli
        run: |
          command -v cargo-tauri >/dev/null || cargo install --locked tauri-cli --version "^2.0.0"

      - name: Enable corepack + install pnpm workspace deps
        # `make release-aab` → `web-build` runs `pnpm -C apps/web build`,
        # which needs the workspace's root deps installed first.
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Write upload keystore + signing config
        working-directory: app/ratel-tauri/src-tauri/gen/android
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > upload-keystore.jks
          cat > keystore.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_ALIAS_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=$(pwd)/upload-keystore.jks
          EOF

      # google-services.json is gitignored (Firebase client config), absent on a
      # clean checkout. `make release-aab` → `gs-copy` copies it for the
      # google-services Gradle plugin (FCM push), so decode it from a secret.
      - name: Write google-services.json (Android Firebase client config)
        working-directory: app/ratel-tauri
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "::error::GOOGLE_SERVICES_JSON_BASE64 secret not set — Android build needs google-services.json (gitignored). Add it in Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > google-services.json
          echo "Wrote google-services.json ($(wc -c < google-services.json) bytes)"

      - name: Build signed release AAB (prod)
        working-directory: app/ratel-tauri
        env:
          ENV: prod
          MOBILE_API_URL: https://ratel.foundation
          ANDROID_TARGET: aarch64-linux-android
          # Both version values are computed in the run script below, because
          # GH Actions expressions have no arithmetic operators — adding one
          # inside an expression is a workflow syntax error, not just bad style
          # ("Unexpected symbol: '+'").
          DYNAMO_TABLE_PREFIX: ratel-prod
          RUSTFLAGS: "-D warnings"
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          PORTONE_STORE_ID: ${{ secrets.PORTONE_STORE_ID }}
          PORTONE_INICIS_CHANNEL_KEY: ${{ secrets.PROD_PORTONE_INICIS_CHANNEL_KEY }}
          PORTONE_KPN_CHANNEL_KEY: ${{ secrets.PORTONE_KPN_BILLING_KEY_CHANNEL_KEY }}
          PORTONE_API_SECRET: ${{ secrets.PORTONE_API_SECRET }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MEASUREMENT_ID: ${{ secrets.FIREBASE_MEASUREMENT_ID }}
          # Read by app/ratel-tauri/Makefile's `web-build` target and forwarded
          # as VITE_WALLETCONNECT_PROJECT_ID to the React build — never
          # VITE_BYPASS here (store builds never talk to a bypass backend).
          WALLETCONNECT_PROJECT_ID: ${{ secrets.WALLETCONNECT_PROJECT_ID }}
          # app/ratel/Makefile's BUILD_ENV resolves AWS_ACCOUNT_ID via the AWS
          # CLI; the client build only needs these to be non-empty placeholders.
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_REGION: ap-northeast-2
          AWS_ACCOUNT_ID: test
        run: |
          # setup-android exports ANDROID_HOME; point NDK_HOME at the version we
          # installed (Makefile's Linux default /opt/android-ndk doesn't exist here).
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/29.0.14206865"
          export NDK_HOME="$ANDROID_NDK_HOME"
          # Both must stay strictly above what is already on Play (1182 as of
          # 2026-09-02). `github.run_number` counts per workflow FILE, so moving
          # this job out of prod-workflow.yml reset it to 1 and the first run
          # went out as 1.0.1 / 1001 — under 1182, which Play rejected with
          # "You cannot rollout this release because it does not allow any
          # existing users to upgrade to the newly added APKs." Renaming or
          # moving this file resets the counter again; raise the offsets past
          # the highest shipped code if that happens.
          RUN_NO=${{ github.run_number }}
          export ANDROID_VERSION_CODE=$(( 1200 + RUN_NO ))
          export ANDROID_VERSION_NAME="1.0.$(( 200 + RUN_NO ))"
          echo "versionCode=$ANDROID_VERSION_CODE versionName=$ANDROID_VERSION_NAME"
          # release-aab depends on dx-build (web bundle) + a signed AAB build.
          make release-aab
          echo "AAB:"
          find src-tauri/gen/android -name 'app-universal-release.aab' -print

      - name: Upload to Google Play (internal track)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: co.biyard.ratel
          releaseFiles: app/ratel-tauri/src-tauri/gen/android/app/build/outputs/bundle/universalRelease/app-universal-release.aab
          # `track` is deprecated in favour of `tracks` (the action warns on
          # every run). Same meaning, one entry.
          tracks: internal
          status: completed
          # NOTE: `changesNotSentForReview` is deliberately NOT set.
          #
          # It used to be `true` here, for a store listing that was not yet
          # reviewable — back then edits.commit failed with "Changes cannot be
          # sent for review automatically" unless the flag suppressed it. The
          # listing is complete now, so Play submits internal-track edits for
          # review on its own and rejects the flag outright:
          #
          #   Error: Changes are sent for review automatically.
          #          The query parameter changesNotSentForReview must not be set.
          #
          # The two states are mutually exclusive, so this only ever needs
          # setting again if the app returns to an incomplete listing.


      - name: Remove signing files from the workspace
        if: always()
        working-directory: app/ratel-tauri
        run: |
          rm -f src-tauri/gen/android/upload-keystore.jks src-tauri/gen/android/keystore.properties \
            google-services.json src-tauri/gen/android/app/google-services.json

  # # ── iOS → TestFlight ────────────────────────────────────────────────
  # iOS release lives in .github/workflows/mobile-ios-release.yml — Xcode is
  # macOS-only, so it cannot run on these self-hosted runners and is triggered
  # by hand against `main` instead of on every merge (see that file for why).

  ios-release:
    if: inputs.platform == 'both' || inputs.platform == 'ios'
    needs: guard
    runs-on: [self-hosted, macOS]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          # Always ship what is on `main`, never the branch the button was
          # pressed from — a TestFlight build must match what prod serves.
          ref: main
          # `PULL_KEY_REPO_V2` — see the note on android-release in
          # prod-workflow.yml. The old `PULL_KEY_REPO` no longer authenticates.
          submodules: recursive
          ssh-key: ${{ secrets.PULL_KEY_REPO_V2 }}

      - name: Use the Mac's Homebrew and cargo tools
        run: |
          for dir in /opt/homebrew/bin "$HOME/.cargo/bin"; do
            if [ -d "$dir" ]; then echo "$dir" >> "$GITHUB_PATH"; fi
          done

      # Apple requires the iOS 26 SDK (Xcode 26+) for App Store uploads.
      # `setup-xcode` switches Xcode with sudo, which a self-hosted runner does
      # not have, so pick the newest installed Xcode 26+ instead.
      - name: Select Xcode 26+
        run: |
          best=""
          best_key=0
          for app in /Applications/Xcode*.app; do
            [ -d "$app" ] || continue
            version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist" 2>/dev/null || true)
            key=$(echo "$version" | awk -F. '$1 ~ /^[0-9]+$/ { printf "%d", $1 * 10000 + $2 * 100 + $3 }')
            if [ -n "$key" ] && [ "$key" -ge 260000 ] && [ "$key" -gt "$best_key" ]; then
              best="$app"
              best_key="$key"
            fi
          done
          if [ -z "$best" ]; then
            echo "::error::Xcode 26 or later is required (App Store uploads need the iOS 26 SDK). Install it into /Applications on the runner."
            exit 1
          fi
          developer_dir="$best/Contents/Developer"
          echo "DEVELOPER_DIR=$developer_dir" >> "$GITHUB_ENV"
          # `cargo tauri ios build` (cargo-mobile2) runs xcodebuild with an
          # explicit environment of HOME, PATH and a few others, which drops
          # DEVELOPER_DIR, so the /usr/bin shims fall back to `xcode-select -p`.
          # Wrappers first on PATH pin the choice through that.
          wrappers="$RUNNER_TEMP/xcode-bin"
          mkdir -p "$wrappers"
          for tool in xcodebuild xcrun; do
            printf '#!/bin/sh\nDEVELOPER_DIR="%s" exec /usr/bin/%s "$@"\n' "$developer_dir" "$tool" > "$wrappers/$tool"
            chmod +x "$wrappers/$tool"
          done
          echo "$wrappers" >> "$GITHUB_PATH"
          env -i HOME="$HOME" PATH="$wrappers:/usr/bin:/bin" xcodebuild -version
          env -i HOME="$HOME" PATH="$wrappers:/usr/bin:/bin" xcodebuild -showsdks | grep -i ios

      - name: Rust toolchain + targets
        run: |
          command -v rustup >/dev/null || \
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --no-modify-path --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" target add wasm32-unknown-unknown aarch64-apple-ios

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install tauri-cli + xcodegen
        # dioxus-cli (and the dx-launch openssl@3 dylib workaround this step
        # used to need) is gone — app/ratel-tauri/Makefile's `web-build`
        # target bundles the React build (apps/web) instead of the old
        # Dioxus `dx-build` (docs/superpower/
        # 2026-09-14-react-frontend-migration.md § 6).
        env:
          # Authenticated GitHub API: avoids the 403 rate-limit on binstall's
          # release-artifact lookup so it downloads the prebuilt cargo-tauri
          # binary (fast) instead of falling back to a slow source build.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # `command -v … ||` skips reinstall when the cache restored the
          # binary into ~/.cargo/bin.
          command -v cargo-tauri >/dev/null || cargo install --locked tauri-cli --version "^2.0.0"
          # `make gen-xcodeproj` regenerates the pbxproj from project.yml.
          command -v xcodegen >/dev/null || brew install xcodegen

      - name: Enable corepack + install pnpm workspace deps
        # `make testflight` → `web-build` runs `pnpm -C apps/web build`,
        # which needs the workspace's root deps installed first.
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Import signing certificate & provisioning profile
        env:
          IOS_DIST_CERT_BASE64: ${{ secrets.IOS_DIST_CERT_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/dist_cert.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          PROFILE_PATH="$PROFILES_DIR/ci-appstore.mobileprovision"

          echo "$IOS_DIST_CERT_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "SIGNING_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$IOS_DIST_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          rm -f "$CERT_PATH"

          # A runner that already holds this identity in its login keychain
          # would see it twice on the search list, and codesign rejects an
          # ambiguous identity. Add the CI keychain only when it is missing.
          identity=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk '$2 ~ /^[0-9A-F]{40}$/ { print $2; exit }')
          if [ -n "$identity" ] && security find-identity -v -p codesigning login.keychain-db | grep -q "$identity"; then
            echo "The distribution identity is already in the login keychain; signing with that copy."
          else
            security list-keychains -d user | sed -e 's/^[[:space:]]*"//' -e 's/"$//' > "$RUNNER_TEMP/keychains.before"
            keychains=()
            while IFS= read -r keychain; do keychains+=("$keychain"); done < "$RUNNER_TEMP/keychains.before"
            security list-keychains -d user -s "$KEYCHAIN_PATH" "${keychains[@]}"
            echo "RESTORE_KEYCHAINS=$RUNNER_TEMP/keychains.before" >> "$GITHUB_ENV"
          fi

          mkdir -p "$PROFILES_DIR"
          if [ ! -e "$PROFILE_PATH" ]; then
            echo "$IOS_PROVISION_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
            echo "REMOVE_PROFILE=$PROFILE_PATH" >> "$GITHUB_ENV"
          fi

      - name: Write App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
        run: |
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          mkdir -p "$(dirname "$KEY_PATH")"
          if [ -e "$KEY_PATH" ]; then
            echo "The App Store Connect key is already on this runner; leaving it in place."
          else
            echo "$ASC_API_KEY_BASE64" | base64 --decode > "$KEY_PATH"
            echo "REMOVE_ASC_KEY=$KEY_PATH" >> "$GITHUB_ENV"
          fi

      # GoogleService-Info.plist is gitignored (Firebase client config), absent
      # on a clean checkout. `make testflight` → `gsi-copy` bundles it for
      # [FIRApp configure] (FCM push), so decode it from a secret first.
      - name: Write GoogleService-Info.plist (iOS Firebase client config)
        working-directory: app/ratel-tauri
        env:
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICE_INFO_PLIST_BASE64" ]; then
            echo "::error::GOOGLE_SERVICE_INFO_PLIST_BASE64 secret not set — iOS build needs GoogleService-Info.plist (gitignored). Add it in Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "$GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 --decode > GoogleService-Info.plist
          echo "Wrote GoogleService-Info.plist ($(wc -c < GoogleService-Info.plist) bytes)"

      - name: Build & upload to TestFlight (prod)
        working-directory: app/ratel-tauri
        env:
          ENV: prod
          MOBILE_API_URL: https://ratel.foundation
          DYNAMO_TABLE_PREFIX: ratel-prod
          RUSTFLAGS: "-D warnings"
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          PORTONE_STORE_ID: ${{ secrets.PORTONE_STORE_ID }}
          PORTONE_INICIS_CHANNEL_KEY: ${{ secrets.PROD_PORTONE_INICIS_CHANNEL_KEY }}
          PORTONE_KPN_CHANNEL_KEY: ${{ secrets.PORTONE_KPN_BILLING_KEY_CHANNEL_KEY }}
          PORTONE_API_SECRET: ${{ secrets.PORTONE_API_SECRET }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MEASUREMENT_ID: ${{ secrets.FIREBASE_MEASUREMENT_ID }}
          # Read by app/ratel-tauri/Makefile's `web-build` target and forwarded
          # as VITE_WALLETCONNECT_PROJECT_ID to the React build — never
          # VITE_BYPASS here (store builds never talk to a bypass backend).
          WALLETCONNECT_PROJECT_ID: ${{ secrets.WALLETCONNECT_PROJECT_ID }}
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_REGION: ap-northeast-2
          AWS_ACCOUNT_ID: test
        run: |
          make testflight \
            APPLE_DEVELOPMENT_TEAM=7P4Z67D4N7 \
            ASC_KEY_ID=${{ secrets.ASC_KEY_ID }} \
            ASC_ISSUER_ID=${{ secrets.ASC_ISSUER_ID }}

      - name: Remove signing material from this runner
        if: always()
        run: |
          if [ -n "${RESTORE_KEYCHAINS:-}" ] && [ -f "$RESTORE_KEYCHAINS" ]; then
            keychains=()
            while IFS= read -r keychain; do keychains+=("$keychain"); done < "$RESTORE_KEYCHAINS"
            security list-keychains -d user -s "${keychains[@]}"
          fi
          if [ -n "${SIGNING_KEYCHAIN:-}" ] && [ -e "$SIGNING_KEYCHAIN" ]; then
            security delete-keychain "$SIGNING_KEYCHAIN" || true
          fi
          if [ -n "${REMOVE_PROFILE:-}" ]; then rm -f "$REMOVE_PROFILE"; fi
          if [ -n "${REMOVE_ASC_KEY:-}" ]; then rm -f "$REMOVE_ASC_KEY"; fi
          rm -f app/ratel-tauri/GoogleService-Info.plist app/ratel-tauri/src-tauri/gen/apple/GoogleService-Info.plist
