name: Mobile release

# Ships the mobile apps: Android AAB → Play internal track, iOS .ipa →
# TestFlight. Both build from `main`, whichever branch the button is pressed
# from, so a store build always matches what prod serves.
#
# MANUAL, and separate from prod-workflow.yml, for two independent reasons.
#
# 1. Neither can run on our self-hosted runners. iOS needs Xcode, which is
#    macOS-only. Android needs the NDK, and Google ships its toolchains for
#    linux-x86_64 only — there is no linux-aarch64 build — so on our arm64
#    nodes the NDK clang dies with `exit status: 126` before compiling
#    anything. (Emulating x86_64 would mean registering binfmt_misc on the
#    host — privileged and cluster-wide, and it is unregistered today — and
#    would then run that clang 5-10x slower for every C dependency.) So both
#    need GitHub-hosted runners, which bill minutes.
#
# 2. Even if they were free, a store build per server deploy buys nothing:
#    review takes days. At ~15 prod deploys a month, iOS alone (macOS bills at
#    10x, ~35 min a build) would be ~5,250 billed minutes against a
#    3,000-minute allowance — which is exactly how CI got blocked on
#    2026-08-10. On demand it is ~350.
#
# The free `guard` job holds the typed confirmation, so a mistyped input never
# starts a billed runner.
#
# Build numbers come from `date +%s` (app/ratel-tauri/Makefile), so repeated
# runs never collide on Play or App Store Connect. Bump the marketing version
# in app/ratel-tauri/src-tauri/tauri.conf.json when you ship a new one.

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Which app(s) to ship"
        type: choice
        required: true
        default: both
        options: [both, android, ios]
      confirm:
        description: "Type RELEASE to confirm a store upload"
        type: string
        required: true

jobs:
  # Free gate in front of the billed jobs.
  guard:
    runs-on: self-hosted
    steps:
      - name: Require typed confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "RELEASE" ]; then
            echo "::error::confirm must be exactly RELEASE (got '${{ inputs.confirm }}')"
            exit 1
          fi
          echo "shipping: ${{ inputs.platform }}"

  android-release:
    if: inputs.platform == 'both' || inputs.platform == 'android'
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # crates.io downloads intermittently fail in CI with curl "[55] Failed
    # sending data to the peer (Broken pipe)" during `cargo metadata`/build —
    # an HTTP/2 multiplexing flake, not a code/dependency problem. Retry
    # aggressively, fetch git deps via the git CLI, and disable HTTP/2
    # multiplexing (the common fix for the broken-pipe signature).
    env:
      CARGO_NET_RETRY: "10"
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      CARGO_HTTP_MULTIPLEXING: "false"
    steps:
      # `PULL_KEY_REPO_V2`, not `PULL_KEY_REPO`. The original key stopped
      # authenticating and was replaced in f0a38d447 (2026-08-26); that fix
      # was written against the AWS-era workflow and got lost when the k3s
      # migration rewrote this file, which is why the first self-hosted run
      # burned a retry on "Permission denied (publickey)" before falling back
      # to HTTPS.
      #
      # Kept (rather than dropped as the other jobs did) so a submodule added
      # later is fetched without anyone remembering to re-add this.
      - uses: actions/checkout@v6
        with:
          ref: main
          submodules: recursive
          ssh-key: ${{ secrets.PULL_KEY_REPO_V2 }}

      - name: Restore cache
        uses: actions/cache/restore@v5
        with:
          key: android-release-${{ runner.os }}-rust-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            android-release-${{ runner.os }}-rust-
          path: |
            ~/.cargo/bin
            target
            app/ratel-tauri/dx-tauri-target

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: wasm32-unknown-unknown,aarch64-linux-android
          cache: false

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0 ndk;29.0.14206865"

      - uses: cargo-bins/cargo-binstall@main

      - name: Install dioxus-cli + tauri-cli
        run: |
          # `--locked` pins dioxus-cli's published lockfile (git2 0.20); the
          # source-build fallback otherwise grabs git2 0.21 and breaks auth-git2.
          cargo binstall -y --locked dioxus-cli
          cargo binstall -y --locked --version "^2.0.0" tauri-cli

      - name: Write upload keystore + signing config
        working-directory: app/ratel-tauri/src-tauri/gen/android
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > upload-keystore.jks
          cat > keystore.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_ALIAS_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=$(pwd)/upload-keystore.jks
          EOF

      # google-services.json is gitignored (Firebase client config), absent on a
      # clean checkout. `make release-aab` → `gs-copy` copies it for the
      # google-services Gradle plugin (FCM push), so decode it from a secret.
      - name: Write google-services.json (Android Firebase client config)
        working-directory: app/ratel-tauri
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "::error::GOOGLE_SERVICES_JSON_BASE64 secret not set — Android build needs google-services.json (gitignored). Add it in Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > google-services.json
          echo "Wrote google-services.json ($(wc -c < google-services.json) bytes)"

      - name: Build signed release AAB (prod)
        working-directory: app/ratel-tauri
        env:
          ENV: prod
          MOBILE_API_URL: https://ratel.foundation
          ANDROID_TARGET: aarch64-linux-android
          # versionCode is computed in the run script (GH Actions expressions
          # have no arithmetic): 1000 + run_number, to stay above manual uploads.
          # Offset by 200 so this workflow's run numbers stay above what the
          # old prod-workflow.yml already shipped. `github.run_number` counts
          # per workflow FILE, so moving this job here reset it to 1 and the
          # first run produced 1.0.1 / versionCode 1001 — below the 1182 already
          # on Play, which rejected it: "You cannot rollout this release because
          # it does not allow any existing users to upgrade to the newly added
          # APKs." Renaming or moving this file again resets the counter, so the
          # offset has to be raised past the highest shipped code if that happens.
          ANDROID_VERSION_NAME: "1.0.${{ 200 + github.run_number }}"
          DYNAMO_TABLE_PREFIX: ratel-prod
          RUSTFLAGS: "-D warnings"
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          PORTONE_STORE_ID: ${{ secrets.PORTONE_STORE_ID }}
          PORTONE_INICIS_CHANNEL_KEY: ${{ secrets.PROD_PORTONE_INICIS_CHANNEL_KEY }}
          PORTONE_KPN_CHANNEL_KEY: ${{ secrets.PORTONE_KPN_BILLING_KEY_CHANNEL_KEY }}
          PORTONE_API_SECRET: ${{ secrets.PORTONE_API_SECRET }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MEASUREMENT_ID: ${{ secrets.FIREBASE_MEASUREMENT_ID }}
          # app/ratel/Makefile's BUILD_ENV resolves AWS_ACCOUNT_ID via the AWS
          # CLI; the client build only needs these to be non-empty placeholders.
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_REGION: ap-northeast-2
          AWS_ACCOUNT_ID: test
        run: |
          # setup-android exports ANDROID_HOME; point NDK_HOME at the version we
          # installed (Makefile's Linux default /opt/android-ndk doesn't exist here).
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/29.0.14206865"
          export NDK_HOME="$ANDROID_NDK_HOME"
          # Must stay strictly above every code already on Play (see the
          # ANDROID_VERSION_NAME note above); 1182 was the highest as of 2026-09-02.
          export ANDROID_VERSION_CODE=$(( 1200 + ${{ github.run_number }} ))
          echo "versionCode=$ANDROID_VERSION_CODE"
          # release-aab depends on dx-build (web bundle) + a signed AAB build.
          make release-aab
          echo "AAB:"
          find src-tauri/gen/android -name 'app-universal-release.aab' -print

      - name: Upload to Google Play (internal track)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: co.biyard.ratel
          releaseFiles: app/ratel-tauri/src-tauri/gen/android/app/build/outputs/bundle/universalRelease/app-universal-release.aab
          # `track` is deprecated in favour of `tracks` (the action warns on
          # every run). Same meaning, one entry.
          tracks: internal
          status: completed
          # NOTE: `changesNotSentForReview` is deliberately NOT set.
          #
          # It used to be `true` here, for a store listing that was not yet
          # reviewable — back then edits.commit failed with "Changes cannot be
          # sent for review automatically" unless the flag suppressed it. The
          # listing is complete now, so Play submits internal-track edits for
          # review on its own and rejects the flag outright:
          #
          #   Error: Changes are sent for review automatically.
          #          The query parameter changesNotSentForReview must not be set.
          #
          # The two states are mutually exclusive, so this only ever needs
          # setting again if the app returns to an incomplete listing.

      - name: Save cache
        if: always()
        uses: actions/cache/save@v5
        with:
          key: android-release-${{ runner.os }}-rust-${{ hashFiles('**/Cargo.lock') }}
          path: |
            ~/.cargo/bin
            target
            app/ratel-tauri/dx-tauri-target

  # # ── iOS → TestFlight ────────────────────────────────────────────────
  # iOS release lives in .github/workflows/mobile-ios-release.yml — Xcode is
  # macOS-only, so it cannot run on these self-hosted runners and is triggered
  # by hand against `main` instead of on every merge (see that file for why).

  ios-release:
    if: inputs.platform == 'both' || inputs.platform == 'ios'
    needs: guard
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          # Always ship what is on `main`, never the branch the button was
          # pressed from — a TestFlight build must match what prod serves.
          ref: main
          # `PULL_KEY_REPO_V2` — see the note on android-release in
          # prod-workflow.yml. The old `PULL_KEY_REPO` no longer authenticates.
          submodules: recursive
          ssh-key: ${{ secrets.PULL_KEY_REPO_V2 }}

      # Apple now requires the iOS 26 SDK (Xcode 26+) for App Store uploads.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode / SDK
        run: xcodebuild -version && xcodebuild -showsdks | grep -i ios

      - name: Restore cache
        uses: actions/cache/restore@v5
        with:
          key: ios-release-${{ runner.os }}-rust-ios18-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ios-release-${{ runner.os }}-rust-ios18-
          path: |
            ~/.cargo/bin
            target
            app/ratel-tauri/dx-tauri-target

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: wasm32-unknown-unknown,aarch64-apple-ios
          cache: false

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: cargo-bins/cargo-binstall@main

      - name: Install dioxus-cli + tauri-cli + xcodegen
        env:
          # Authenticated GitHub API: avoids the 403 rate-limit on binstall's
          # release-artifact lookup so it downloads the prebuilt dx/cargo-tauri
          # binaries (fast) instead of falling back to a slow source build.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # `command -v … ||` skips reinstall when the cache restored the binary
          # into ~/.cargo/bin — otherwise binstall's source fallback aborts with
          # "binary `dx` already exists in destination".
          command -v dx >/dev/null || cargo binstall -y --locked dioxus-cli
          command -v cargo-tauri >/dev/null || cargo binstall -y --locked --version "^2.0.0" tauri-cli
          # `make gen-xcodeproj` regenerates the pbxproj from project.yml.
          command -v xcodegen >/dev/null || brew install xcodegen

      - name: Ensure openssl@3 dylib for prebuilt dx
        run: |
          # The prebuilt `dx` from cargo-binstall is dynamically linked against
          # `/usr/local/opt/openssl@3/lib/libssl.3.dylib`. On the macos-15
          # (Apple Silicon) runner Homebrew lives at `/opt/homebrew`, and a
          # runner-image update left no openssl under `/usr/local`, so `dx`
          # aborts at launch with `dyld: Library not loaded` (Abort trap: 6)
          # before it can build. Install openssl@3 and symlink it to the exact
          # path the binary hard-codes. (libssl 3.x is ABI-stable, so the
          # current 3.x satisfies the `libssl.3.dylib` soname.)
          brew install openssl@3 || brew upgrade openssl@3 || true
          PREFIX="$(brew --prefix openssl@3)"
          sudo mkdir -p /usr/local/opt
          sudo ln -sfn "$PREFIX" /usr/local/opt/openssl@3
          test -f /usr/local/opt/openssl@3/lib/libssl.3.dylib
          # If the prebuilt `dx` still can't launch (e.g. it's x86_64 and the
          # symlinked openssl is arm64, an arch mismatch), rebuild dioxus-cli
          # from source so it links against THIS host's openssl. Slower, but
          # only runs when the fast path fails.
          if ! dx --version >/dev/null 2>&1; then
            echo "prebuilt dx failed to launch — rebuilding dioxus-cli from source"
            cargo install --locked --force dioxus-cli
          fi
          # Fail fast here (not 200 lines into the build) if dx still can't run.
          dx --version

      - name: Import signing certificate & provisioning profile
        env:
          IOS_DIST_CERT_BASE64: ${{ secrets.IOS_DIST_CERT_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/dist_cert.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"

          echo "$IOS_DIST_CERT_BASE64" | base64 --decode > "$CERT_PATH"

          # Throwaway keychain, added to the search list so xcodebuild sees the cert.
          security create-keychain -p "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$IOS_DIST_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db

          mkdir -p "$PROFILES_DIR"
          echo "$IOS_PROVISION_PROFILE_BASE64" | base64 --decode > "$PROFILES_DIR/ci-appstore.mobileprovision"

      - name: Write App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$ASC_API_KEY_BASE64" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"

      # GoogleService-Info.plist is gitignored (Firebase client config), absent
      # on a clean checkout. `make testflight` → `gsi-copy` bundles it for
      # [FIRApp configure] (FCM push), so decode it from a secret first.
      - name: Write GoogleService-Info.plist (iOS Firebase client config)
        working-directory: app/ratel-tauri
        env:
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICE_INFO_PLIST_BASE64" ]; then
            echo "::error::GOOGLE_SERVICE_INFO_PLIST_BASE64 secret not set — iOS build needs GoogleService-Info.plist (gitignored). Add it in Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "$GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 --decode > GoogleService-Info.plist
          echo "Wrote GoogleService-Info.plist ($(wc -c < GoogleService-Info.plist) bytes)"

      - name: Build & upload to TestFlight (prod)
        working-directory: app/ratel-tauri
        env:
          ENV: prod
          MOBILE_API_URL: https://ratel.foundation
          DYNAMO_TABLE_PREFIX: ratel-prod
          RUSTFLAGS: "-D warnings"
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          PORTONE_STORE_ID: ${{ secrets.PORTONE_STORE_ID }}
          PORTONE_INICIS_CHANNEL_KEY: ${{ secrets.PROD_PORTONE_INICIS_CHANNEL_KEY }}
          PORTONE_KPN_CHANNEL_KEY: ${{ secrets.PORTONE_KPN_BILLING_KEY_CHANNEL_KEY }}
          PORTONE_API_SECRET: ${{ secrets.PORTONE_API_SECRET }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MEASUREMENT_ID: ${{ secrets.FIREBASE_MEASUREMENT_ID }}
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_REGION: ap-northeast-2
          AWS_ACCOUNT_ID: test
        run: |
          make testflight \
            APPLE_DEVELOPMENT_TEAM=7P4Z67D4N7 \
            ASC_KEY_ID=${{ secrets.ASC_KEY_ID }} \
            ASC_ISSUER_ID=${{ secrets.ASC_ISSUER_ID }}

      - name: Save cache
        if: always()
        uses: actions/cache/save@v5
        with:
          key: ios-release-${{ runner.os }}-rust-ios18-${{ hashFiles('**/Cargo.lock') }}
          path: |
            ~/.cargo/bin
            target
            app/ratel-tauri/dx-tauri-target
