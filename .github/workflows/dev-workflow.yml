name: Dev deploy

# Deploys the ratel dev environment to the HOME k3s cluster on every push to
# `dev`, replacing the AWS deploy path (Lambda build → cdk deploy → S3 sync +
# CloudFront invalidation) this workflow used to run. Modeled on asset's
# prod-workflow.yml. The AWS dev stack is NOT touched: it keeps serving its
# last-deployed version at dev.ratel.foundation until that DNS is flipped;
# `cdk/` and `make build-lambda` stay in the repo for an eventual return.
#
# Architecture:
# - The CI runners are k8s PODS in the cluster (biyard org runners, arm64,
#   buildctl + kubectl preset, no docker CLI). Both cluster nodes are arm64,
#   so `make build` / `cargo build` on the runner natively produce the
#   deployed binaries — no cross-compile.
# - build-images builds TWO images with the REAL dev compile-time env (the
#   same GitHub-secret env block the old lambda build job used —
#   DYNAMO_TABLE_PREFIX=ratel-dev, real AWS creds baked via option_env!,
#   DYNAMO_ENDPOINT=none → real AWS DynamoDB), pushed to the in-cluster
#   registry tagged :dev-<sha> AND :dev (deploys pin the sha tag):
#     * ratel-app-shell — `make build` (client web,fullstack + server
#       `server`; NO bypass/local-dev/lambda), packaged with
#       app/ratel/Dockerfile.
#     * ratel-events   — ratel_cdc + ratel_worker (`--features redpanda`),
#       packaged with deploy/dev/Dockerfile.events.
# - deploy applies deploy/dev/*.yaml (envsubst) into the STABLE `ratel-dev`
#   namespace: app-shell (2 replicas) + Service + Ingress
#   (ratel-dev.biyard.co live now via the wildcard *.biyard.co DNS +
#   cert-manager; dev.ratel.foundation pre-wired but inert until its DNS
#   flips), plus the events tier (ratel-cdc + three role workers).
#   Runtime secrets (LAUNCHPAD_*, QDRANT_API_KEY, the FCM service account)
#   come from GitHub secrets → k8s Secrets, mirroring what cdk injected
#   into the Lambda runtime env.
# - smoke-test probes the PUBLIC https://ratel-dev.biyard.co with the real
#   certificate.
#
# Rollback: `git revert` on dev redeploys the previous sha (images are
# sha-tagged and stay in the registry). The AWS stack still holds its last
# version as a second fallback until the DNS cutover.

on:
  push:
    branches:
      - dev
  workflow_dispatch:
    inputs:
      icp_allow_rebuild:
        description: >-
          Rebuild the ICP subnet from scratch. Needed when replicaCount
          changes, because the registry fixes subnet membership when it is
          generated. DISCARDS the chain and every canister on it.
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  # ┌────────────────────────────────────────────────────────────────────┐
  # │ EVENTS SHADOW-MODE SWITCH (docs/k3s-migration/01-events-redpanda-  │
  # │ plan.md § W5, docs/k3s-migration/06-dev-deploy.md).                │
  # │                                                                    │
  # │ CUT OVER 2026-08-04: dev workers run LIVE ("0") — the Redpanda     │
  # │ pipeline is the ONLY dev event path. (The dev AWS EventBridge bus  │
  # │ turned out to have no pipes/rules at all, so the flip carried no   │
  # │ double-processing risk and there was nothing to disable.)          │
  # │                                                                    │
  # │ Setting this back to "1" re-shadows the workers: they consume      │
  # │ dev.ratel.cdc.v1, evaluate the filter rules, log                   │
  # │ `dry-run: would dispatch`, commit offsets — and run NO handlers.   │
  # │ That is the event-path rollback (offsets keep advancing, so        │
  # │ events seen while shadowed are skipped, not replayed).             │
  # │ Procedure: docs/k3s-migration/06-dev-deploy.md. (The CDC producer  │
  # │ has no dry-run — producing to the topic is side-effect-free.)      │
  # └────────────────────────────────────────────────────────────────────┘
  WORKER_DRY_RUN: "0"

jobs:
  # ── Build the two dev images (native arm64 → buildkitd → registry) ──────
  # One job, not two: both images share the checkout, toolchain, caches, and
  # the 60-line compile-time secret env block (option_env! bakes it into the
  # binaries), and the events cargo build reuses dependency artifacts the dx
  # server build just compiled.
  #
  # This job (the `dev` branch) SAVES the ratel-cargo-* / ratel-target-*
  # caches that pr-workflow's self-hosted jobs restore read-only.
  build-images:
    runs-on: [self-hosted, linux, amd64]
    timeout-minutes: 120
    env:
      # ── Compile-time env — replicated from the old lambda build job. ──
      # These bake into the binaries via option_env! (aws_config.rs etc.);
      # the events binaries reach DynamoDB through the same baked config.
      DISABLE_ANSI: true
      ENV: dev
      RUST_LOG: error
      SERVICE: app-shell
      DOMAIN: dev.ratel.foundation
      BUCKET_NAME: metadata.ratel.foundation
      SLACK_HOOK: ${{ secrets.DEV_SLACK }}

      # Real AWS credentials — passed to buildkit as --secret (never land in
      # the image's build history or layers; see scripts/buildkit-image.sh).
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ap-northeast-2
      ACCOUNT_ID: ${{ secrets.ACCOUNT_ID }}

      BINANCE_API_KEY: ${{ secrets.DEV_BINANCE_API_KEY }}
      BINANCE_SECRET_KEY: ${{ secrets.DEV_BINANCE_SECRET_KEY }}
      BINANCE_WEBHOOK: https://api.dev.ratel.foundation/v2/binances/webhooks
      REDIRECT_DOMAIN: https://dev.ratel.foundation

      KAIA_ENDPOINT: https://public-en-kairos.node.kaia.io
      KAIA_ARCHIVE_ENDPOINT: https://archive-en-kairos.node.kaia.io
      BLOCK_EXPLORER_URL: https://kairos.kaiascan.io
      KAIA_FEEPAYER_KEY: ${{ secrets.DEV_KAIA_KEY }}
      KAIA_FEEPAYER_ADDR: ${{ secrets.DEV_KAIA_ADDR }}
      KAIA_OWNER_KEY: ${{ secrets.DEV_KAIA_KEY }}
      KAIA_OWNER_ADDR: ${{ secrets.DEV_KAIA_ADDR }}

      TELEGRAM_TOKEN: ${{ secrets.DEV_TELEGRAM_TOKEN }}

      BBS_BLS_X: ${{ secrets.BBS_BLS_X }}
      BBS_BLS_Y: ${{ secrets.BBS_BLS_Y }}
      BBS_BLS_D: ${{ secrets.BBS_BLS_D }}
      BBS_BLS_CRV: ${{ secrets.BBS_BLS_CRV }}

      P256_X: ${{ secrets.P256_X }}
      P256_Y: ${{ secrets.P256_Y }}
      P256_D: ${{ secrets.P256_D }}
      P256_CRV: ${{ secrets.P256_CRV }}

      DYNAMO_TABLE_PREFIX: ratel-dev
      DYNAMODB_ENDPOINT: none

      FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
      FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
      FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
      FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
      FIREBASE_MEASUREMENT_ID: ${{ secrets.FIREBASE_MEASUREMENT_ID }}

      PORTONE_STORE_ID: ${{ secrets.DEV_PORTONE_STORE_ID}}
      PORTONE_INICIS_CHANNEL_KEY: ${{ secrets.DEV_PORTONE_INICIS_CHANNEL_KEY }}
      PORTONE_API_SECRET: ${{ secrets.DEV_PORTONE_API_SECRET }}
      PORTONE_KPN_CHANNEL_KEY: ${{ secrets.DEV_PORTONE_KPN_CHANNEL_KEY }}

      QDRANT_URL: ${{ secrets.RATEL_QDRANT_URL }}
      QDRANT_API_KEY: ${{secrets.DEV_QDRANT_API_KEY }}

      WALLETCONNECT_PROJECT_ID: ${{ secrets.WALLETCONNECT_PROJECT_ID }}

      RATEL_CANISTER_ID: uxrrr-q7777-77774-qaaaq-cai
      IC_URL: https://icp.dev.biyard.co
      ICP_IDENTITY_PEM: ${{ secrets.DEV_ICP_IDENTITY_PEM }}
      VOTER_TAG_SECRET: ${{ secrets.DEV_VOTER_TAG_SECRET }}
      ATTR_VOTING_AUTHORITY_JSON: ${{ secrets.DEV_ATTR_VOTING_AUTHORITY_JSON }}

      # Cross-posting credential AEAD key (envvar form: "v<int>:<base64-no-pad 32 bytes>").
      # Backup of the value is held in 1Password (admin-only vault) — losing
      # this secret without the backup makes every stored connection
      # unrecoverable. PREVIOUS is set only during a key rotation transition.
      CROSS_POSTING_DATA_KEY: ${{ secrets.DEV_CROSS_POSTING_DATA_KEY }}
      CROSS_POSTING_DATA_KEY_PREVIOUS: ${{ secrets.DEV_CROSS_POSTING_DATA_KEY_PREVIOUS }}

      # LinkedIn OAuth (Phase 1B): CLIENT_ID is public-ish (rides the
      # redirect URL), CLIENT_SECRET is server-only (token-exchange POST).
      LINKEDIN_CLIENT_ID: ${{ secrets.DEV_LINKEDIN_CLIENT_ID }}
      LINKEDIN_CLIENT_SECRET: ${{ secrets.DEV_LINKEDIN_CLIENT_SECRET }}
      LAUNCHPAD_BASE_URL: ${{ secrets.DEV_LAUNCHPAD_BASE_URL }}
      LAUNCHPAD_PROJECT_ID: ${{ secrets.DEV_LAUNCHPAD_PROJECT_ID }}
      LAUNCHPAD_PARTNER_SECRET: ${{ secrets.DEV_LAUNCHPAD_PARTNER_SECRET }}
      LAUNCHPAD_POINT_SYMBOL: RT

      # Registry tags: the deploy pins dev-<sha>; :dev is a moving
      # convenience alias for manual `kubectl set image` / debugging.
      SHA_TAG: dev-${{ github.sha }}

    steps:
      - uses: actions/checkout@v6

      - name: Push app-shell image (buildkit cross-compile → :dev-<sha> and :dev)
        # Multi-arch (amd64+arm64): the Dockerfile cross-compiles INSIDE
        # buildkit via tonistiigi/xx — no native cargo build on this runner
        # anymore (see app/ratel/Dockerfile's header for the rationale).
        # Non-secret compile-time config rides as BUILD_ARGS; every
        # sensitive value (AWS creds, API secrets, PEMs, AEAD keys) rides as
        # SECRETS (buildctl --secret — never lands in the image's build
        # history; app/ratel/Dockerfile reads each with
        # RUN --mount=type=secret).
        env:
          NAME: ratel-app-shell
          DOCKERFILE: app/ratel/Dockerfile
          BUILD_ARGS: >-
            ENV=${{ env.ENV }}
            DOMAIN=${{ env.DOMAIN }}
            BUCKET_NAME=${{ env.BUCKET_NAME }}
            DYNAMO_TABLE_PREFIX=${{ env.DYNAMO_TABLE_PREFIX }}
            DYNAMODB_ENDPOINT=${{ env.DYNAMODB_ENDPOINT }}
            AWS_REGION=${{ env.AWS_REGION }}
            KAIA_ENDPOINT=${{ env.KAIA_ENDPOINT }}
            KAIA_ARCHIVE_ENDPOINT=${{ env.KAIA_ARCHIVE_ENDPOINT }}
            BLOCK_EXPLORER_URL=${{ env.BLOCK_EXPLORER_URL }}
            IC_URL=${{ env.IC_URL }}
            RATEL_CANISTER_ID=${{ env.RATEL_CANISTER_ID }}
            QDRANT_URL=${{ env.QDRANT_URL }}
            QDRANT_PREFIX=ratel-dev
            LAUNCHPAD_POINT_SYMBOL=${{ env.LAUNCHPAD_POINT_SYMBOL }}
            WALLETCONNECT_PROJECT_ID=${{ env.WALLETCONNECT_PROJECT_ID }}
            DISABLE_ANSI=${{ env.DISABLE_ANSI }}
            RUST_LOG=${{ env.RUST_LOG }}
            FEATURES=server
          SECRETS: >-
            AWS_ACCESS_KEY_ID
            AWS_SECRET_ACCESS_KEY
            ACCOUNT_ID
            PORTONE_STORE_ID
            PORTONE_INICIS_CHANNEL_KEY
            PORTONE_KPN_CHANNEL_KEY
            PORTONE_API_SECRET
            FIREBASE_API_KEY
            FIREBASE_AUTH_DOMAIN
            FIREBASE_PROJECT_ID
            FIREBASE_STORAGE_BUCKET
            FIREBASE_MESSAGING_SENDER_ID
            FIREBASE_APP_ID
            FIREBASE_MEASUREMENT_ID
            ICP_IDENTITY_PEM
            VOTER_TAG_SECRET
            ATTR_VOTING_AUTHORITY_JSON
            QDRANT_API_KEY
            LINKEDIN_CLIENT_ID
            LINKEDIN_CLIENT_SECRET
            LAUNCHPAD_BASE_URL
            LAUNCHPAD_PROJECT_ID
            LAUNCHPAD_PARTNER_SECRET
            CROSS_POSTING_DATA_KEY
            CROSS_POSTING_DATA_KEY_PREVIOUS
            TELEGRAM_TOKEN
            BBS_BLS_X
            BBS_BLS_Y
            BBS_BLS_D
            BBS_BLS_CRV
            P256_X
            P256_Y
            P256_D
            P256_CRV
        run: |
          set -euo pipefail
          IMAGE_TAG="${SHA_TAG}" bash scripts/buildkit-image.sh
          # Second push is a cache hit in buildkitd — just retags.
          IMAGE_TAG=dev bash scripts/buildkit-image.sh

      - name: Setup Node
        # amd64 migration: this runner pool (unlike the old arm64 pool) has
        # no system-wide Node/corepack install, so `corepack enable` below
        # failed with "command not found" (run 37756874504). Matches the
        # setup-node step already used by pr-workflow.yml's build-web-image.
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build web (React static site)
        env:
          # VITE_* build-time env for the React bundle — mapped from the SAME
          # GitHub secrets the Rust client build used above for the
          # equivalent non-VITE names (see the job env block). VITE_BYPASS is
          # never set for dev — this environment's app-shell has no bypass
          # feature. VITE_TAURI is never set for web.
          VITE_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.FIREBASE_MEASUREMENT_ID }}
          VITE_WALLETCONNECT_PROJECT_ID: ${{ secrets.WALLETCONNECT_PROJECT_ID }}
          VITE_PORTONE_STORE_ID: ${{ secrets.DEV_PORTONE_STORE_ID }}
          VITE_PORTONE_INICIS_CHANNEL_KEY: ${{ secrets.DEV_PORTONE_INICIS_CHANNEL_KEY }}
          VITE_ENV: dev
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm -C apps/web build

      - name: Push web image (buildkit → :dev-<sha> and :dev)
        # Web has no native deps / no Rust — multi-arch here is just a
        # manifest-list push of the SAME static dist/server payload under
        # both platforms (apps/web/Dockerfile needs no change).
        run: |
          set -euo pipefail
          export NAME=ratel-web
          export CONTEXT=apps/web
          export DOCKERFILE=apps/web/Dockerfile
          IMAGE_TAG="${SHA_TAG}" bash scripts/buildkit-image.sh
          IMAGE_TAG=dev bash scripts/buildkit-image.sh

      - name: Push events image (buildkit cross-compile → :dev-<sha> and :dev)
        # Same cross-compile approach as app-shell — deploy/dev/Dockerfile.events
        # now builds ratel_cdc + ratel_worker INSIDE buildkit via xx-cargo,
        # for both platforms, from the repo-root context (no more native
        # `cargo build --features redpanda` + ldd + staging-dir dance on
        # this runner).
        env:
          NAME: ratel-events
          DOCKERFILE: deploy/dev/Dockerfile.events
          BUILD_ARGS: >-
            ENV=${{ env.ENV }}
            DYNAMO_TABLE_PREFIX=${{ env.DYNAMO_TABLE_PREFIX }}
            DYNAMODB_ENDPOINT=${{ env.DYNAMODB_ENDPOINT }}
            AWS_REGION=${{ env.AWS_REGION }}
            RUST_LOG=${{ env.RUST_LOG }}
          SECRETS: >-
            AWS_ACCESS_KEY_ID
            AWS_SECRET_ACCESS_KEY
            ACCOUNT_ID
        run: |
          set -euo pipefail
          IMAGE_TAG="${SHA_TAG}" bash scripts/buildkit-image.sh
          IMAGE_TAG=dev bash scripts/buildkit-image.sh

  # ── Deploy (envsubst deploy/dev/*.yaml → k3s namespace `ratel-dev`) ─────
  deploy:
    needs: [build-images]
    runs-on: [self-hosted, Linux]
    timeout-minutes: 45
    # One dev deploy at a time; a newer push queues behind (not cancels) the
    # in-flight one so a half-rolled namespace is never abandoned. Job-level
    # so the tauri/artifact jobs of concurrent runs don't serialize.
    concurrency:
      group: ratel-dev-deploy
      cancel-in-progress: false
    env:
      SHA_TAG: dev-${{ github.sha }}
      NAMESPACE: ratel-dev
      HOST: ratel-dev.biyard.co
      # Runtime-injected config, mirroring what cdk/bin/cdk.ts put into the
      # Lambda RUNTIME env (read via std::env::var — no rebuild needed).
      LAUNCHPAD_BASE_URL: ${{ secrets.DEV_LAUNCHPAD_BASE_URL }}
      LAUNCHPAD_PROJECT_ID: ${{ secrets.DEV_LAUNCHPAD_PROJECT_ID }}
      LAUNCHPAD_PARTNER_SECRET: ${{ secrets.DEV_LAUNCHPAD_PARTNER_SECRET }}
      LAUNCHPAD_POINT_SYMBOL: RT
      QDRANT_API_KEY: ${{ secrets.DEV_QDRANT_API_KEY }}
      # FCM service-account JSON (base64) — mounted as a Secret volume at
      # the path GOOGLE_APPLICATION_CREDENTIALS points to; missing secret
      # just disables push (fcm.rs skips gracefully), same as the lambda
      # bundle behavior.
      FIREBASE_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON_BASE64 }}
    steps:
      - uses: actions/checkout@v6

      - name: Verify cluster access
        # The runner pods carry in-cluster kubectl credentials; fail early
        # with a clear message if this job landed somewhere else.
        run: |
          set -euo pipefail
          kubectl get ns >/dev/null || {
            echo "::error::runner has no cluster access — is this a k3s runner pod?"
            exit 1
          }

      - name: Create namespace + runtime Secrets
        # Secret-handling mirrors asset's prod deploy: only non-empty GitHub
        # secrets become keys, so an unset secret simply leaves the env var
        # absent (the manifests reference the Secret as optional).
        run: |
          set -euo pipefail
          kubectl create namespace "${NAMESPACE}" --dry-run=client -o yaml | kubectl apply -f -

          args=()
          add() { if [ -n "$2" ]; then args+=(--from-literal="$1=$2"); fi; }
          add LAUNCHPAD_BASE_URL "${LAUNCHPAD_BASE_URL}"
          add LAUNCHPAD_PROJECT_ID "${LAUNCHPAD_PROJECT_ID}"
          add LAUNCHPAD_PARTNER_SECRET "${LAUNCHPAD_PARTNER_SECRET}"
          add LAUNCHPAD_POINT_SYMBOL "${LAUNCHPAD_POINT_SYMBOL}"
          add QDRANT_API_KEY "${QDRANT_API_KEY}"
          kubectl -n "${NAMESPACE}" create secret generic ratel-dev-secrets \
            "${args[@]}" --dry-run=client -o yaml | kubectl apply -f -

          # FCM service account → Secret with the single JSON file the
          # firebase volume mounts. Skipped (and any stale copy removed) when
          # the GitHub secret is unset.
          if [ -n "${FIREBASE_SERVICE_ACCOUNT_JSON_BASE64}" ]; then
            tmp=$(mktemp -d)
            echo "${FIREBASE_SERVICE_ACCOUNT_JSON_BASE64}" | base64 -d > "${tmp}/firebase-service-account.json"
            kubectl -n "${NAMESPACE}" create secret generic ratel-dev-firebase \
              --from-file="firebase-service-account.json=${tmp}/firebase-service-account.json" \
              --dry-run=client -o yaml | kubectl apply -f -
            rm -rf "${tmp}"
          else
            kubectl -n "${NAMESPACE}" delete secret ratel-dev-firebase --ignore-not-found
            echo "FIREBASE_SERVICE_ACCOUNT_JSON_BASE64 not set — push disabled (graceful skip)"
          fi

      - name: Deploy the ICP subnet (helm → namespace `infra`)
        # Runs BEFORE the app manifests: app-shell carries
        # IC_URL=http://icp.infra.svc.cluster.local:4100, so the Service has
        # to exist first or the first IC call after a rollout hits nothing.
        #
        # Lands in `infra`, not `ratel-dev`, for the same reason postgres and
        # minio do: it is a shared backing service. A 4-node subnet is four
        # pods and four PVCs — too heavy to copy per namespace — and its chain
        # has to outlive any single app deployment (a PR-preview namespace is
        # torn down; its chain should not be).
        #
        # Four nodes, not one: the same subnet serves the app AND the IITP
        # tc2 throughput measurement, whose metric is "votes included in
        # FINALIZED blocks". A single replica has no consensus, so that
        # number does not exist there — it has to be a real subnet
        # (n = 3f + 1, f = 1) for the measurement to mean anything.
        #
        # Ratel's pipeline drives it because ratel is the only consumer today.
        # If another service starts using the subnet, ownership should move
        # out of this workflow.
        #
        # Idempotent. The subnet registry is generated once and kept in the
        # `icp-subnet` Secret; the hook compares replicaCount against the node
        # count recorded there and refuses to regenerate silently, because a
        # new registry means a new chain from height 0 and every canister
        # redeployed. Changing the subnet size is therefore deliberate:
        #   ICP_ALLOW_REBUILD=true  for the one deploy that does it.
        #
        # The image comes from the separate `ICP image` workflow — the
        # replica is compiled from the ic fork and rebuilding it on every
        # push to dev would add ~5 minutes for a byte-identical result.
        run: |
          set -euo pipefail

          # Keep whatever size the subnet is already running at.
          #
          # tc2.yaml pins replicaCount to 4, and a plain deploy used to impose
          # that on every push. So a tc2 measurement at one node left the next
          # merge to dev to fail: the genconfig hook saw a subnet built for 1
          # against a request for 4, refused to discard the chain without
          # `allowRebuild`, and took the whole deploy down with it. That
          # happened once, and it would keep happening — a measurement and an
          # unrelated merge were fighting over a value neither cared about.
          #
          # Changing the subnet's size is the `ICP subnet` workflow's business,
          # deliberately and with allow_rebuild. A deploy of the app has no
          # opinion about it, so it reads what is there and passes it back.
          size="$(kubectl -n infra get statefulset icp \
                    -o jsonpath='{.spec.replicas}' 2>/dev/null || true)"
          if [ -n "$size" ]; then
            echo "subnet is at ${size} node(s) — keeping it"
            keep_size=(--set "replicaCount=${size}")
          else
            echo "no subnet yet — taking the size from tc2.yaml"
            keep_size=()
          fi

          # Skip entirely when the subnet is already up.
          #
          # The chart's genconfig hook is `pre-install,pre-upgrade`, so a plain
          # `helm upgrade` schedules a Job pod on every app deploy. On a subnet
          # that already exists at the requested size that pod does nothing —
          # it reads the `icp-subnet` Secret, sees the node count matches, and
          # exits 0. But helm still waits for it, so when the node has no pod
          # slots left the Job stays Pending and takes the whole app deploy
          # down with it. That happened on 2026-08-31: the deploy sat on this
          # step while `icp-0` had been Running untouched since 2026-08-28.
          #
          # The subnet is a backing service like postgres or minio. Its
          # lifecycle is not the app's, so an app deploy should not be able to
          # fail on it. Create it when missing, leave it alone when healthy.
          #
          # Trade-off: chart edits no longer reach the cluster from a push to
          # dev. That is the `ICP subnet` workflow's job — run it (it takes
          # `replicas` and `allow_rebuild`), or dispatch this workflow with
          # icp_allow_rebuild, which forces the upgrade path below.
          ready="$(kubectl -n infra get statefulset icp \
                     -o jsonpath='{.status.readyReplicas}' 2>/dev/null || true)"
          # `if` rather than `cmd && var=yes`: under `set -e` the latter's
          # non-zero status on a missing Secret is exactly the fresh-install
          # case, and aborting there would break the one path that must work.
          has_secret=no
          if kubectl -n infra get secret icp-subnet >/dev/null 2>&1; then
            has_secret=yes
          fi
          force="${{ inputs.icp_allow_rebuild || false }}"

          if [ "$force" != "true" ] && [ -n "$size" ] && [ "$ready" = "$size" ] \
             && [ "$has_secret" = yes ]; then
            echo "subnet is healthy (${ready}/${size} ready, registry present) — skipping helm"
            exit 0
          fi

          helm upgrade --install icp infra/helm/icp \
            --namespace infra \
            -f infra/helm/icp/environments/tc2.yaml \
            "${keep_size[@]}" \
            --set subnet.allowRebuild=${{ inputs.icp_allow_rebuild || false }} \
            --wait --timeout 15m

      - name: Apply the dev manifests (envsubst → kubectl apply)
        # Substitution restricted to ${SHA_TAG} (image pin) and
        # ${WORKER_DRY_RUN} (events shadow-mode switch — see the workflow
        # env comment). sed fallback if the runner lacks gettext.
        run: |
          set -euo pipefail
          subst() {
            if command -v envsubst >/dev/null 2>&1; then
              envsubst '${SHA_TAG} ${WORKER_DRY_RUN}'
            else
              sed -e "s|\${SHA_TAG}|${SHA_TAG}|g" -e "s|\${WORKER_DRY_RUN}|${WORKER_DRY_RUN}|g"
            fi
          }
          for f in deploy/dev/*.yaml; do
            echo "---"
            subst < "$f"
          done | kubectl apply -f -

      - name: Wait for every Deployment to roll out
        run: |
          set -euo pipefail
          for d in $(kubectl -n "${NAMESPACE}" get deploy -o name); do
            echo "── rollout ${d}"
            kubectl -n "${NAMESPACE}" rollout status "$d" --timeout=600s
          done

      - name: Wait for web + app-shell to answer through ingress-nginx
        # Pin the host to the ingress controller's ClusterIP (`-k`: the TLS
        # cert may still be issuing via DNS-01 on the very first deploy —
        # routing works before the real cert lands). Since the React
        # frontend migration (docs/superpower/2026-09-14-react-frontend-
        # migration.md § 5.1) "/" is served by the `web` Deployment, not
        # app-shell (now API-only) — probe both backends through the same
        # ingress so a deploy that broke either path split fails here, not
        # in the smoke test. /launchpad/health only accepts POST with a
        # signed body (see the readinessProbe comment on 10-app-shell.yaml),
        # so a plain GET is expected to answer 404/405 — anything other than
        # a connection failure or a 5xx proves the ingress → app-shell route
        # itself works.
        run: |
          set -uo pipefail
          INGRESS_IP=$(kubectl -n infra get svc ingress-nginx-controller -o jsonpath='{.spec.clusterIP}')
          [ -n "$INGRESS_IP" ] || { echo "::error::ingress-nginx-controller service not found"; exit 1; }
          base="https://${HOST}"
          deadline=$(( $(date +%s) + 300 ))
          echo "waiting for ${base}/ (web, ingress=${INGRESS_IP}) ..."
          until curl -sfk --resolve "${HOST}:443:${INGRESS_IP}" -o /dev/null "${base}/"; do
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::web did not answer within 300s"
              kubectl -n "${NAMESPACE}" get pods -o wide || true
              exit 1
            fi
            sleep 10
          done
          echo "✓ ingress serves web at ${base}/"

          deadline=$(( $(date +%s) + 120 ))
          echo "waiting for ${base}/launchpad/health (app-shell, ingress=${INGRESS_IP}) ..."
          until code=$(curl -sk --resolve "${HOST}:443:${INGRESS_IP}" -o /dev/null -w '%{http_code}' "${base}/launchpad/health"); \
                [ "$code" != "000" ] && [ "$code" -lt 500 ]; do
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::app-shell did not answer within 120s (last code: ${code:-000})"
              kubectl -n "${NAMESPACE}" get pods -o wide || true
              exit 1
            fi
            sleep 10
          done
          echo "✓ ingress serves app-shell at ${base}/launchpad/health (http ${code})"

      - name: Check the events tier (pods running + shadow-mode heartbeat)
        # Pods must be Running (their rollouts already succeeded above);
        # then look for one `dry-run: would dispatch` (shadow mode matched a
        # rule) or `worker consuming` (consumer started) line. A quiet CDC
        # stream is normal on dev, so a missing log line is a WARNING, not a
        # failure — a crash-looping worker would have failed rollout status.
        run: |
          set -uo pipefail
          kubectl -n "${NAMESPACE}" get pods -l tier=events -o wide
          found=0
          for d in ratel-worker-default ratel-worker-analyze ratel-worker-egress; do
            if kubectl -n "${NAMESPACE}" logs "deploy/${d}" --tail 200 2>/dev/null \
               | grep -qE "dry-run: would dispatch|worker consuming"; then
              echo "✓ ${d}: consumer heartbeat found"
              found=1
            fi
          done
          if [ "$found" != "1" ]; then
            echo "::warning::no 'worker consuming' / 'dry-run: would dispatch' line in worker logs yet — stream may just be quiet; check logs manually"
          fi

      - name: Dump pod state on failure
        if: failure()
        run: |
          kubectl -n "${NAMESPACE}" get pods -o wide 2>&1 || true
          kubectl -n "${NAMESPACE}" get events --sort-by=.lastTimestamp 2>&1 | tail -30 || true
          for d in $(kubectl -n "${NAMESPACE}" get deploy -o name 2>/dev/null); do
            echo "===== ${d} ====="
            kubectl -n "${NAMESPACE}" logs "$d" --all-containers --tail 200 2>&1 || true
          done

  # ── Smoke test — confirm the PUBLIC URL responds ────────────────────────
  smoke-test:
    needs: deploy
    runs-on: [self-hosted, Linux]
    timeout-minutes: 15
    env:
      HOST: ratel-dev.biyard.co
    steps:
      - name: Probe https://ratel-dev.biyard.co via public DNS
        # Full public path: wildcard *.biyard.co DNS → router 443 →
        # ingress-nginx → app-shell, with the REAL certificate (no -k).
        # Generous retry window because the very first deploy may still be
        # finishing DNS-01 certificate issuance.
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 24); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "https://${HOST}/" || echo "000")
            echo "attempt $i: / -> ${code}"
            if [ "$code" = "200" ]; then ok=1; break; fi
            sleep 20
          done
          if [ "$ok" != "1" ]; then
            echo "::error::https://${HOST} did not serve 200 within ~8 min"
            exit 1
          fi
          echo "✓ https://${HOST} is live"

  create-release-pr:
    runs-on: [self-hosted, Linux]
    if: github.ref == 'refs/heads/dev'
    needs: [deploy]
    steps:
      # v3 → v6: actionlint flags the node16-era checkout runner as too old.
      # Default-token checkout — the repo has no submodules (.gitmodules is
      # empty) and the old PULL_KEY_REPO deploy key no longer authenticates
      # (Permission denied, run 30897339573; same fix as pr-workflow).
      - uses: actions/checkout@v6
      - name: Git pr release action
        uses: grassedge/git-pr-release-action@v1.0
        with:
          base: main
          head: dev
          token: ${{ secrets.GITHUB_TOKEN }}
