name: PR Testing

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [dev]

# One run per PR. Without this a rapid second push leaves the first run alive,
# and both races to `kubectl delete/create namespace ratel-pr-<num>` — the
# newer run wipes the older one's stack mid-test, and whichever finishes last
# owns the leftover namespace.
concurrency:
  group: pr-testing-${{ github.event.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

env:
  CARGO_TERM_COLOR: always

jobs:
  contracts-test:
    runs-on: self-hosted

    defaults:
      run:
        working-directory: contracts

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: contracts/package-lock.json

      - name: Install dependencies
        run: |
          npm ci

      - name: Run contract tests
        run: |
          make test

  docs-build:
    runs-on: self-hosted

    defaults:
      run:
        working-directory: docs

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Docusaurus site (en + ko)
        env:
          ENV: dev
        run: npm run build

  # React frontend (apps/web) during the Dioxus → React migration
  # (docs/superpower/2026-09-14-react-frontend-migration.md). Builds without
  # Rust: the Tailwind input and legacy assets are read straight from
  # app/ratel. The parity scripts fail the job when the React build drifts
  # from the Dioxus app (missing Tailwind selectors, or a route/layout chain
  # that differs from app/ratel/src/route.rs).
  web-build:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -C apps/web typecheck

      - name: Build
        run: pnpm -C apps/web build

  # rust-check: plain cargo compile checks for app-shell. Renamed from
  # dx-check when the Dioxus UI build was dropped (app-shell is API-only
  # after the React frontend migration — docs/superpower/
  # 2026-09-14-react-frontend-migration.md § 5.1): no more dx/dioxus-cli, no
  # wasm32-unknown-unknown target, no GTK/webkit desktop deps. The i18n
  # drift check is gone too — the `translate!`/`Translate` sources it extracted
  # from were deleted, and the web i18n bundles (co-located `*.i18n.tsx` in
  # apps/web/src) are edited directly. gen-ts stays, since
  # packages/ts-bridges is still generated from the Rust route macros.
  rust-check:
    runs-on: self-hosted

    env:
      # rustup swaps components by staging them in $RUSTUP_HOME/tmp and
      # finishing with rename(2). The runner image ships a toolchain already,
      # and on these pods its directory sits on a different mount from the
      # default tmp, so `rustup toolchain install stable` — which replaces the
      # existing rust-std/cargo — dies with
      #   could not rename 'component' file ...: Invalid cross-device link (os error 18)
      # and rolls the whole install back.
      #
      # Pointing RUSTUP_HOME inside the workspace puts toolchains/ and tmp/ on
      # one filesystem, so the rename stays within a device. The cost is a
      # fresh toolchain download per run (~1 min); the cache above only holds
      # ~/.cargo/bin and target/, so nothing else changes. Rustup proxies in
      # CARGO_HOME read this variable, so cargo resolves the same toolchain.
      #
      # rust-check is the only self-hosted job that still calls
      # setup-rust-toolchain — the others build with the preinstalled
      # toolchain, which is why none of them hit this.
      # (github.workspace, not runner.temp — the `runner` context is not
      # available in a job-level env block.)
      RUSTUP_HOME: ${{ github.workspace }}/.rustup-dx-check

    defaults:
      run:
        working-directory: app/ratel

    steps:
      - uses: actions/checkout@v6

      - name: Restore cache
        id: dx-check-cache
        uses: actions/cache/restore@v5
        with:
          key: app-shell-build-${{ runner.os }}-rust-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            app-shell-build-${{ runner.os }}-rust-
          path: |
            ~/.cargo/bin
            target

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy, rustfmt
          toolchain: stable
          cache: false

      - uses: cargo-bins/cargo-binstall@main
      - name: Install system dependencies
        # build-essential + pkg-config + openssl headers for openssl-sys.
        # No GTK/webkit/xdo/appindicator/rsvg/lld here — those existed only
        # for the Dioxus desktop/wasm checks this job used to run.
        run: |
          SUDO=""; command -v sudo >/dev/null 2>&1 && SUDO="sudo"
          if command -v apt-get >/dev/null 2>&1; then
            $SUDO apt-get update -qq
            $SUDO apt-get install -y --no-install-recommends \
              build-essential \
              curl \
              wget \
              file \
              pkg-config \
              libssl-dev
          fi

      - name: cargo check --features server
        env:
          RUSTFLAGS: "-D warnings"
          DYNAMO_TABLE_PREFIX: ratel-dev
        run: |
          cargo check --features server

      - name: cargo check --no-default-features --features tauri-web
        env:
          RUSTFLAGS: "-D warnings"
          DYNAMO_TABLE_PREFIX: ratel-dev
        run: |
          cargo check --no-default-features --features tauri-web

      # React migration (docs/superpower/2026-09-14-react-frontend-migration.md):
      # the committed TypeScript API client (packages/ts-bridges) must match
      # what the Rust sources generate. Regenerate and fail on any diff.
      # `make gen-ts` renders the TS client with node (packages/ts-bridges/
      # scripts/gen-handlers.mjs). The cargo checks above no longer need it.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: gen-ts drift check
        env:
          DYNAMO_TABLE_PREFIX: ratel-dev
        run: |
          make gen-ts
          git diff --exit-code -- ../../packages/ts-bridges
          test -z "$(git status --porcelain -- ../../packages/ts-bridges)"

  # # ────────────────────────────────────────────────────────────────────────
  # # build-image: build the arm64 app-shell image ON the self-hosted runner
  # # and push it to the in-cluster registry as ratel-app-shell:pr-<num>.
  # #
  # # The runners are biyard org-level k8s pods on the home k3s cluster
  # # (kubectl + helm + buildctl preinstalled, BUILDKIT_HOST preset, NO docker
  # # CLI). Both cluster nodes are arm64, so a native `make build-testing`
  # # here already produces arm64 binaries — the buildkit step only packages
  # # the dx output (app/ratel/Dockerfile copies target/dx/app-shell/release/
  # # web) and pushes; no compile happens inside the Dockerfile.
  # #
  # # The compile-time env block is IDENTICAL to the ratel-app job above —
  # # DYNAMO_ENDPOINT=http://localstack:4566 etc. are baked into the binary,
  # # and stay valid in-cluster because deploy/pr-preview names its k8s
  # # Services after the docker-compose hostnames (localstack, qdrant).
  # #
  # # PR-only: the image tag needs github.event.number.
  # # ────────────────────────────────────────────────────────────────────────
  build-image:
    runs-on: self-hosted
    timeout-minutes: 90
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        # The self-hosted runner usually has a working stable toolchain. A
        # bare `rustup toolchain install stable` tries to UPDATE it, which
        # can fail with EXDEV on these runners (.rustup/toolchains and
        # .rustup/tmp on different mounts). Install only when genuinely
        # absent. No wasm target here — app-shell is API-only after the
        # React frontend migration (docs/superpower/
        # 2026-09-14-react-frontend-migration.md § 5.1).
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            if [ -x "$HOME/.cargo/bin/rustup" ]; then
              export PATH="$HOME/.cargo/bin:$PATH"
            else
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
              export PATH="$HOME/.cargo/bin:$PATH"
            fi
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
          rustup toolchain list | grep -q '^stable' || rustup toolchain install stable --profile minimal

      - name: Restore cargo registry/index (restore-only)
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          # Shared, job-agnostic key so future warm-cache jobs can share it.
          # Restore-only — this workflow never saves (cache-store hygiene,
          # same policy as asset's pr-workflow).
          key: ratel-cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ratel-cargo-${{ runner.os }}-

      - name: Restore build target (restore-only)
        uses: actions/cache/restore@v5
        with:
          path: target
          key: ratel-target-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ratel-target-${{ runner.os }}-

      - name: Install build deps (C toolchain, pkg-config, openssl headers)
        # The server build needs a linker + pkg-config + openssl dev
        # headers. Idempotent + multi-distro (asset pattern); a no-op once
        # the persistent runner image has them.
        run: |
          set -eu
          if command -v cc >/dev/null 2>&1 && command -v pkg-config >/dev/null 2>&1 && [ -f /usr/include/openssl/ssl.h ]; then
            echo "C toolchain + pkg-config + openssl headers already present"
            exit 0
          fi
          SUDO=""
          if command -v sudo >/dev/null 2>&1; then SUDO="sudo"; fi
          if command -v apt-get >/dev/null 2>&1; then
            $SUDO apt-get update -qq
            $SUDO apt-get install -y --no-install-recommends build-essential pkg-config libssl-dev
          elif command -v dnf >/dev/null 2>&1; then
            $SUDO dnf install -y gcc make pkgconf-pkg-config openssl-devel
          elif command -v apk >/dev/null 2>&1; then
            $SUDO apk add --no-cache build-base pkgconfig openssl-dev
          else
            echo "::warning::no known package manager; relying on preinstalled toolchain"
          fi

      - name: Build app-shell (native arm64 cargo build, API only)
        # `make build-testing` is a plain `cargo build --release` (bypass +
        # local-dev features; no dx/dioxus-cli, no wasm client) that leaves
        # the binary at target/server-image/server — see the "Fixed
        # contracts" section of docs/superpower/
        # 2026-09-14-react-frontend-migration.md § 5.1.
        env:
          # SAME compile-time env block as before — these bake into the
          # binary. The k8s Service names in deploy/pr-preview mirror the
          # compose hostnames, so the baked endpoints stay valid.
          DYNAMO_TABLE_PREFIX: ratel-local
          ENV: local
          RUSTFLAGS: "-D warnings"
          RUST_LOG: error
          DYNAMO_ENDPOINT: http://localstack:4566
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_REGION: ap-northeast-2
          AWS_ACCOUNT_ID: test
          COMMIT: pr-${{ github.event.number }}
        run: |
          cd app/ratel
          make build-testing

      - name: Push app-shell image to the in-cluster registry (buildkit)
        # Packages the release binary with app/ratel/Dockerfile via the
        # in-cluster buildkitd and pushes registry.infra.svc.cluster.local:5000/
        # ratel-app-shell:pr-<num> — the tag the e2e job deploys.
        env:
          NAME: ratel-app-shell
          CONTEXT: target/server-image
          DOCKERFILE: app/ratel/Dockerfile
          IMAGE_TAG: pr-${{ github.event.number }}
        run: bash scripts/buildkit-image.sh

  # ────────────────────────────────────────────────────────────────────────
  # build-web-image: build the React static site and push it as
  # ratel-web:pr-<num>. Split from build-image so this job's Node/pnpm setup
  # never touches the Rust cargo caches build-image restores — see the
  # "Fixed contracts" section of docs/superpower/
  # 2026-09-14-react-frontend-migration.md § 5.1/5.2 for the build recipe.
  # VITE_BYPASS=true because this preview's app-shell is built with the
  # bypass feature (make build-testing above).
  # ────────────────────────────────────────────────────────────────────────
  build-web-image:
    runs-on: self-hosted
    timeout-minutes: 30
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build web (React static site)
        env:
          VITE_BYPASS: "true"
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm -C apps/web build

      - name: Push web image to the in-cluster registry (buildkit)
        env:
          NAME: ratel-web
          CONTEXT: apps/web
          DOCKERFILE: apps/web/Dockerfile
          IMAGE_TAG: pr-${{ github.event.number }}
        run: bash scripts/buildkit-image.sh

  # ────────────────────────────────────────────────────────────────────────
  # e2e: PR-isolated Playwright run on the home k3s cluster — full rationale
  # in the file header. Deploy deploy/pr-preview/*.yaml (localstack +
  # localstack-init + qdrant + qdrant-init + app-shell + web + Ingress) into
  # namespace ratel-pr-<num>, wait for the stack, run the suite in a k8s pod
  # from the official Playwright image (kubectl cp in / exec / cp out — the
  # runner pods have no docker CLI and no browser OS deps), publish the HTML
  # report to the pr-webroot, then TEAR THE NAMESPACE DOWN — per project
  # policy the preview exists only for the duration of the test run (unlike
  # asset, which keeps it for the PR's lifetime). Only the report webroot
  # (ratel-report-<num>.pr.biyard.co) outlives the run;
  # pr-preview-cleanup.yml removes it on PR close and catches namespaces
  # left behind by cancelled/crashed runs.
  #
  # NON-BLOCKING (`continue-on-error: true`) while the new infra path
  # stabilizes; promote to a required check once green history backs it.
  # pull_request-only — PR_NUM comes from github.event.number.
  # ────────────────────────────────────────────────────────────────────────
  e2e:
    runs-on: self-hosted
    timeout-minutes: 90
    continue-on-error: true # non-blocking introduction — see job comment above
    if: github.event_name == 'pull_request'
    needs: [build-image, build-web-image]
    env:
      # PR number threads through everything: the namespace, the ingress
      # host, the report webroot dir, and the image tag build-image pushed.
      PR_NUM: "${{ github.event.number }}"
      NS: "ratel-pr-${{ github.event.number }}"
      HOST: "ratel-${{ github.event.number }}.pr.biyard.co"

    steps:
      - uses: actions/checkout@v6

      - name: Recreate the per-PR namespace (clean state)
        # Every run starts EMPTY: deleting the previous namespace first
        # guarantees this run's pods pull the freshly pushed :pr-<num>
        # image and that no state (tables, seeds, qdrant collections)
        # leaks between runs. The preview is fully namespace-contained —
        # no shared db to reset (unlike asset).
        run: |
          set -euo pipefail
          kubectl delete namespace "${NS}" --ignore-not-found --wait --timeout=180s || true
          kubectl create namespace "${NS}"

      - name: Create the init-script ConfigMaps
        # The localstack-init / qdrant-init Jobs run the SAME scripts the
        # docker-compose testing profile mounts; here they're delivered as
        # ConfigMaps built from the repo files (≈60 KB total — far under the
        # 1 MB ConfigMap limit).
        run: |
          set -euo pipefail
          kubectl -n "${NS}" create configmap pr-preview-scripts \
            --from-file=scripts/localstack-init-entrypoint.sh \
            --from-file=scripts/dynamodb-schema.json \
            --from-file=scripts/qdrant-init-entrypoint.sh \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n "${NS}" create configmap pr-preview-dynamodb-data \
            --from-file=scripts/dynamodb-data/ \
            --dry-run=client -o yaml | kubectl apply -f -
          # Postgres migration: the postgres-seed Job loads the same Playwright
          # fixtures into Postgres (data-only SQL generated from the
          # scripts/dynamodb-data/*.json seed, as Postgres rows).
          kubectl -n "${NS}" create configmap pr-preview-postgres-seed \
            --from-file=scripts/postgres-seed.sql \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy the preview stack (envsubst → kubectl apply)
        # Plain YAML with ${PR_NUM} placeholders — no helm chart exists in
        # ratel, and the stack is 4 workloads; envsubst keeps it inspectable.
        # The substitution list is restricted to ${PR_NUM} so nothing else
        # in the manifests can be clobbered by runner env. sed fallback in
        # case the runner image lacks gettext's envsubst.
        run: |
          set -euo pipefail
          subst() {
            if command -v envsubst >/dev/null 2>&1; then
              envsubst '${PR_NUM}'
            else
              sed "s|\${PR_NUM}|${PR_NUM}|g"
            fi
          }
          for f in deploy/pr-preview/*.yaml; do
            echo "---"
            subst < "$f"
          done | kubectl apply -f -

      - name: Wait for the stack to answer through ingress-nginx
        # Ordered waits so a failure names its culprit: init Jobs first
        # (table + seeds + qdrant collection), then rollouts (app-shell's
        # initContainer gates on the table, so its rollout implies the init
        # chain — the generic `get deploy` loop also covers the new `web`
        # Deployment), then prove BOTH backends through the ingress split
        # (docs/superpower/2026-09-14-react-frontend-migration.md § 5.1):
        # "/" now answers from `web`, not app-shell (API-only). The PR host
        # rides the ingress default certificate, hence -k; --resolve pins the
        # public name to the controller's ClusterIP (no DNS round-trip, no
        # hairpin dependency). /launchpad/health only accepts POST with a
        # signed body (see the readinessProbe comment on
        # deploy/pr-preview/30-app-shell.yaml), so a plain GET is expected to
        # answer 404/405 — anything other than a connection failure or a 5xx
        # proves the ingress → app-shell route itself works.
        run: |
          set -euo pipefail
          kubectl -n "${NS}" wait --for=condition=complete job/localstack-init --timeout=420s
          kubectl -n "${NS}" wait --for=condition=complete job/qdrant-init --timeout=300s
          for d in $(kubectl -n "${NS}" get deploy -o name); do
            echo "── rollout ${d}"
            kubectl -n "${NS}" rollout status "$d" --timeout=420s
          done
          # Postgres migration: the seed Job's initContainer blocks until
          # app-shell has migrated the schema, then loads the fixtures — wait
          # for it here so Playwright never races an unseeded database.
          kubectl -n "${NS}" wait --for=condition=complete job/postgres-seed --timeout=300s
          INGRESS_IP=$(kubectl -n infra get svc ingress-nginx-controller -o jsonpath='{.spec.clusterIP}')
          [ -n "$INGRESS_IP" ] || { echo "::error::ingress-nginx-controller service not found"; exit 1; }
          base="https://${HOST}"
          deadline=$(( $(date +%s) + 180 ))
          echo "waiting for ${base}/ (web, ingress=${INGRESS_IP}) ..."
          until curl -sfk --resolve "${HOST}:443:${INGRESS_IP}" -o /dev/null "${base}/"; do
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::web did not answer within 180s after rollout"
              kubectl -n "${NS}" get pods -o wide || true
              exit 1
            fi
            sleep 10
          done
          echo "✓ ingress serves web at ${base}/"

          deadline=$(( $(date +%s) + 120 ))
          echo "waiting for ${base}/launchpad/health (app-shell, ingress=${INGRESS_IP}) ..."
          until code=$(curl -sk --resolve "${HOST}:443:${INGRESS_IP}" -o /dev/null -w '%{http_code}' "${base}/launchpad/health"); \
                [ "$code" != "000" ] && [ "$code" -lt 500 ]; do
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::app-shell did not answer within 120s (last code: ${code:-000})"
              kubectl -n "${NS}" get pods -o wide || true
              exit 1
            fi
            sleep 10
          done
          echo "✓ ingress serves app-shell at ${base}/launchpad/health (http ${code})"

      - name: Run Playwright (k8s pod — official image; runners have no browser deps)
        # The official Playwright image ships chromium + every OS dep for
        # the version pinned in playwright/package-lock.json (1.58.2). The
        # runner cannot bind-mount into a pod, so mirror the old docker-cp
        # flow with kubectl cp: create the pod idle, copy the playwright/
        # tree in, exec the suite, copy report/results back out.
        # E2E_HOST_RESOLVER_RULES pins the PR host to the ingress ClusterIP
        # inside chromium (and playwright.config.js flips ignoreHTTPSErrors
        # on it — the PR host serves the ingress default cert). CI=true +
        # PLAYWRIGHT_TIMEOUT reproduce the old job's retry/worker/timeout
        # config inside the pod.
        run: |
          set -euo pipefail
          INGRESS_IP=$(kubectl -n infra get svc ingress-nginx-controller -o jsonpath='{.spec.clusterIP}')
          [ -n "$INGRESS_IP" ] || { echo "::error::ingress-nginx-controller service not found"; exit 1; }
          pod="playwright"
          kubectl -n "${NS}" delete pod "${pod}" --ignore-not-found --wait=true
          kubectl -n "${NS}" run "${pod}" \
            --image=mcr.microsoft.com/playwright:v1.58.2-noble \
            --restart=Never \
            --env=CI=true \
            --env=PLAYWRIGHT_BASE_URL="https://${HOST}" \
            --env=PLAYWRIGHT_TIMEOUT=60000 \
            --env=E2E_HOST_RESOLVER_RULES="MAP ${HOST} ${INGRESS_IP}" \
            --overrides='{"spec":{"nodeSelector":{"biyard.io/node-class":"main"}}}' \
            --command -- sleep 7200
          kubectl -n "${NS}" wait --for=condition=Ready "pod/${pod}" --timeout=300s
          kubectl -n "${NS}" cp playwright "${pod}:/playwright"
          set +e
          kubectl -n "${NS}" exec "${pod}" -- sh -c 'cd /playwright && npm ci && npx playwright test tests/web'
          ec=$?
          set -e
          kubectl -n "${NS}" cp "${pod}:/playwright/playwright-report" playwright/playwright-report 2>/dev/null || true
          kubectl -n "${NS}" cp "${pod}:/playwright/test-results" playwright/test-results 2>/dev/null || true
          kubectl -n "${NS}" delete pod "${pod}" --wait=false || true
          exit "$ec"

      - name: Dump pod logs (k3s namespace ratel-pr-${{ github.event.number }})
        if: always()
        # Printed INTO THE JOB LOG rather than uploaded: the log is retained
        # with the run at no artifact-storage cost, and the namespace is
        # gone right after this — these lines are the only place the
        # server-side story of a failed run survives.
        run: |
          kubectl -n "${NS}" get pods -o wide 2>&1 || true
          for d in $(kubectl -n "${NS}" get deploy -o name 2>/dev/null); do
            echo "===== ${d} ====="
            kubectl -n "${NS}" logs "$d" --all-containers --tail 400 2>&1 || true
          done
          for j in $(kubectl -n "${NS}" get jobs -o name 2>/dev/null); do
            echo "===== ${j} ====="
            kubectl -n "${NS}" logs "$j" --tail 200 2>&1 || true
          done

      # NOTE: the Playwright report + traces are NOT uploaded as an
      # artifact. The self-contained HTML report is published to the
      # pr-webroot below and stays reachable at
      # ratel-report-<num>.pr.biyard.co until the PR closes (linked from
      # the sticky comment) — an artifact copy would duplicate 100+ MB per
      # run for no extra reviewer value.

      - name: Publish the Playwright report to the pr-webroot
        if: always()
        # The runner pods mount the cluster's `pr-webroot` PVC at
        # /root/nginx — the same volume the infra pr-nginx serves
        # `*.pr.biyard.co` from. `if: always()` — a failing run is exactly
        # when the report matters most. Falls back to a placeholder if none
        # was produced.
        run: |
          set -uo pipefail
          test -d /root/nginx || {
            echo "::error::/root/nginx (pr-webroot mount) is missing on this runner"
            exit 1
          }
          dest="/root/nginx/ratel-report-${PR_NUM}"
          rm -rf "${dest}"
          mkdir -p "${dest}"
          if [ -d playwright/playwright-report ] && [ -n "$(ls -A playwright/playwright-report 2>/dev/null)" ]; then
            cp -a playwright/playwright-report/. "${dest}/"
          else
            echo "<!doctype html><title>no report</title><h1>No Playwright report produced</h1>" > "${dest}/index.html"
          fi

      # The preview namespace (ratel-pr-<num>) and its exact-host Ingress
      # normally stay RUNNING so the preview URL in the sticky comment keeps
      # working for the PR's lifetime (asset pattern) — pr-preview-cleanup.yml
      # tears them down on close. The one case that leaked is a run that
      # OUTLIVES its own PR: the merge fires cleanup while this run is still
      # queued, then "Recreate the per-PR namespace" above creates a namespace
      # nothing will ever delete. Resolve the PR's state once here; the two
      # steps below (comment, teardown) both key off it so they cannot
      # disagree — the old ordering had the comment re-advertising a preview
      # that had just been deleted.
      - name: Is this PR still open?
        id: prstate
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        # `always()` so this also runs when the job is cancelled (the
        # `concurrency` group cancels superseded runs, and a cancelled run
        # would otherwise strand the namespace it just created).
        # Emits exactly one of: open | closed | unknown. "unknown" (API error,
        # rate limit, fork token) is the fail-safe bucket — treated as open.
        run: |
          set -uo pipefail
          state=$(curl -sf \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pulls/${PR_NUM}" \
            2>/dev/null | jq -r '.state // empty' 2>/dev/null || true)
          case "${state}" in
            open|closed) ;;
            *)
              echo "::warning::could not read PR #${PR_NUM} state — assuming open, pr-preview-sweeper will reconcile"
              state=unknown
              ;;
          esac
          echo "state=${state}" >> "${GITHUB_OUTPUT}"
          echo "PR #${PR_NUM} state: ${state}"

      - name: Sticky PR comment with the preview + report URLs
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_STATE: ${{ steps.prstate.outputs.state }}
        # Update ONE marker-tagged comment in place (no per-run spam). The
        # runner image has no `gh`, so use curl + jq (both present) against
        # the REST API. Comment failures (e.g. a fork PR's read-only token)
        # are non-fatal.
        run: |
          set -uo pipefail
          marker="<!-- e2e-preview -->"
          repo="${{ github.repository }}"
          api="https://api.github.com"
          app="https://ratel-${PR_NUM}.pr.biyard.co"
          report="https://ratel-report-${PR_NUM}.pr.biyard.co"
          run_url="https://github.com/${repo}/actions/runs/${{ github.run_id }}"
          if [ "${PR_STATE:-unknown}" = "closed" ]; then
            # This run outlived its PR — the teardown step below deletes both,
            # so do not re-advertise dead links (pr-preview-cleanup already
            # posted the torn-down text; this run must not undo it).
            body="$(printf '%s\n### 🔎 PR preview (k3s e2e)\n\n🧹 This PR closed while [run](%s) was still in flight — the preview namespace `ratel-pr-%s` and the report have been torn down.\n' \
              "$marker" "$run_url" "$PR_NUM")"
          else
            body="$(printf '%s\n### 🔎 PR preview (k3s e2e)\n\n- **App preview:** %s\n- **Playwright report:** %s\n\n<sub>updated by [run](%s) · namespace `ratel-pr-%s` and the report stay up until this PR closes</sub>\n' \
              "$marker" "$app" "$report" "$run_url" "$PR_NUM")"
          fi
          payload=$(jq -nc --arg b "$body" '{body:$b}')
          auth="Authorization: Bearer ${GITHUB_TOKEN}"
          acc="Accept: application/vnd.github+json"
          existing=$(curl -sf -H "$auth" -H "$acc" \
            "${api}/repos/${repo}/issues/${PR_NUM}/comments?per_page=100" 2>/dev/null \
            | jq -r --arg m "$marker" 'map(select(.body | startswith($m))) | .[0].id // empty' 2>/dev/null || true)
          if [ -n "${existing}" ]; then
            curl -sf -X PATCH -H "$auth" -H "$acc" \
              "${api}/repos/${repo}/issues/comments/${existing}" -d "$payload" >/dev/null \
              && echo "updated comment ${existing}" || echo "::warning::sticky comment update failed (non-fatal)"
          else
            curl -sf -X POST -H "$auth" -H "$acc" \
              "${api}/repos/${repo}/issues/${PR_NUM}/comments" -d "$payload" >/dev/null \
              && echo "created sticky comment" || echo "::warning::sticky comment create failed (non-fatal)"
          fi

      # LAST step in the job on purpose: everything above still needs the
      # namespace (report copy-out, pod logs), and the sticky comment above has
      # already been switched to its torn-down wording for this case.
      - name: Tear down the preview if this run outlived its PR
        if: always() && steps.prstate.outputs.state == 'closed'
        run: |
          set -uo pipefail
          echo "::warning::PR #${PR_NUM} closed while this run was in flight — tearing ${NS} down"
          kubectl delete namespace "${NS}" --ignore-not-found --wait=false || true
          rm -rf "/root/nginx/ratel-report-${PR_NUM}" || true
