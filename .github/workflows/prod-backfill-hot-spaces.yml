# ============================================================================
# PROD 백필 (수동 버튼): 인기 스페이스(hot_spaces) 시딩
# ----------------------------------------------------------------------------
# GitHub Actions → 이 워크플로우 → "Run workflow" 버튼으로 실행.
#   direction=up   : scripts/migrations/2026-09-10-hot-spaces-backfill/up.sql
#   direction=down : .../down.sql 로 롤백
# 실수 방지: confirm 입력에 정확히 "MIGRATE" 를 타이핑해야 실행된다.
#
# 왜 필요한가:
#   `hot_spaces` 는 파생 캐시라 DynamoDB→Postgres ETL 대상에서 제외됐는데
#   (etl_migrate.rs 의 ID_REF_FIELDS 주석 참고), 재생성 트리거가 없어 빈 채로
#   남았다. `upsert_hot_space` 는 스페이스가 변경될 때만 도는데 자격을 갖춘 4개
#   스페이스는 전환 이후 조용했다. 그래서 /api/hot-spaces 가 prod·dev 모두
#   {"items":[]} 를 반환한다. 이 백필은 그 4행을 한 번 채워 넣는 일회성 복구다.
#   이후로는 참여자 증감(PopularSpaceUpdate) · 액션 · XP 기록 등이 자동으로
#   갱신하므로 다시 돌릴 일은 없다.
#
# 실행 위치: self-hosted 러너(=in-cluster kubectl 자격 보유, prod-workflow.yml
# deploy 잡과 동일). 러너가 ratel-prod 네임스페이스에 일회용 psql 파드를 띄워
# 클러스터 내부 Postgres 로 SQL 을 흘려보낸다.
#
# SQL 은 트랜잭션(BEGIN/COMMIT) + 멱등(space_id UPSERT)이라 재실행/롤백 안전.
# 사전 검증: dev-victor 의 prod fork(pgfork)에서 up→down→up→up 왕복 완료.
#   4행 → 0행 → 4행 → 4행, ORDER BY rank_key ASC 가 참여자순(143/53/31/26)
#   으로 나오는 것까지 로컬 UI 로 확인.
# ============================================================================
name: "PROD backfill · 인기 스페이스"

on:
  workflow_dispatch:
    inputs:
      direction:
        description: "up = 적용 / down = 롤백"
        required: true
        type: choice
        default: "up"
        options:
          - "up"
          - "down"
      confirm:
        description: '실행하려면 정확히 "MIGRATE" 입력'
        required: true
        type: string

jobs:
  backfill:
    runs-on: self-hosted
    timeout-minutes: 15
    # prod DB 쓰기는 한 번에 하나만. 새 실행은 진행 중인 것 뒤에 대기(취소 아님).
    concurrency:
      group: ratel-prod-backfill-hot-spaces
      cancel-in-progress: false
    env:
      NAMESPACE: ratel-prod
      # 클러스터 내부 Postgres. 값의 원천은 deploy/prod/10-app-shell.yaml 의
      # DATABASE_URL (app-shell 이 실제로 쓰는 것과 동일). 변경 시 함께 갱신.
      DATABASE_URL: postgres://ratel:ratel@postgres.infra.svc.cluster.local:5432/ratel
      MIGRATION_DIR: scripts/migrations/2026-09-10-hot-spaces-backfill
    steps:
      - uses: actions/checkout@v6

      - name: Guard — confirm 입력 검증
        run: |
          set -euo pipefail
          if [ "${{ github.event.inputs.confirm }}" != "MIGRATE" ]; then
            echo "::error::confirm 입력이 'MIGRATE' 가 아닙니다. 실행을 중단합니다."
            exit 1
          fi
          echo "direction = ${{ github.event.inputs.direction }}"

      - name: Verify cluster access
        # 러너 파드는 in-cluster kubectl 자격을 갖는다(prod deploy 잡과 동일).
        run: |
          set -euo pipefail
          kubectl get ns "${NAMESPACE}" >/dev/null || {
            echo "::error::러너에 클러스터 접근 권한이 없음 — k3s 러너 파드가 맞는지 확인"
            exit 1
          }

      - name: Pick SQL file
        id: pick
        run: |
          set -euo pipefail
          dir="${{ github.event.inputs.direction }}"
          case "$dir" in
            up)   f="${MIGRATION_DIR}/up.sql" ;;
            down) f="${MIGRATION_DIR}/down.sql" ;;
            *)    echo "::error::unknown direction '$dir'"; exit 1 ;;
          esac
          test -f "$f" || { echo "::error::SQL 파일 없음: $f"; exit 1; }
          echo "sql_file=$f" >> "$GITHUB_OUTPUT"
          echo "적용할 파일: $f"

      - name: Run migration (throwaway psql pod → in-cluster Postgres)
        run: |
          set -euo pipefail
          pod="ratel-hotspace-$(date +%s)"
          echo "── ${pod} 파드로 ${{ steps.pick.outputs.sql_file }} 실행"
          kubectl run "${pod}" \
            -n "${NAMESPACE}" \
            --rm -i --restart=Never \
            --image=postgres:16-alpine \
            --command -- \
            psql "${DATABASE_URL}" -v ON_ERROR_STOP=1 -f - \
            < "${{ steps.pick.outputs.sql_file }}"

      - name: Verify — hot_spaces 내용 확인
        # 눈으로 확인할 수 있게 결과를 찍는다. up 이면 4행이 참여자 많은 순,
        # down 이면 0행이어야 한다. 읽기 전용이라 실패해도 데이터에 영향 없음.
        run: |
          set -euo pipefail
          pod="ratel-hotspace-check-$(date +%s)"
          kubectl run "${pod}" \
            -n "${NAMESPACE}" \
            --rm -i --restart=Never \
            --image=postgres:16-alpine \
            --command -- \
            psql "${DATABASE_URL}" -v ON_ERROR_STOP=1 -c \
            "SELECT row_number() OVER (ORDER BY rank_key ASC) AS rank,
                    participants, total_actions, heat, left(title, 30) AS title
               FROM hot_spaces
              ORDER BY rank_key ASC"

      - name: Done
        run: |
          echo "✅ ${{ github.event.inputs.direction }} 완료"
          echo "확인: https://ratel.foundation/api/hot-spaces 및 홈의 '인기 스페이스' 탭"
