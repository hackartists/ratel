name: iOS release (TestFlight)

# Builds a signed .ipa from `main` and uploads it to TestFlight.
#
# MANUAL ONLY, and deliberately split out of prod-workflow.yml. Android ships
# on every merge to main because it builds on our own runners for free; iOS
# cannot — Xcode is macOS-only, so this job needs a GitHub-hosted `macos-15`
# runner, which bills at 10x the normal minute rate. At ~35 min a build and
# ~15 prod deploys a month that would be ~5,250 billed minutes against a
# 3,000-minute allowance, which is exactly how CI got blocked on 2026-08-10.
#
# Running it on demand instead costs ~350 minutes per release. That matches how
# the App Store actually works: review takes days, so there is no value in a
# TestFlight build per server deploy.
#
# The build number is `date +%s` (see app/ratel-tauri/Makefile), so repeated
# runs never collide on App Store Connect. Bump the marketing version in
# app/ratel-tauri/src-tauri/tauri.conf.json when you ship a new one.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type RELEASE to confirm a TestFlight upload"
        type: string
        required: true

jobs:
  # Gate the expensive job behind a free one: `ios-release` needs this to pass,
  # so a mistyped confirmation never spins up the 10x-billed macOS runner.
  guard:
    runs-on: self-hosted
    steps:
      - name: Require typed confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "RELEASE" ]; then
            echo "::error::confirm must be exactly RELEASE (got '${{ inputs.confirm }}')"
            exit 1
          fi

  ios-release:
    needs: guard
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          # Always ship what is on `main`, never the branch the button was
          # pressed from — a TestFlight build must match what prod serves.
          ref: main
          # `PULL_KEY_REPO_V2` — see the note on android-release in
          # prod-workflow.yml. The old `PULL_KEY_REPO` no longer authenticates.
          submodules: recursive
          ssh-key: ${{ secrets.PULL_KEY_REPO_V2 }}

      # Apple now requires the iOS 26 SDK (Xcode 26+) for App Store uploads.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode / SDK
        run: xcodebuild -version && xcodebuild -showsdks | grep -i ios

      - name: Restore cache
        uses: actions/cache/restore@v5
        with:
          key: ios-release-${{ runner.os }}-rust-ios18-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ios-release-${{ runner.os }}-rust-ios18-
          path: |
            ~/.cargo/bin
            target
            app/ratel-tauri/dx-tauri-target

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: wasm32-unknown-unknown,aarch64-apple-ios
          cache: false

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: cargo-bins/cargo-binstall@main

      - name: Install dioxus-cli + tauri-cli + xcodegen
        env:
          # Authenticated GitHub API: avoids the 403 rate-limit on binstall's
          # release-artifact lookup so it downloads the prebuilt dx/cargo-tauri
          # binaries (fast) instead of falling back to a slow source build.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # `command -v … ||` skips reinstall when the cache restored the binary
          # into ~/.cargo/bin — otherwise binstall's source fallback aborts with
          # "binary `dx` already exists in destination".
          command -v dx >/dev/null || cargo binstall -y --locked dioxus-cli
          command -v cargo-tauri >/dev/null || cargo binstall -y --locked --version "^2.0.0" tauri-cli
          # `make gen-xcodeproj` regenerates the pbxproj from project.yml.
          command -v xcodegen >/dev/null || brew install xcodegen

      - name: Ensure openssl@3 dylib for prebuilt dx
        run: |
          # The prebuilt `dx` from cargo-binstall is dynamically linked against
          # `/usr/local/opt/openssl@3/lib/libssl.3.dylib`. On the macos-15
          # (Apple Silicon) runner Homebrew lives at `/opt/homebrew`, and a
          # runner-image update left no openssl under `/usr/local`, so `dx`
          # aborts at launch with `dyld: Library not loaded` (Abort trap: 6)
          # before it can build. Install openssl@3 and symlink it to the exact
          # path the binary hard-codes. (libssl 3.x is ABI-stable, so the
          # current 3.x satisfies the `libssl.3.dylib` soname.)
          brew install openssl@3 || brew upgrade openssl@3 || true
          PREFIX="$(brew --prefix openssl@3)"
          sudo mkdir -p /usr/local/opt
          sudo ln -sfn "$PREFIX" /usr/local/opt/openssl@3
          test -f /usr/local/opt/openssl@3/lib/libssl.3.dylib
          # If the prebuilt `dx` still can't launch (e.g. it's x86_64 and the
          # symlinked openssl is arm64, an arch mismatch), rebuild dioxus-cli
          # from source so it links against THIS host's openssl. Slower, but
          # only runs when the fast path fails.
          if ! dx --version >/dev/null 2>&1; then
            echo "prebuilt dx failed to launch — rebuilding dioxus-cli from source"
            cargo install --locked --force dioxus-cli
          fi
          # Fail fast here (not 200 lines into the build) if dx still can't run.
          dx --version

      - name: Import signing certificate & provisioning profile
        env:
          IOS_DIST_CERT_BASE64: ${{ secrets.IOS_DIST_CERT_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/dist_cert.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"

          echo "$IOS_DIST_CERT_BASE64" | base64 --decode > "$CERT_PATH"

          # Throwaway keychain, added to the search list so xcodebuild sees the cert.
          security create-keychain -p "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$IOS_DIST_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db

          mkdir -p "$PROFILES_DIR"
          echo "$IOS_PROVISION_PROFILE_BASE64" | base64 --decode > "$PROFILES_DIR/ci-appstore.mobileprovision"

      - name: Write App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$ASC_API_KEY_BASE64" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"

      # GoogleService-Info.plist is gitignored (Firebase client config), absent
      # on a clean checkout. `make testflight` → `gsi-copy` bundles it for
      # [FIRApp configure] (FCM push), so decode it from a secret first.
      - name: Write GoogleService-Info.plist (iOS Firebase client config)
        working-directory: app/ratel-tauri
        env:
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICE_INFO_PLIST_BASE64" ]; then
            echo "::error::GOOGLE_SERVICE_INFO_PLIST_BASE64 secret not set — iOS build needs GoogleService-Info.plist (gitignored). Add it in Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "$GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 --decode > GoogleService-Info.plist
          echo "Wrote GoogleService-Info.plist ($(wc -c < GoogleService-Info.plist) bytes)"

      - name: Build & upload to TestFlight (prod)
        working-directory: app/ratel-tauri
        env:
          ENV: prod
          MOBILE_API_URL: https://ratel.foundation
          DYNAMO_TABLE_PREFIX: ratel-prod
          RUSTFLAGS: "-D warnings"
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          PORTONE_STORE_ID: ${{ secrets.PORTONE_STORE_ID }}
          PORTONE_INICIS_CHANNEL_KEY: ${{ secrets.PROD_PORTONE_INICIS_CHANNEL_KEY }}
          PORTONE_KPN_CHANNEL_KEY: ${{ secrets.PORTONE_KPN_BILLING_KEY_CHANNEL_KEY }}
          PORTONE_API_SECRET: ${{ secrets.PORTONE_API_SECRET }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MEASUREMENT_ID: ${{ secrets.FIREBASE_MEASUREMENT_ID }}
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_REGION: ap-northeast-2
          AWS_ACCOUNT_ID: test
        run: |
          make testflight \
            APPLE_DEVELOPMENT_TEAM=7P4Z67D4N7 \
            ASC_KEY_ID=${{ secrets.ASC_KEY_ID }} \
            ASC_ISSUER_ID=${{ secrets.ASC_ISSUER_ID }}

      - name: Save cache
        if: always()
        uses: actions/cache/save@v5
        with:
          key: ios-release-${{ runner.os }}-rust-ios18-${{ hashFiles('**/Cargo.lock') }}
          path: |
            ~/.cargo/bin
            target
            app/ratel-tauri/dx-tauri-target
