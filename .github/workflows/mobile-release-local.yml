name: Mobile release (local Mac runner)

# The same store release as mobile-release.yml — Android AAB → Play internal
# track, iOS .ipa → TestFlight, both built from `main` — run on a developer's
# Apple Silicon Mac registered as a temporary self-hosted runner instead of on
# GitHub-hosted runners. Use it when GitHub-hosted minutes are unavailable
# (the org's Actions budget stops them once it is spent) and a build has to go
# out anyway. Self-hosted minutes are not billed.
#
#   scripts/mobile-release-runner.sh up        # register this Mac (2 runners)
#   gh workflow run mobile-release-local.yml --repo biyard/ratel \
#     -f platform=both -f confirm=RELEASE
#   scripts/mobile-release-runner.sh down      # unregister and delete them
#
# The runners carry only the `ratel-mac` label (no default `self-hosted`
# label), so the deploy workflows that ask for `self-hosted` never land on the
# Mac. Two runners let the Android and iOS jobs build at the same time.
#
# Differences from mobile-release.yml, all because the machine is someone's
# own Mac rather than a throwaway VM:
#   - No actions/cache and no global Xcode switch (setup-xcode needs sudo): the
#     job picks the newest installed Xcode 26+ through DEVELOPER_DIR.
#   - Rust targets, tauri-cli and xcodegen come from the Mac's own toolchains.
#   - The signing keychain is added to the keychain search list only when the
#     Mac does not already hold the same distribution identity, and the
#     search list, keychain, provisioning profile, App Store Connect key and
#     secret files written into the workspace are removed when the job ends.
#   - The Android version code does not come from this file's run number (it
#     starts at 1, below what Play already has); see "Pick Android version".

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Which app(s) to ship"
        type: choice
        required: true
        default: both
        options: [both, android, ios]
      confirm:
        description: "Type RELEASE to confirm a store upload"
        type: string
        required: true
      android_version_code:
        description: "Android versionCode override (blank = pick automatically)"
        type: string
        required: false
        default: ""

permissions:
  contents: read
  actions: read

# One release at a time: both jobs share the Mac's keychain and profile folder.
concurrency:
  group: mobile-release-local
  cancel-in-progress: false

jobs:
  guard:
    runs-on: self-hosted
    steps:
      - name: Require typed confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "RELEASE" ]; then
            echo "::error::confirm must be exactly RELEASE (got '${{ inputs.confirm }}')"
            exit 1
          fi
          echo "shipping: ${{ inputs.platform }}"

  android-release:
    if: inputs.platform == 'both' || inputs.platform == 'android'
    needs: guard
    runs-on: ratel-mac
    timeout-minutes: 90
    env:
      CARGO_NET_RETRY: "10"
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      CARGO_HTTP_MULTIPLEXING: "false"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          submodules: recursive
          ssh-key: ${{ secrets.PULL_KEY_REPO_V2 }}

      - name: Use the Mac's Homebrew and cargo tools
        run: |
          for dir in /opt/homebrew/bin "$HOME/.cargo/bin"; do
            if [ -d "$dir" ]; then echo "$dir" >> "$GITHUB_PATH"; fi
          done

      - name: Pick Android version
        # mobile-release.yml ships versionCode 1200 + its run number. This file
        # has its own run counter, so reuse the number of the latest
        # mobile-release.yml run — only when that run never uploaded to Play
        # (e.g. it was stopped by billing) and no earlier local run already
        # shipped it. Otherwise pass android_version_code explicitly.
        env:
          GH_TOKEN: ${{ github.token }}
          OVERRIDE: ${{ inputs.android_version_code }}
        run: |
          node --input-type=module <<'EOF'
          import { appendFileSync } from "node:fs";

          const { GITHUB_API_URL, GITHUB_REPOSITORY, GITHUB_RUN_ID, GITHUB_ENV, GH_TOKEN, OVERRIDE } = process.env;
          const UPLOAD_STEP = "Upload to Google Play (internal track)";

          async function api(path) {
            const res = await fetch(`${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}${path}`, {
              headers: { authorization: `Bearer ${GH_TOKEN}`, accept: "application/vnd.github+json" },
            });
            if (!res.ok) throw Object.assign(new Error(`GET ${path}: HTTP ${res.status}`), { status: res.status });
            return res.json();
          }

          async function uploadedToPlay(runId) {
            const { jobs } = await api(`/actions/runs/${runId}/jobs?per_page=100`);
            const android = jobs.find((job) => job.name === "android-release");
            return Boolean(android?.steps?.some((step) => step.name === UPLOAD_STEP && step.conclusion === "success"));
          }

          function fail(message) {
            console.log(`::error::${message}`);
            process.exit(1);
          }

          let code;
          if (OVERRIDE) {
            code = Number(OVERRIDE);
            if (!Number.isInteger(code) || code <= 1200) fail(`android_version_code must be an integer above 1200 (got '${OVERRIDE}')`);
          } else {
            const { workflow_runs: [latest] } = await api("/actions/workflows/mobile-release.yml/runs?per_page=1");
            if (!latest) fail("no mobile-release.yml run to take a version number from; pass android_version_code");
            code = 1200 + latest.run_number;
            if (await uploadedToPlay(latest.id)) {
              fail(`mobile-release.yml run #${latest.run_number} already uploaded versionCode ${code}; pass android_version_code`);
            }
            const since = encodeURIComponent(`>=${latest.created_at}`);
            // 404 until this workflow file exists on the default branch.
            const localRuns = await api(`/actions/workflows/mobile-release-local.yml/runs?per_page=50&created=${since}`)
              .then((body) => body.workflow_runs)
              .catch((err) => {
                if (err.status === 404) return [];
                throw err;
              });
            for (const run of localRuns) {
              if (String(run.id) !== GITHUB_RUN_ID && (await uploadedToPlay(run.id))) {
                fail(`local run #${run.run_number} already shipped versionCode ${code}; pass android_version_code`);
              }
            }
          }

          const name = `1.0.${code - 1000}`;
          appendFileSync(GITHUB_ENV, `ANDROID_VERSION_CODE=${code}\nANDROID_VERSION_NAME=${name}\n`);
          console.log(`versionCode=${code} versionName=${name}`);
          EOF

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0 ndk;29.0.14206865"

      - name: Rust targets + tauri-cli
        run: |
          rustup target add wasm32-unknown-unknown aarch64-linux-android
          command -v cargo-tauri >/dev/null || cargo install --locked tauri-cli --version "^2.0.0"

      - name: Enable corepack + install pnpm workspace deps
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Write upload keystore + signing config
        working-directory: app/ratel-tauri/src-tauri/gen/android
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > upload-keystore.jks
          cat > keystore.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_ALIAS_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=$(pwd)/upload-keystore.jks
          EOF

      - name: Write google-services.json (Android Firebase client config)
        working-directory: app/ratel-tauri
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "::error::GOOGLE_SERVICES_JSON_BASE64 secret not set — Android build needs google-services.json (gitignored)."
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > google-services.json
          echo "Wrote google-services.json ($(wc -c < google-services.json) bytes)"

      - name: Build signed release AAB (prod)
        working-directory: app/ratel-tauri
        env:
          ENV: prod
          MOBILE_API_URL: https://ratel.foundation
          ANDROID_TARGET: aarch64-linux-android
          DYNAMO_TABLE_PREFIX: ratel-prod
          RUSTFLAGS: "-D warnings"
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          PORTONE_STORE_ID: ${{ secrets.PORTONE_STORE_ID }}
          PORTONE_INICIS_CHANNEL_KEY: ${{ secrets.PROD_PORTONE_INICIS_CHANNEL_KEY }}
          PORTONE_KPN_CHANNEL_KEY: ${{ secrets.PORTONE_KPN_BILLING_KEY_CHANNEL_KEY }}
          PORTONE_API_SECRET: ${{ secrets.PORTONE_API_SECRET }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MEASUREMENT_ID: ${{ secrets.FIREBASE_MEASUREMENT_ID }}
          WALLETCONNECT_PROJECT_ID: ${{ secrets.WALLETCONNECT_PROJECT_ID }}
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_REGION: ap-northeast-2
          AWS_ACCOUNT_ID: test
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/29.0.14206865"
          export NDK_HOME="$ANDROID_NDK_HOME"
          echo "versionCode=$ANDROID_VERSION_CODE versionName=$ANDROID_VERSION_NAME"
          make release-aab
          echo "AAB:"
          find src-tauri/gen/android -name 'app-universal-release.aab' -print

      - name: Upload to Google Play (internal track)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: co.biyard.ratel
          releaseFiles: app/ratel-tauri/src-tauri/gen/android/app/build/outputs/bundle/universalRelease/app-universal-release.aab
          tracks: internal
          status: completed

      - name: Remove signing files from the workspace
        if: always()
        working-directory: app/ratel-tauri
        run: |
          rm -f src-tauri/gen/android/upload-keystore.jks src-tauri/gen/android/keystore.properties \
            google-services.json src-tauri/gen/android/app/google-services.json

  ios-release:
    if: inputs.platform == 'both' || inputs.platform == 'ios'
    needs: guard
    runs-on: ratel-mac
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          submodules: recursive
          ssh-key: ${{ secrets.PULL_KEY_REPO_V2 }}

      - name: Use the Mac's Homebrew and cargo tools
        run: |
          for dir in /opt/homebrew/bin "$HOME/.cargo/bin"; do
            if [ -d "$dir" ]; then echo "$dir" >> "$GITHUB_PATH"; fi
          done

      # Apple requires the iOS 26 SDK (Xcode 26+) for App Store uploads.
      - name: Select Xcode 26+
        run: |
          best=""
          best_key=0
          for app in /Applications/Xcode*.app; do
            [ -d "$app" ] || continue
            version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist" 2>/dev/null || true)
            key=$(echo "$version" | awk -F. '$1 ~ /^[0-9]+$/ { printf "%d", $1 * 10000 + $2 * 100 + $3 }')
            if [ -n "$key" ] && [ "$key" -ge 260000 ] && [ "$key" -gt "$best_key" ]; then
              best="$app"
              best_key="$key"
            fi
          done
          if [ -z "$best" ]; then
            echo "::error::Xcode 26 or later is required (App Store uploads need the iOS 26 SDK). Install it into /Applications."
            exit 1
          fi
          echo "DEVELOPER_DIR=$best/Contents/Developer" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$best/Contents/Developer" xcodebuild -version
          DEVELOPER_DIR="$best/Contents/Developer" xcodebuild -showsdks | grep -i ios

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Rust targets + tauri-cli + xcodegen
        run: |
          rustup target add wasm32-unknown-unknown aarch64-apple-ios
          command -v cargo-tauri >/dev/null || cargo install --locked tauri-cli --version "^2.0.0"
          command -v xcodegen >/dev/null || brew install xcodegen

      - name: Enable corepack + install pnpm workspace deps
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Import signing certificate & provisioning profile
        env:
          IOS_DIST_CERT_BASE64: ${{ secrets.IOS_DIST_CERT_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/dist_cert.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          PROFILE_PATH="$PROFILES_DIR/ci-appstore.mobileprovision"

          echo "$IOS_DIST_CERT_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "SIGNING_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$IOS_DIST_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          rm -f "$CERT_PATH"

          # A Mac that already holds this identity in its login keychain would
          # see it twice on the search list, and codesign rejects an
          # ambiguous identity. Add the CI keychain only when it is missing.
          identity=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk '$2 ~ /^[0-9A-F]{40}$/ { print $2; exit }')
          if [ -n "$identity" ] && security find-identity -v -p codesigning login.keychain-db | grep -q "$identity"; then
            echo "The distribution identity is already in the login keychain; signing with that copy."
          else
            security list-keychains -d user | sed -e 's/^[[:space:]]*"//' -e 's/"$//' > "$RUNNER_TEMP/keychains.before"
            keychains=()
            while IFS= read -r keychain; do keychains+=("$keychain"); done < "$RUNNER_TEMP/keychains.before"
            security list-keychains -d user -s "$KEYCHAIN_PATH" "${keychains[@]}"
            echo "RESTORE_KEYCHAINS=$RUNNER_TEMP/keychains.before" >> "$GITHUB_ENV"
          fi

          mkdir -p "$PROFILES_DIR"
          if [ ! -e "$PROFILE_PATH" ]; then
            echo "$IOS_PROVISION_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
            echo "REMOVE_PROFILE=$PROFILE_PATH" >> "$GITHUB_ENV"
          fi

      - name: Write App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
        run: |
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          mkdir -p "$(dirname "$KEY_PATH")"
          if [ -e "$KEY_PATH" ]; then
            echo "The App Store Connect key is already on this Mac; leaving it in place."
          else
            echo "$ASC_API_KEY_BASE64" | base64 --decode > "$KEY_PATH"
            echo "REMOVE_ASC_KEY=$KEY_PATH" >> "$GITHUB_ENV"
          fi

      - name: Write GoogleService-Info.plist (iOS Firebase client config)
        working-directory: app/ratel-tauri
        env:
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICE_INFO_PLIST_BASE64" ]; then
            echo "::error::GOOGLE_SERVICE_INFO_PLIST_BASE64 secret not set — iOS build needs GoogleService-Info.plist (gitignored)."
            exit 1
          fi
          echo "$GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 --decode > GoogleService-Info.plist
          echo "Wrote GoogleService-Info.plist ($(wc -c < GoogleService-Info.plist) bytes)"

      - name: Build & upload to TestFlight (prod)
        working-directory: app/ratel-tauri
        env:
          ENV: prod
          MOBILE_API_URL: https://ratel.foundation
          DYNAMO_TABLE_PREFIX: ratel-prod
          RUSTFLAGS: "-D warnings"
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          PORTONE_STORE_ID: ${{ secrets.PORTONE_STORE_ID }}
          PORTONE_INICIS_CHANNEL_KEY: ${{ secrets.PROD_PORTONE_INICIS_CHANNEL_KEY }}
          PORTONE_KPN_CHANNEL_KEY: ${{ secrets.PORTONE_KPN_BILLING_KEY_CHANNEL_KEY }}
          PORTONE_API_SECRET: ${{ secrets.PORTONE_API_SECRET }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MEASUREMENT_ID: ${{ secrets.FIREBASE_MEASUREMENT_ID }}
          WALLETCONNECT_PROJECT_ID: ${{ secrets.WALLETCONNECT_PROJECT_ID }}
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_REGION: ap-northeast-2
          AWS_ACCOUNT_ID: test
        run: |
          make testflight \
            APPLE_DEVELOPMENT_TEAM=7P4Z67D4N7 \
            ASC_KEY_ID=${{ secrets.ASC_KEY_ID }} \
            ASC_ISSUER_ID=${{ secrets.ASC_ISSUER_ID }}

      - name: Remove signing material from this Mac
        if: always()
        run: |
          if [ -n "${RESTORE_KEYCHAINS:-}" ] && [ -f "$RESTORE_KEYCHAINS" ]; then
            keychains=()
            while IFS= read -r keychain; do keychains+=("$keychain"); done < "$RESTORE_KEYCHAINS"
            security list-keychains -d user -s "${keychains[@]}"
          fi
          if [ -n "${SIGNING_KEYCHAIN:-}" ] && [ -e "$SIGNING_KEYCHAIN" ]; then
            security delete-keychain "$SIGNING_KEYCHAIN" || true
          fi
          if [ -n "${REMOVE_PROFILE:-}" ]; then rm -f "$REMOVE_PROFILE"; fi
          if [ -n "${REMOVE_ASC_KEY:-}" ]; then rm -f "$REMOVE_ASC_KEY"; fi
          rm -f app/ratel-tauri/GoogleService-Info.plist app/ratel-tauri/src-tauri/gen/apple/GoogleService-Info.plist
