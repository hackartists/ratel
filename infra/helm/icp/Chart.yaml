apiVersion: v2
name: icp
description: >-
  ICP replica subnet for Ratel on the home k3s cluster. Runs the
  `victor138128/ic` fork (branch feature/v4-block-api, replica 0.9.0) as a
  StatefulSet in the shared `infra` namespace, so the same nodes serve BOTH
  the app (app-shell reaches it via IC_URL) and the IITP tc2 throughput
  measurement (which reads finalized blocks through the fork-only
  /api/v4/height and /api/v4/blocks endpoints).

  Single-node (replicaCount: 1) is enough for app integration; the tc2
  measurement needs a real subnet, so set replicaCount to 4 — the metric is
  "votes included in FINALIZED blocks", which only exists where consensus
  runs.
type: application
version: 0.1.0
appVersion: "0.9.0"
