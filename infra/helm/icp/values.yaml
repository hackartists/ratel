# icp — ICP replica subnet (victor138128/ic @ feature/v4-block-api)
#
# Defaults deploy a SINGLE node into ns `infra`, internal-only. That is what
# the app needs. Flip replicaCount to 4 (see environments/tc2.yaml) when you
# need consensus — i.e. for the IITP tc2 measurement.

nameOverride: ""
namespace: infra

# Nodes in the subnet. 1 = app integration, 4 = real consensus (n=3f+1, f=1).
replicaCount: 1

image:
  # Built by the `ICP image` workflow from deploy/dev/Dockerfile.icp and
  # pushed to the in-cluster registry as :dev-<sha> AND :dev.
  repository: registry.infra.svc.cluster.local:5000/ratel-icp
  # A MUTABLE tag, unlike app-shell's :dev-<sha>. That is deliberate — the
  # image is rebuilt on its own schedule, not per ratel commit, so pinning a
  # ratel sha here would be meaningless.
  #
  # It does mean pullPolicy has to be Always: with IfNotPresent a node that
  # already cached :dev would keep running the old replica forever, and a
  # rebuilt image would silently never reach the cluster. Pin a :dev-<sha>
  # tag here instead if you want IfNotPresent back.
  tag: "dev"
  pullPolicy: Always

replicaVersion: "0.9.0"

# One-shot subnet bootstrap (templates/genconfig-job.yaml).
#
# genconfig mints fresh keys and a fresh subnet id every run, so it must run
# exactly once for the whole subnet — never per pod. The Job stores its output
# in the `<name>-subnet` Secret and each replica unpacks the same copy.
#
# It runs as a pre-install hook only. `helm upgrade` will NOT regenerate,
# because a new registry means a new chain from height 0 and a redeployed
# canister. To rebuild deliberately:
#   kubectl -n infra delete secret icp-subnet
#   kubectl -n infra delete pvc -l app.kubernetes.io/name=icp
subnet:
  # Rebuilding the subnet — which is what changing replicaCount forces, since
  # the registry fixes membership when it is generated — discards the chain
  # and every canister on it. The genconfig Job refuses to do that implicitly:
  # it compares replicaCount against the node count recorded on the
  # `<name>-subnet` Secret and fails if they disagree.
  #
  # Set true for ONE deploy to go through with it.
  allowRebuild: false

genconfig:
  # Needs kubectl only; kept off the replica image on purpose. alpine/k8s
  # ships arm64 AND a shell — rancher/kubectl has no /bin/sh, so the publish
  # step there dies with "stat /bin/sh: no such file or directory".
  kubectlImage: alpine/k8s:1.31.2

ports:
  # Public HTTP API + the fork-only /api/v4/* block endpoints. The tc2
  # injector and app-shell both talk to this port.
  http: 4100
  # XNet (inter-subnet message routing). Single-subnet setups still bind it.
  xnet: 4101
  # P2P is QUIC over UDP on the same number as http (the ic-testnet
  # generator's convention: TCP 4100 = HTTP, UDP 4100 = QUIC).
  p2pUdp: 4100

# ── Node addressing ────────────────────────────────────────────────────────
#
# The replica binds sockets to addresses taken from its config file
# (rs/config: http_handler.listen_addr, message_routing.xnet_ip_addr), so
# those are set to 0.0.0.0 and pod IPs never matter for binding.
#
# What DOES need a stable address is the registry: peers dial each other at
# whatever the subnet registry recorded. Pod IPs change on every restart, so
# each pod gets its own Service with a PINNED ClusterIP and the registry is
# generated against those. Pick free addresses inside the cluster's Service
# CIDR (k3s default 10.43.0.0/16) — same idea as the fixed private IPs the
# EC2 testbed uses.
#
# ⚠️ VERIFY ON FIRST DEPLOY: XNet and the HTTP API take their bind address
# from the config file, but P2P/QUIC appears to bind the address the registry
# advertises. If pod startup panics with
#   "failed to bind ... Cannot assign requested address"
# then the ClusterIP cannot be bound inside the pod, and the fallback is to
# regenerate the subnet config from live pod IPs at startup instead
# (set addressing.mode: podIp — see templates/entrypoint-configmap.yaml).
addressing:
  # clusterIp = pinned Service ClusterIPs (stable across restarts)
  # podIp     = regenerate config from live pod IPs on every start (ephemeral
  #             subnet; state is discarded, canister must be redeployed)
  mode: clusterIp
  # One entry per replica. Must be free in the Service CIDR.
  clusterIPs:
    - 10.43.100.11
    - 10.43.100.12
    - 10.43.100.13
    - 10.43.100.14

persistence:
  enabled: true
  # k3s ships local-path as the default StorageClass.
  storageClass: local-path
  # The replica keeps its consensus pool (LMDB) + state checkpoints here.
  size: 40Gi

resources:
  # Deliberately modest. During the EC2 tc2 run (100k votes, 4,275 TPS
  # inclusion) node-1 sat at load average ~0.9 on a 64-vCPU box, so the
  # 64 vCPU / 256 GB sizing that testbed inherited was heavily over-spec.
  # Start here, watch, and raise if the subnet stalls under injection.
  requests:
    cpu: "2"
    memory: 4Gi
  limits:
    cpu: "8"
    memory: 16Gi

# The cluster's Pi node runs a 16K-page kernel that jemalloc-based services
# abort on; every ratel/asset pod is pinned to the 4K-page main node.
nodeSelector:
  biyard.io/node-class: main

tolerations: []
affinity: {}

# ── Exposure ───────────────────────────────────────────────────────────────
#
# There is none, and there is no switch for one.
#
# A local ICP replica has NO authentication of its own: the provisional
# management API is enabled, so anyone who reaches it may create canisters and
# install arbitrary wasm. The canister's own methods are the only guard —
# every `#[ic_cdk::update]` in packages/ratel-canister calls
# require_controller() — but every query method is open.
#
# The one thing that wanted the subnet exposed was the tc2 throughput
# measurement, back when the injector was going to run from EC2. It runs in
# this namespace now (see `injector` below), so the reason is gone and the
# Ingress went with it. Nothing outside the cluster network reaches the
# subnet, and adding a host back would be a deliberate change with its own
# review rather than a values flag someone can flip.
#
# For a one-off look from a laptop:
#   kubectl -n infra port-forward svc/icp 4100:4100

# ── tc2 측정 ───────────────────────────────────────────────────────
#
# 측정 도구는 이 차트에 없다. biyard/iitp-verification 의 tc2 가 자기
# 네임스페이스에 파드를 띄워 쏜다(`make k8s.measure`).
#
# 한동안은 여기에 주입기 Job 템플릿이 있었다. NetworkPolicy 가 infra 안의
# 파드만 허용했고 infra 는 CI 밖에서 쓰기가 안 돼서, 워크플로를 거치는 것이
# 유일한 길이었기 때문이다. 그 정책의 허용 규칙이 이 클러스터에서 작동하지
# 않아 ingress 제한을 걷어냈고, 그 시점에 이유가 사라졌다. 같은 측정을 두
# 곳에서 할 수 있게 두면 어느 쪽이 정본인지 흐려진다.


# Deny-by-default egress/ingress for the pods. The replica sits next to
# postgres/minio/registry in `infra`; without a policy a canister running
# arbitrary wasm shares that network.
networkPolicy:
  enabled: true

  # Off, because ingress rules do not work on this cluster.
  #
  # Not an inference from the subnet's own behaviour — measured in isolation.
  # A plain server pod in a personal namespace, a policy admitting exactly one
  # label on one port, and two clients:
  #
  #   with the policy, client labelled to match      → refused
  #   with the policy, client labelled not to match  → refused
  #   policy deleted, same client                    → 200
  #
  # A `policyTypes: [Ingress]` policy blocks everything that reaches the pods
  # it selects, whatever its rules say. podSelector and namespaceSelector both
  # behave this way; earlier evidence that podSelector worked was peer traffic
  # on UDP, which the peer rule admits without a port restriction and which
  # says nothing about TCP.
  #
  # So the choice is not between a tight rule and a loose one. It is between
  # no ingress restriction and a subnet nothing can call — including
  # app-shell, once a poll actually enables IC upload. Moving the subnet into
  # the app's namespace would not change this; that was checked before it was
  # attempted.
  #
  # Egress stays on, and that is the half that carries the weight: the replica
  # reaches its peers and DNS and nothing else, so postgres, minio and the
  # registry beside it stay out of reach even from a canister someone installs
  # through the open provisional API.
  #
  # What is left exposed, and is not fixable here: anything in the cluster can
  # call the replica, and `ic-testnet` builds the registry with
  # `ProvisionalWhitelist::All`, so anything in the cluster can create a
  # canister on it. Closing that belongs in the registry — a specific
  # principal instead of All — not in a network rule that does not fire.
  restrictIngress: false
  # No in-cluster caller is admitted. Only the subnet's own pods talk to the
  # subnet, and that peer rule is the one thing here known to work — the four
  # nodes reach consensus through it.
  #
  # This started as a namespaceSelector list (ratel-dev, infra, dev-victor).
  # It did not work: a caller in an admitted namespace got `Connection
  # refused` in under a millisecond, while services in the same namespace
  # with no policy answered fine and the replica's own readiness probe kept
  # passing. The admitted port and an un-admitted one failed identically, so
  # the rule was not taking effect at all. This cluster's policy controller
  # appears to honour podSelector peers and not namespaceSelector ones.
  #
  # The list is gone rather than widened. It existed for the tc2 injector,
  # which is a Job in this namespace now and is admitted by podSelector.
  #
  # app-shell in `ratel-dev` is the one genuinely cross-namespace caller, and
  # it is not admitted either. Nothing is blocked on that today — IC upload is
  # opt-in per poll (`canister_upload_enabled`, default false), so no poll
  # calls the subnet yet. When one does, it needs its own decision rather than
  # a rule widened here in advance.
  #
  # The shape matches the one other chart in the org that has a NetworkPolicy:
  # asset's litellm admits `app-server` and `evaluation` by podSelector and
  # keeps every caller in one namespace.
  #
  # Note for anyone reading the history: this policy does apply to traffic
  # arriving over the cluster VPN, not only to pod-sourced traffic. Removing
  # the old namespaceSelector rule showed it — a workstation that had been
  # reading /api/v4/height started getting `Connection refused` in 0 ms while
  # `adminer`, unpolicied in the same namespace, kept answering 200. Nothing
  # here depends on VPN reach any more, since the injector runs in-cluster,
  # but a laptop can no longer poke the subnet directly. Use
  # `kubectl -n infra port-forward svc/icp 4100:4100`.

serviceAccount:
  create: true
  # The replica never talks to the k8s API.
  automountServiceAccountToken: false
