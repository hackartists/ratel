# tc2 — IITP 투표 TPS 측정용. 4노드(n=3f+1, f=1) 서브넷.
replicaCount: 4
addressing:
  mode: clusterIp
# ⚠️ 60Gi 도 추정치다. EC2 는 128GB 볼륨이었지만 거기엔 IC 소스와 빌드 캐시
# (21GB)가 함께 들어 있었다. 체인 상태(합의 풀 LMDB + 체크포인트)만이면 훨씬
# 작을 수 있으니, 며칠 운영하며 증가율을 보고 정하라.
persistence:
  enabled: true
  size: 60Gi
resources:
  # Sized so four pods actually SCHEDULE on the home cluster. The earlier
  # guess (requests cpu 4) did not: with two pods placed the third sat in
  # Pending with "Insufficient cpu", and only dropping requests got all four
  # running. Requests are a scheduling floor, not a cap — limits are what
  # bound actual usage.
  #
  # This is enough to run the subnet and prove the tc2 path end to end (a
  # 100-vote injection landed 100/100 in finalized blocks here). It is NOT
  # sized for a real 2,000 TPS measurement — that wants a dedicated node, and
  # the numbers should come from `kubectl -n <ns> top pod --containers` taken
  # during an actual injection rather than from a guess.
  requests: { cpu: "300m", memory: 1Gi }
  limits:   { cpu: "4",    memory: 8Gi }
ingress:
  enabled: false
