# Startup script.
#
# The subnet registry and node keys come from the pre-install genconfig Job
# via the `-subnet` Secret — generating per pod would put each replica in its
# own subnet, since genconfig mints fresh keys and a fresh subnet id on every run.
#
# Verified locally against a 4-node subnet built from these exact steps
# (arm64, same binaries): all four nodes reached the same height and each saw
# 3 peers.
#
# Per-pod work:
#   1. work out which node it is, from the StatefulSet ordinal
#   2. unpack the shared material into its own volume (first boot only)
#   3. copy `state` to `state-<node-id>` — the replica reads its crypto from
#      there, and without it start-up dies with
#      "Crypto state directory does not exist"
#   4. point the HTTP listener at 0.0.0.0; the registry advertises a
#      ClusterIP, which is virtual and cannot be bound inside the pod
#
# Note on what is NOT rewritten here:
#   * transport.node_ip is already 0.0.0.0 — genconfig emits it that way, so
#     P2P/QUIC needs no help.
#   * message_routing is null in the generated config and unused; XNet takes
#     its bind address from the registry instead, which is why the container
#     sets XNET_BIND_ADDR (see statefulset.yaml).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "icp.name" . }}-entrypoint
  namespace: {{ .Values.namespace }}
  labels: {{- include "icp.labels" . | nindent 4 }}
data:
  entrypoint.sh: |
    #!/usr/bin/env bash
    set -euo pipefail

    ORDINAL="${HOSTNAME##*-}"
    NODE_ID=$((100 + ORDINAL))
    BASE_DIR=/data/tmp
    CFG="$BASE_DIR/ic-$NODE_ID.json5"
    REPLICAS={{ .Values.replicaCount }}

    echo "[icp] pod=$HOSTNAME ordinal=$ORDINAL node=$NODE_ID mode={{ .Values.addressing.mode }}"

    if [ ! -f "$CFG" ]; then
      mkdir -p "$BASE_DIR"
    {{- if eq .Values.addressing.mode "clusterIp" }}
      echo "[icp] unpacking shared subnet material"
      tar xzf /subnet/subnet.tar.gz -C "$BASE_DIR"
    {{- else }}
      # Single node only (guarded in statefulset.yaml): nothing to coordinate,
      # so it can mint its own subnet. BASE_DIR must match the runtime path —
      # genconfig writes the paths it is given straight into the config.
      echo "[icp] single-node mode — generating a local subnet"
      MY_IP="$(hostname -i | awk '{print $1}')"
      cd /data && NODES="$MY_IP" BASE_DIR="$BASE_DIR" /usr/local/bin/ic-testnet-genconfig
    {{- end }}

      for i in $(seq 0 $((REPLICAS - 1))); do
        n=$((100 + i))
        rm -rf "$BASE_DIR/state-$n"
        cp -rf "$BASE_DIR/state" "$BASE_DIR/state-$n"
      done
      echo "[icp] prepared state-100..$((100 + REPLICAS - 1))"
    else
      echo "[icp] reusing existing config $CFG"
    fi

    # Only http_handler carries a bindable address. Keys that genconfig leaves
    # null are left alone — `setdefault` on a null value returns the null and
    # then blows up.
    python3 - "$CFG" <<'PY'
    import json5, sys
    p = sys.argv[1]
    cfg = json5.loads(open(p).read())
    h = cfg.get("http_handler") or {}
    h["listen_addr"] = "0.0.0.0:{{ .Values.ports.http }}"
    cfg["http_handler"] = h
    open(p, "w").write(json5.dumps(cfg))
    print("[icp] http listener rewritten to 0.0.0.0")
    PY

    ulimit -n 1048576 || true

    # Run the replica as a CHILD, not via exec. Under exec it becomes PID 1,
    # and PID 1 is the session leader — its setpgid() then fails and start-up
    # aborts with:
    #   Failed to setup a new process group for replica.
    #   Error: Custom { kind: Other, error: EPERM }
    # (The EC2 testbed sidesteps this by launching under `setsid bash -c`,
    # where the replica is likewise a child.)
    #
    # Keeping the shell as PID 1 means signals stop here, so forward them —
    # killing the replica mid-write is how dev canister state was lost once.
    /usr/local/bin/replica \
      --replica-version {{ .Values.replicaVersion }} \
      --config-file "$CFG" &
    REPLICA_PID=$!
    trap 'kill -TERM "$REPLICA_PID" 2>/dev/null' TERM INT
    wait "$REPLICA_PID"
