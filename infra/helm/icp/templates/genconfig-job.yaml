{{- if eq .Values.addressing.mode "clusterIp" }}
# One-shot subnet bootstrap.
#
# genconfig mints fresh node keys and a fresh subnet id on every run, so it
# must run EXACTLY ONCE for the whole subnet — if each pod ran it against its
# own volume, the four replicas would end up in four different subnets and
# consensus would never form. (Confirmed on the EC2 testbed: two consecutive
# genconfig runs produced completely different node ids.)
#
# It can run before any pod exists because the peer addresses are the pinned
# ClusterIPs from values.yaml, not pod IPs. The output is tarred into a Secret
# that every replica mounts and unpacks on first start.
#
# Runs as a pre-install hook only. `helm upgrade` deliberately does NOT
# regenerate: a new registry means a new chain from height 0 and a redeployed
# canister. To rebuild the subnet on purpose, delete the Secret and the PVCs.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "icp.name" . }}-genconfig
  namespace: {{ .Values.namespace }}
  labels: {{- include "icp.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "icp.name" . }}-genconfig
  namespace: {{ .Values.namespace }}
  labels: {{- include "icp.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
rules:
  # Only the one Secret this chart owns.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "patch", "delete"]
  # Only needed for a deliberate subnet rebuild (subnet.allowRebuild): the
  # chain lives on these volumes, so a new registry means they must go too.
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "delete"]
  # And the StatefulSet itself — most of its spec is immutable once created
  # (volumeClaimTemplates above all), so a rebuild that changes any of those
  # has to recreate it rather than patch it. Helm makes it again right after.
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "icp.name" . }}-genconfig
  namespace: {{ .Values.namespace }}
  labels: {{- include "icp.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
subjects:
  - kind: ServiceAccount
    name: {{ include "icp.name" . }}-genconfig
    namespace: {{ .Values.namespace }}
roleRef:
  kind: Role
  name: {{ include "icp.name" . }}-genconfig
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "icp.name" . }}-genconfig
  namespace: {{ .Values.namespace }}
  labels: {{- include "icp.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 2
  # The completed pod otherwise lingers in `infra` forever, one per install.
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      # Deliberately NOT `icp.labels`: those carry `icp.selectorLabels`, which
      # is exactly what the NetworkPolicy's podSelector matches. A hook pod
      # wearing them inherits the node egress rules — icp peers and DNS only —
      # so the `publish` step cannot reach the API server to write the
      # `icp-subnet` Secret. This survived the first install because
      # pre-install hooks run before the NetworkPolicy exists; the first
      # pre-upgrade after it failed with
      #   dial tcp 10.43.0.1:443: connect: connection refused
      #
      # The generator is not a subnet node and never talks to one, so it has
      # no business matching that selector. Same ownership, different name.
      labels:
        app.kubernetes.io/name: {{ include "icp.name" . }}-genconfig
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/managed-by: {{ .Release.Service }}
        app.kubernetes.io/component: genconfig
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "icp.name" . }}-genconfig
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      # Step 1 — generate. Uses the replica image because that is where the
      # ic-testnet generator lives.
      initContainers:
        - name: genconfig
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              NODES="{{ include "icp.peerAddrs" . }}"
              echo "[genconfig] subnet nodes: $NODES"
              mkdir -p /work
              cd /work
              # genconfig writes its output to $PWD/tmp, but stamps BASE_DIR
              # into the config files as the paths the replica will later read.
              # Those must be the PODS' paths (/data/tmp), not this Job's —
              # otherwise every replica dies with
              # "Crypto state directory does not exist".
              NODES="$NODES" BASE_DIR=/data/tmp /usr/local/bin/ic-testnet-genconfig
              # Ship only `state` and the per-node json5 files; the
              # state-10X copies are made by each pod from `state`, so
              # duplicating them here would just bloat the Secret.
              # cd first — `tar -C` moves tar's working directory, not the
              # shell's, so a glob written here would expand against /work.
              (cd /work/tmp && tar czf /work/subnet.tar.gz state ic-*.json5)
              ls -lh /work/subnet.tar.gz
          volumeMounts:
            - name: work
              mountPath: /work
      # Step 2 — publish. Separate image so the replica image does not have
      # to carry kubectl.
      containers:
        - name: publish
          image: "{{ .Values.genconfig.kubectlImage }}"
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              SECRET={{ include "icp.name" . }}-subnet
              WANT={{ .Values.replicaCount }}
              LABEL=icp.biyard.co/nodes

              create() {
                kubectl -n {{ .Values.namespace }} create secret generic "$SECRET" \
                  --from-file=subnet.tar.gz=/work/subnet.tar.gz
                kubectl -n {{ .Values.namespace }} label secret "$SECRET" "$LABEL=$WANT"
                echo "[genconfig] published $SECRET for $WANT node(s)"
              }

              if ! kubectl -n {{ .Values.namespace }} get secret "$SECRET" >/dev/null 2>&1; then
                create
                exit 0
              fi

              HAVE=$(kubectl -n {{ .Values.namespace }} get secret "$SECRET" \
                       -o jsonpath="{.metadata.labels.icp\.biyard\.co/nodes}" 2>/dev/null || true)
              HAVE=${HAVE:-unknown}

              if [ "$HAVE" = "$WANT" ]; then
                echo "[genconfig] $SECRET already covers $WANT node(s) — keeping the existing chain."
                exit 0
              fi

              # The registry fixes the subnet membership at generation time, so
              # a different node count needs a new registry — and a new registry
              # is a new chain from height 0, which the existing volumes would
              # contradict. Never do that implicitly.
              echo "[genconfig] subnet is built for '$HAVE' node(s) but replicaCount is $WANT."
              if [ "{{ .Values.subnet.allowRebuild }}" != "true" ]; then
                echo
                echo "  Rebuilding discards the chain and every canister on it."
                echo "  To go ahead, deploy once with --set subnet.allowRebuild=true,"
                echo "  or do it by hand:"
                echo "    kubectl -n {{ .Values.namespace }} delete secret $SECRET"
                echo "    kubectl -n {{ .Values.namespace }} delete pvc -l app.kubernetes.io/name={{ include "icp.name" . }}"
                exit 1
              fi

              echo "[genconfig] allowRebuild=true — discarding the old subnet and its chain"
              kubectl -n {{ .Values.namespace }} delete secret "$SECRET"
              # --cascade=orphan would leave the pods holding the old volumes;
              # let them go with it.
              kubectl -n {{ .Values.namespace }} delete statefulset {{ include "icp.name" . }} \
                --ignore-not-found --wait=true
              kubectl -n {{ .Values.namespace }} delete pvc \
                -l app.kubernetes.io/name={{ include "icp.name" . }} --ignore-not-found
              create
          volumeMounts:
            - name: work
              mountPath: /work
      volumes:
        - name: work
          emptyDir: {}
{{- end }}
