{{- if .Values.ingress.enabled }}
{{- if not .Values.ingress.whitelistSourceRange }}
{{- fail "ingress.enabled=true requires ingress.whitelistSourceRange — a local ICP replica has no authentication and its provisional management API lets anyone create canisters and install arbitrary wasm. Set an allowlist, or keep it internal and use `kubectl -n infra port-forward svc/icp 4100:4100`." }}
{{- end }}
{{- if not .Values.ingress.domain }}
{{- fail "ingress.enabled=true requires ingress.domain — hosts are derived per node as <name>-<ordinal>.<domain>." }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "icp.name" . }}
  namespace: {{ .Values.namespace }}
  labels: {{- include "icp.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.ingress.clusterIssuer }}
    nginx.ingress.kubernetes.io/whitelist-source-range: {{ .Values.ingress.whitelistSourceRange | quote }}
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
spec:
  ingressClassName: nginx
  # One host per node, not one host for the Service.
  #
  # The tc2 injector addresses nodes individually: it submits to each and then
  # reads that node's own /api/v4/height and /api/v4/blocks to count what made
  # it into finalized blocks. Behind a single round-robining host those reads
  # would land on whichever node the proxy picked, and the inclusion count
  # would be assembled from four different chains' worth of answers.
  rules:
    {{- $name := include "icp.name" . }}
    {{- $domain := .Values.ingress.domain }}
    {{- range $i := until (int .Values.replicaCount) }}
    - host: {{ printf "%s-%d.%s" $name $i $domain | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ printf "%s-%d" $name $i }}
                port:
                  name: http
    {{- end }}
  tls:
    - hosts:
        {{- range $i := until (int .Values.replicaCount) }}
        - {{ printf "%s-%d.%s" $name $i $domain | quote }}
        {{- end }}
      secretName: {{ include "icp.name" . }}-tls
{{- end }}
