# Three kinds of Service, each for a different consumer:
#
#   icp           — the API endpoint everything else uses (app-shell's IC_URL,
#                   the tc2 injector, port-forward). Load-balances across
#                   replicas; any node answers /api/v2 and /api/v4.
#   icp-headless  — stable per-pod DNS (icp-0.icp-headless...), required by
#                   the StatefulSet.
#   icp-<n>       — one per replica with a PINNED ClusterIP. This is the
#                   address the subnet registry records, so peers keep
#                   reaching each other across restarts even though pod IPs
#                   churn. Skipped when addressing.mode is podIp.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "icp.name" . }}
  namespace: {{ .Values.namespace }}
  labels: {{- include "icp.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector: {{- include "icp.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.ports.http }}
      targetPort: http
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "icp.name" . }}-headless
  namespace: {{ .Values.namespace }}
  labels: {{- include "icp.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true   # peers must resolve before readiness
  selector: {{- include "icp.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.ports.http }}
      protocol: TCP
    - name: xnet
      port: {{ .Values.ports.xnet }}
      protocol: TCP
    - name: p2p
      port: {{ .Values.ports.p2pUdp }}
      protocol: UDP
{{- if eq .Values.addressing.mode "clusterIp" }}
{{- range $i := until (int .Values.replicaCount) }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "icp.name" $ }}-{{ $i }}
  namespace: {{ $.Values.namespace }}
  labels: {{- include "icp.labels" $ | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: {{ index $.Values.addressing.clusterIPs $i }}
  publishNotReadyAddresses: true
  selector:
    {{- include "icp.selectorLabels" $ | nindent 4 }}
    statefulset.kubernetes.io/pod-name: {{ include "icp.name" $ }}-{{ $i }}
  ports:
    - name: http
      port: {{ $.Values.ports.http }}
      protocol: TCP
    - name: xnet
      port: {{ $.Values.ports.xnet }}
      protocol: TCP
    - name: p2p
      port: {{ $.Values.ports.p2pUdp }}
      protocol: UDP
{{- end }}
{{- end }}
