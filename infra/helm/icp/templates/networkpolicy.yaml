{{- if .Values.networkPolicy.enabled }}
# The replica executes arbitrary canister wasm, and it sits in the same
# namespace as postgres/minio/registry. Without a policy anything installed
# on it can reach those. Ingress is limited to the namespaces that legitimately
# call the API plus the subnet's own peer traffic; egress is limited to DNS
# and peers.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "icp.name" . }}
  namespace: {{ .Values.namespace }}
  labels: {{- include "icp.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "icp.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    # Peer-to-peer inside the subnet.
    - from:
        - podSelector:
            matchLabels: {{- include "icp.selectorLabels" . | nindent 14 }}
    {{- if .Values.ingress.enabled }}
    # ingress-nginx terminates the per-node hosts and proxies in here, so it
    # is a pod-sourced caller and does need admitting. It runs in this
    # namespace, which is what makes a podSelector rule reach it — the one
    # peer type this cluster's policy controller actually honours.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
      ports:
        - port: {{ .Values.ports.http }}
          protocol: TCP
    {{- else }}
    # No second rule: with the Ingress off, no in-cluster caller is admitted.
    # See the note in values.yaml.
    {{- end }}
  egress:
    - to:
        - podSelector:
            matchLabels: {{- include "icp.selectorLabels" . | nindent 14 }}
    # DNS only. The replica has no reason to reach the internet; canister
    # HTTP outcalls would need an explicit rule added here.
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
{{- end }}
