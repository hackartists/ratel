{{- if .Values.networkPolicy.enabled }}
# The replica executes arbitrary canister wasm, and it sits in the same
# namespace as postgres/minio/registry. Without a policy anything installed
# on it can reach those. Ingress is limited to the namespaces that legitimately
# call the API plus the subnet's own peer traffic; egress is limited to DNS
# and peers.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "icp.name" . }}
  namespace: {{ .Values.namespace }}
  labels: {{- include "icp.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "icp.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    # Peer-to-peer inside the subnet.
    - from:
        - podSelector:
            matchLabels: {{- include "icp.selectorLabels" . | nindent 14 }}
    # The tc2 injector, on the API port only.
    #
    # podSelector matches pods in this namespace and nowhere else, which is
    # exactly the intent: the injector is a Job in `infra`, not something a
    # personal namespace can stand in for. The namespaceSelector form would
    # have allowed that, but it does not work on this cluster — a caller in an
    # admitted namespace got `Connection refused` in under a millisecond while
    # unpolicied services in the same namespace answered fine, and the
    # admitted port failed exactly like an un-admitted one. The peer rule
    # above is podSelector too, and that one demonstrably works: the subnet
    # reaches consensus through it.
    #
    # The rule stands whether or not the Job exists. A label selector that
    # matches nothing admits nothing, and making it conditional would mean the
    # policy changes shape on a measurement run — a worse thing to reason
    # about than a rule that is simply always there.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: injector
      ports:
        - port: {{ .Values.ports.http }}
          protocol: TCP
  egress:
    - to:
        - podSelector:
            matchLabels: {{- include "icp.selectorLabels" . | nindent 14 }}
    # DNS only. The replica has no reason to reach the internet; canister
    # HTTP outcalls would need an explicit rule added here.
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
{{- end }}
