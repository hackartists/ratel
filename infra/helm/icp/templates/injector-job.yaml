{{- if .Values.injector.enabled }}
{{- if not .Values.injector.image }}
{{- fail "injector.enabled=true requires injector.image — an image without ratel-vote-tps in it would produce a Job that starts, does nothing, and reports success." }}
{{- end }}
{{- if ne .Values.addressing.mode "clusterIp" }}
{{- fail "injector.enabled=true requires addressing.mode=clusterIp — the injector reads each node's own /api/v4/blocks, which needs a stable per-node address." }}
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  # Named per revision so each run is its own Job. A completed Job is
  # immutable: reusing one name would mean the second measurement silently
  # did not happen.
  name: {{ include "icp.name" . }}-injector-{{ .Release.Revision }}
  namespace: {{ .Values.namespace }}
  labels: {{- include "icp.labels" . | nindent 4 }}
spec:
  backoffLimit: {{ .Values.injector.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.injector.ttlSecondsAfterFinished }}
  template:
    metadata:
      # `component: injector` is what the NetworkPolicy admits. Deliberately
      # not icp.selectorLabels — those belong to the subnet's own pods, and
      # wearing them would hand the injector the peer rule's full access
      # instead of the API port.
      labels:
        app.kubernetes.io/name: {{ include "icp.name" . }}-injector
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/managed-by: {{ .Release.Service }}
        app.kubernetes.io/component: injector
    spec:
      restartPolicy: Never
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: injector
          image: {{ .Values.injector.image | quote }}
          imagePullPolicy: {{ .Values.injector.imagePullPolicy }}
          # --nodes comes from the subnet's own pinned addresses rather than
          # from values, so it cannot drift from what was actually deployed.
          # The wasm ships in the image, built from the same commit as the
          # canister it deploys — a separately uploaded file would eventually
          # be measured against a canister it does not match.
          args:
            - --nodes
            - {{ include "icp.peerAddrs" . | quote }}
            - --wasm
            - /opt/ratel/ratel_canister.wasm
            {{- range (splitList " " .Values.injector.args) }}
            {{- if . }}
            - {{ . | quote }}
            {{- end }}
            {{- end }}
          resources: {{- toYaml .Values.injector.resources | nindent 12 }}
{{- end }}
